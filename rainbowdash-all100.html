<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>🌈 서연이 기말고사 올백 · 레인보우 대쉬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:linear-gradient(175deg,#cdeeff 0%,#e5f6ff 34%,#fff6e8 68%,#ffe6f2 100%);
    font-family:'Jua','Gowun Dodum',sans-serif;color:#1b2c4a;user-select:none;
  }
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

  /* Rainbow arch in sky */
  .rainbow-arch{
    position:fixed;left:50%;top:14%;width:min(130vw,920px);height:min(65vw,460px);
    transform:translateX(-50%);pointer-events:none;z-index:0;opacity:.34;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    background:conic-gradient(from 180deg at 50% 100%,
      transparent 0deg, transparent 0deg);
    box-shadow:
      inset 0 14px 0 0 #ff5964,
      inset 0 28px 0 0 #ff9f43,
      inset 0 42px 0 0 #ffd93d,
      inset 0 56px 0 0 #6bcb77,
      inset 0 70px 0 0 #4d96ff,
      inset 0 84px 0 0 #845ec2;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 55%,transparent 92%);
    mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 55%,transparent 92%);
  }

  /* Drifting clouds */
  .cloud-bg{
    position:fixed;border-radius:999px;background:rgba(255,255,255,.78);
    filter:blur(2px);pointer-events:none;z-index:0;
    box-shadow:0 8px 24px rgba(120,185,240,.18);
  }
  .c1{width:160px;height:48px;top:12%;left:-30px;animation:drift 22s linear infinite}
  .c2{width:210px;height:58px;top:24%;right:-40px;animation:drift2 28s linear infinite}
  .c3{width:140px;height:42px;bottom:14%;left:6%;animation:drift 26s linear infinite reverse}
  @keyframes drift{0%{transform:translateX(-20px)}50%{transform:translateX(40px)}100%{transform:translateX(-20px)}}
  @keyframes drift2{0%{transform:translateX(20px)}50%{transform:translateX(-40px)}100%{transform:translateX(20px)}}

  #sound{
    position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:30;
    width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.95);
    background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(70,135,210,.22);
    font-size:20px;cursor:pointer;display:grid;place-items:center;
    transition:transform .2s;
  }
  #sound:active{transform:scale(.9)}
  #sound.off{opacity:.58;filter:grayscale(1)}

  .stage{
    position:relative;z-index:5;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
    gap:clamp(6px,1.5vh,14px);
  }

  .head{text-align:center;line-height:1.1}
  .decor{font-size:clamp(18px,4.5vw,24px);letter-spacing:6px;margin-bottom:2px;filter:drop-shadow(0 2px 4px rgba(255,255,255,.9))}
  .twinkle{display:inline-block;animation:twinkle 2s ease-in-out infinite}
  .twinkle:nth-child(2){animation-delay:.5s}
  .twinkle:nth-child(3){animation-delay:1s}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.18) rotate(6deg)}}

  h1 .l1{
    display:block;font-size:clamp(22px,5.6vw,32px);color:#2d6cdf;
    letter-spacing:.14em;padding-left:.14em;
    text-shadow:0 2px 0 #fff,0 4px 12px rgba(60,130,230,.24);
  }
  h1 .l2{
    display:block;font-size:clamp(38px,11vw,64px);
    background:linear-gradient(90deg,#ff5964 0%,#ff9f43 24%,#f5c400 48%,#34c759 72%,#2d8cff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 4px 0 rgba(255,255,255,.92)) drop-shadow(0 8px 18px rgba(70,130,220,.28));
    padding:0 .06em 4px;
  }
  h1 .l2 em{
    font-style:normal;display:inline-block;
    background:linear-gradient(90deg,#34c759 0%,#2d8cff 50%,#9b5de5 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }

  .bubble-wrap{position:relative;max-width:min(92vw,420px);z-index:8}
  .bubble{
    position:relative;background:rgba(255,255,255,.96);
    border:2.5px solid #76c4ff;border-radius:22px;
    padding:12px 20px;font-size:clamp(16px,4.3vw,20px);line-height:1.38;
    text-align:center;color:#1b2c4a;
    box-shadow:0 10px 26px rgba(60,140,230,.18),inset 0 2px 0 #fff;
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%) rotate(45deg);
    width:18px;height:18px;background:rgba(255,255,255,.96);
    border-right:2.5px solid #76c4ff;border-bottom:2.5px solid #76c4ff;
  }
  .bubble.shine{animation:bubbleShine .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bubbleShine{0%{transform:scale(.92)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

  .hero-wrap{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;padding:6px 14px;
  }
  .rainboom-ring{
    position:absolute;left:50%;top:48%;width:120px;height:120px;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;z-index:1;
    background:radial-gradient(circle,transparent 40%,
      rgba(255,89,100,.65) 54%,rgba(255,217,61,.65) 64%,
      rgba(107,203,119,.65) 74%,rgba(77,150,255,.75) 84%,transparent 96%);
  }
  .rainboom-ring.boom{animation:boom .72s cubic-bezier(.16,.84,.3,1) forwards}
  @keyframes boom{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:.95}
    100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}
  }

  .pony{
    position:relative;z-index:3;
    height:clamp(200px,38vh,360px);width:auto;max-width:86vw;object-fit:contain;
    filter:drop-shadow(0 12px 22px rgba(45,120,210,.26));
    animation:hoverFloat 2.8s ease-in-out infinite;
    transform-origin:center bottom;
  }
  @keyframes hoverFloat{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-10px) rotate(1.5deg)}
  }
  .pony.jump{animation:dashJump .62s cubic-bezier(.22,1.28,.45,1)}
  @keyframes dashJump{
    0%{transform:scale(1,1) translateY(0)}
    20%{transform:scale(1.08,.9) translateY(6px)}
    48%{transform:scale(.95,1.06) translateY(-34px) rotate(-4deg)}
    72%{transform:scale(1.04,.96) translateY(-10px) rotate(2deg)}
    100%{transform:scale(1,1) translateY(0)}
  }

  .tag{
    margin-top:6px;padding:4px 16px;border-radius:999px;
    background:linear-gradient(90deg,#3ea6ff,#6d7bff);color:#fff;
    font-size:clamp(13px,3.4vw,15px);letter-spacing:.05em;
    box-shadow:0 4px 12px rgba(62,166,255,.32);
  }
  .hint{
    margin-top:4px;font-family:'Gowun Dodum',sans-serif;font-weight:700;
    font-size:clamp(12px,3.2vw,14px);color:#4872a8;
    animation:pulseHint 1.8s ease-in-out infinite;
  }
  @keyframes pulseHint{0%,100%{opacity:.72}50%{opacity:1;transform:scale(1.04)}}

  .foot{
    margin-top:2px;padding:8px 18px;border-radius:16px;
    background:rgba(255,255,255,.78);border:1.5px dashed #82c8ff;
    text-align:center;font-size:clamp(13px,3.5vw,15px);color:#2b538a;
    box-shadow:0 4px 14px rgba(100,170,240,.14);
  }
  .foot small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:11px;color:#5a7fb0;margin-top:2px}
</style>
</head>
<body>
<div class="rainbow-arch"></div>
<div class="cloud-bg c1"></div>
<div class="cloud-bg c2"></div>
<div class="cloud-bg c3"></div>
<canvas id="fx"></canvas>
<button id="sound" aria-label="음악 켜기/끄기" title="음악">🎵</button>

<main class="stage">
  <header class="head">
    <div class="decor">
      <span class="twinkle">⚡</span>
      <span class="twinkle">🌈</span>
      <span class="twinkle">⭐</span>
      <span class="twinkle">💯</span>
    </div>
    <h1>
      <span class="l1">서연이</span>
      <span class="l2">기말고사 <em>올백</em></span>
    </h1>
  </header>

  <div class="bubble-wrap">
    <div class="bubble" id="bubble" aria-live="polite">서연아! 올백쯤은 20% 더 쿨하게 해내자고! ⚡🌈</div>
  </div>

<script>
(function(){
  var PHRASES = [
    "서연아! 올백쯤은 20% 더 쿨하게 해내자고! ⚡🌈",
    "서연이 기말고사 100점, 소닉 레인붐급으로 가자!! 💥",

    "다 맞고 와 서연아! 내가 제일 먼저 응원할게! 💖"
  ];
  var pi = 0;
  var bubble = document.getElementById('bubble');
  var pony = document.getElementById('pony');
  var ring = document.getElementById('ring');
  var hero = document.getElementById('hero');

  /* Canvas: stars + rainbow sparkles + tap burst */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var AMBIENT = ['⭐','✨','⚡','🌈','☁️','💙','💖'];
  var BURST   = ['⚡','🌈','💯','⭐','✨','💥','🦄','💖'];
  var floaters = [];
  for(var i=0;i<22;i++){
    floaters.push({
      x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
      vx:(Math.random()-.5)*.35, vy:-.25 - Math.random()*.45,
      s:13 + Math.random()*12, ch:AMBIENT[i%AMBIENT.length], a:.45+Math.random()*.4
    });
  }
  var sparks = [];
  function spawnBurst(cx, cy){
    for(var i=0;i<30;i++){
      var ang = Math.random()*Math.PI*2;
      var spd = 2.8 + Math.random()*7.5;
      sparks.push({
        x:cx, y:cy, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd - 2.6,
        g:.18, life:1, s:16 + Math.random()*14,
        ch:BURST[Math.floor(Math.random()*BURST.length)],
        rot:(Math.random()-.5)*6, vr:(Math.random()-.5)*.2
      });
    }
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<floaters.length;i++){
      var f=floaters[i];
      f.x += f.vx; f.y += f.vy;
      if(f.y < -30){ f.y = H+20; f.x = Math.random()*W; }
      if(f.x < -30) f.x = W+20; if(f.x > W+30) f.x = -20;
      ctx.globalAlpha = f.a;
      ctx.font = f.s + 'px sans-serif';
      ctx.fillText(f.ch, f.x, f.y);
    }
    for(var j=sparks.length-1;j>=0;j--){
      var p=sparks[j];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr;
      p.life -= .019;
      if(p.life <= 0){ sparks.splice(j,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.font = p.s + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.ch, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* Upbeat bright synth-pop cheer WAV */
  var audio = null, muted = false;
  function makeWav(){
    var sr = 22050, bpm = 132, beat = 60/bpm, step = beat/2;
    var notes = [
      523.25,659.25,783.99,1046.5, 987.77,783.99,659.25,783.99,
      698.46,880.00,1046.5,880.00, 783.99,659.25,587.33,783.99,
      523.25,659.25,783.99,1046.5, 1174.66,1046.5,987.77,783.99,
      880.00,783.99,659.25,587.33, 523.25,0,523.25,659.25
    ];
    var bass = [261.63,261.63,196.00,196.00, 174.61,174.61,196.00,196.00,
                261.63,261.63,246.94,196.00, 174.61,196.00,261.63,261.63];
    var total = Math.floor(notes.length * step * sr);
    var pcm = new Int16Array(total);
    for(var n=0;n<notes.length;n++){
      var freq = notes[n], bf = bass[Math.floor(n/2)];
      var s0 = Math.floor(n*step*sr), s1 = Math.floor((n+1)*step*sr);
      for(var k=s0;k<s1 && k<total;k++){
        var t = (k-s0)/sr, env = Math.exp(-t*6.5);
        var v = 0;
        if(freq>0) v += (Math.sin(2*Math.PI*freq*t)*0.7 + Math.sin(4*Math.PI*freq*t)*0.25)*env*0.32;
        v += Math.sin(2*Math.PI*bf*t)*Math.exp(-t*3.2)*0.18;
        if(n%2===0 && t<0.04) v += (Math.random()*2-1)*Math.exp(-t*90)*0.08;
        var sample = Math.max(-1, Math.min(1, v));
        pcm[k] = Math.round(sample * 32767);
      }
    }
    var buf = new ArrayBuffer(44 + pcm.length*2), dv = new DataView(buf);
    function ws(o,s){ for(var i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); }
    ws(0,'RIFF'); dv.setUint32(4,36+pcm.length*2,true); ws(8,'WAVE'); ws(12,'fmt ');
    dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    ws(36,'data'); dv.setUint32(40,pcm.length*2,true);
    for(var i=0;i<pcm.length;i++) dv.setInt16(44+i*2,pcm[i],true);
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }
  function ensureAudio(){
    if(!audio){
      audio = new Audio(makeWav());
      audio.loop = true; audio.playsInline = true; audio.volume = 0.52;
    }
    if(!muted && audio.paused){
      audio.play().catch(function(){});
    }
  }
  document.getElementById('sound').addEventListener('click', function(e){
    e.stopPropagation();
    muted = !muted;
    this.classList.toggle('off', muted);
    this.textContent = muted ? '🔇' : '🎵';
    if(!audio) ensureAudio();
    if(audio){ muted ? audio.pause() : audio.play().catch(function(){}); }
  });

  function trigger(e){
    ensureAudio();
    pi = (pi + 1) % PHRASES.length;
    bubble.textContent = PHRASES[pi];
    bubble.classList.remove('shine'); void bubble.offsetWidth; bubble.classList.add('shine');
    pony.classList.remove('jump'); void pony.offsetWidth; pony.classList.add('jump');
    ring.classList.remove('boom'); void ring.offsetWidth; ring.classList.add('boom');
    var rect = pony.getBoundingClientRect();
    var cx = (e && e.clientX) ? e.clientX : rect.left + rect.width/2;
    var cy = (e && e.clientY) ? e.clientY : rect.top + rect.height/2;
    spawnBurst(cx, cy);
  }
  hero.addEventListener('click', trigger);
  hero.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); trigger(); } });
})();
</script>
