<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1f">
<title>🌸 기말고사 백점 기원 · 칸자키 소마</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --doraji:#5654a2;--doraji-deep:#3c3a78;--doraji-light:#8b88d6;
    --moon:#e63946;--red:#ff4d6d;--gold:#ffd166;--gold-deep:#e8a92e;--sakura:#ffb3c6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#0b0a1f;color:#fff;
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    overflow:hidden;overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  }
  #fx{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:manipulation}

  #sound{
    position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;
    border:1px solid rgba(255,209,102,.55);
    background:radial-gradient(circle at 35% 28%,rgba(139,136,214,.8),rgba(60,58,120,.6) 70%);
    box-shadow:0 6px 16px rgba(10,0,30,.45),inset 0 1px 0 rgba(255,255,255,.45),0 0 14px rgba(255,209,102,.25);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:#fff;cursor:pointer;padding:0;transition:opacity .25s,transform .2s,filter .25s;
  }
  #sound:active{transform:scale(.92)}
  #sound.off{opacity:.5;filter:grayscale(1)}

  /* ───── 스테이지 ───── */
  .stage{
    position:relative;z-index:2;
    height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 42px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .wrap{width:min(430px,100%);display:flex;flex-direction:column;align-items:center;gap:0}

  /* ───── 말풍선 ───── */
  .bubble{
    position:relative;z-index:4;
    margin:0 auto -6px;
    padding:13px 22px 14px;
    border-radius:26px 26px 26px 8px;
    background:linear-gradient(150deg,#fffdf9,#fff2f6 55%,#ffe3ec);
    color:#8a1450;
    font-family:"Jua","Pretendard",sans-serif;
    font-size:clamp(16px,4.6vw,20px);
    line-height:1.28;text-align:center;
    box-shadow:0 14px 34px rgba(10,2,26,.55),0 0 0 2px rgba(255,209,102,.55),inset 0 1px 0 #fff;
    animation:bubbleIn .9s cubic-bezier(.2,1.5,.4,1) both, bubbleFloat 5s ease-in-out 1s infinite;
    max-width:94%;
    word-break:keep-all;
  }
  .bubble::after{
    content:"";position:absolute;left:34px;bottom:-11px;width:24px;height:24px;
    background:#fff0f5;transform:rotate(45deg);border-radius:0 0 6px 0;
    box-shadow:3px 3px 0 rgba(255,209,102,.35);
  }
  .bubble b{color:#d92e79}
  .bubble .sp{display:inline-block;animation:spk 1.6s ease-in-out infinite}
  @keyframes bubbleIn{0%{opacity:0;transform:translateY(-14px) scale(.85)}100%{opacity:1;transform:none}}
  @keyframes bubbleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes spk{0%,100%{transform:scale(.8) rotate(-8deg);opacity:.7}50%{transform:scale(1.15) rotate(8deg);opacity:1}}

  /* ───── 캐릭터 ───── */
  .hero{
    position:relative;
    width:100%;
    display:flex;justify-content:center;align-items:flex-end;
    margin-top:2px;
  }
  .halo{
    position:absolute;left:50%;top:44%;width:118%;max-width:520px;height:78%;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(closest-side,rgba(230,57,70,.42),rgba(230,57,70,.12) 55%,rgba(230,57,70,0) 72%),
      radial-gradient(closest-side at 60% 60%,rgba(139,136,214,.42),rgba(86,84,162,0) 70%);
    filter:blur(14px);pointer-events:none;
    animation:haloPulse 6s ease-in-out infinite;
  }
  @keyframes haloPulse{0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .soma{
    position:relative;z-index:2;
    display:block;
    height:min(48vh,430px);
    max-height:430px;
    width:auto;max-width:100%;
    object-fit:contain;
    -webkit-mask-image:radial-gradient(ellipse 58% 62% at 50% 46%,#000 34%,rgba(0,0,0,.92) 50%,rgba(0,0,0,.42) 68%,transparent 84%);
    mask-image:radial-gradient(ellipse 58% 62% at 50% 46%,#000 34%,rgba(0,0,0,.92) 50%,rgba(0,0,0,.42) 68%,transparent 84%);
    filter:drop-shadow(0 18px 34px rgba(6,0,24,.6)) saturate(1.06) brightness(1.06);
    animation:somaIn 1.2s cubic-bezier(.2,.9,.2,1) both, somaFloat 6.5s ease-in-out 1.2s infinite;
  }
  @keyframes somaIn{0%{opacity:0;transform:translateY(22px) scale(.94)}100%{opacity:1;transform:none}}
  @keyframes somaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* 양손 핫스팟 · 안내 뱃지 */
  .hands{position:relative;z-index:6;display:flex;gap:9px;justify-content:center;align-items:stretch;width:100%;margin:-16px 0 0;padding:0 2px}
  .hand{
    pointer-events:auto;
    position:relative;flex:1 1 0;justify-content:center;
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 14px 10px 11px;
    border-radius:999px;border:1.4px solid rgba(255,209,102,.75);
    font-family:"Jua","Pretendard",sans-serif;font-size:13px;letter-spacing:.01em;
    color:#fff;cursor:pointer;
    background:linear-gradient(150deg,rgba(86,84,162,.95),rgba(60,58,120,.92));
    box-shadow:0 12px 26px rgba(8,2,24,.55),inset 0 1px 0 rgba(255,255,255,.35),0 0 0 4px rgba(255,209,102,.10);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:transform .16s;
    white-space:nowrap;
  }
  .hand:active{transform:scale(.94)}
  .hand .em{font-size:19px;line-height:1;display:inline-block}
  .hand.cake{animation:handBobL 3.4s ease-in-out infinite}
  .hand.letter{animation:handBobR 3.8s ease-in-out infinite}
  @keyframes handBobL{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(0)}}
  @keyframes handBobR{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-5px) rotate(0)}}

  .hand.cake .em{transform-origin:50% 50%}
  .hand.cake.spin .em{animation:cakeSpin 1.05s cubic-bezier(.3,.7,.3,1)}
  @keyframes cakeSpin{
    0%{transform:rotate(0) rotateY(0) scale(1)}
    35%{transform:rotate(180deg) rotateY(180deg) scale(1.35)}
    70%{transform:rotate(360deg) rotateY(360deg) scale(1.1)}
    100%{transform:rotate(360deg) scale(1)}
  }
  .hand.cake.spin{border-color:#fff;box-shadow:0 0 0 6px rgba(255,209,102,.30),0 14px 30px rgba(255,120,140,.5)}

  /* ───── 하단 안내 ───── */
  .unit{
    margin:12px 0 0;text-align:center;
    font-family:"Gowun Dodum","Pretendard",sans-serif;
    font-size:12px;letter-spacing:.10em;color:#e7d8ff;opacity:.95;
    text-shadow:0 0 12px rgba(230,57,70,.5);
  }
  .unit b{color:var(--gold);letter-spacing:.16em}
  .allbtn{
    margin:12px auto 0;display:inline-flex;align-items:center;gap:7px;
    padding:10px 18px;border-radius:999px;border:1px solid rgba(255,209,102,.55);
    font-family:"Jua","Pretendard",sans-serif;font-size:12.5px;color:#ffe9f0;
    background:rgba(86,84,162,.55);cursor:pointer;
    box-shadow:0 8px 20px rgba(8,2,24,.4);
  }
  .allbtn:active{transform:scale(.96)}

  /* ───── 모달 (편지 · 롤링페이퍼) ───── */
  .modal{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:14px;
    background:radial-gradient(circle at 50% 36%,rgba(70,20,60,.6),rgba(6,4,20,.9));
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    opacity:0;visibility:hidden;transition:opacity .32s ease,visibility .32s ease;overflow:hidden;
  }
  .modal.open{opacity:1;visibility:visible}
  .letter{
    position:relative;width:min(420px,100%);
    max-height:calc(100dvh - 28px);overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:22px 18px 18px;border-radius:26px;
    background:radial-gradient(120% 55% at 50% 0%,#ffffff,#fff6f2 40%,#ffe4ec 100%);
    color:#4a2350;
    box-shadow:0 30px 76px rgba(6,0,20,.62),0 0 0 1px rgba(255,255,255,.85),inset 0 -24px 46px rgba(255,170,200,.26);
    transform:translateY(18px) scale(.9);
  }
  .modal.open .letter{animation:popIn .72s cubic-bezier(.16,1.5,.36,1) both}
  @keyframes popIn{0%{transform:translateY(46px) scale(.7) rotate(-3deg);opacity:0}55%{transform:translateY(-8px) scale(1.03) rotate(1deg);opacity:1}75%{transform:translateY(3px) scale(.99)}100%{transform:none;opacity:1}}
  .letter::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:26px;
    background:radial-gradient(circle at 10% 14%,rgba(255,179,198,.32),transparent 36%),radial-gradient(circle at 90% 82%,rgba(255,209,102,.28),transparent 40%);
  }
  .ltop{position:relative;text-align:center}
  .crest{
    display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-size:20px;
    background:radial-gradient(circle at 35% 30%,#8b88d6,#5654a2 65%,#3c3a78);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 2px rgba(255,209,102,.5);
  }
  .letter h2{margin:8px 0 0;font-family:"Jua","Pretendard",sans-serif;font-weight:400;font-size:clamp(18px,5.2vw,22px);color:#c22a63}
  .letter .kanji{display:block;margin-top:2px;font-size:10px;letter-spacing:.42em;color:#b4788f}
  .divider{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 10px;color:#ff8ea8;font-size:11px}
  .divider i{display:block;height:1px;width:40px;background:linear-gradient(90deg,transparent,#ffb3c6)}
  .divider i:last-child{background:linear-gradient(90deg,#ffb3c6,transparent)}
  .souma{
    position:relative;margin:0 0 12px;padding:11px 12px;border-radius:14px;
    background:linear-gradient(160deg,rgba(86,84,162,.10),rgba(255,209,102,.12));
    border:1px solid rgba(86,84,162,.22);
    font-family:"Gowun Dodum","Pretendard",sans-serif;font-size:clamp(11.5px,3.4vw,13px);line-height:1.8;color:#3f2a5c;word-break:keep-all;
  }
  .souma .nm{display:block;margin-top:6px;font-size:10.5px;color:#7a5aa8}

  .gform{position:relative;display:flex;flex-direction:column;gap:7px}
  .gform input,.gform textarea{
    width:100%;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;font-size:14px;color:#4a2350;
    background:#fffdfe;border:1px solid rgba(200,130,170,.35);border-radius:12px;padding:10px 12px;
    outline:none;resize:none;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s;
  }
  .gform input::placeholder,.gform textarea::placeholder{color:#b79ab5}
  .gform input:focus,.gform textarea:focus{border-color:#ff9bb8;box-shadow:0 0 0 3px rgba(255,155,184,.18)}
  .gform textarea{min-height:66px;line-height:1.5}
  .gform input.nick{max-width:52%}
  .gmeta{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:#a98bb0;min-height:15px}
  .gmsg{font-size:11px;color:#c22a63}
  .gmsg.ok{color:#2b8a4b}
  .gpost{
    align-self:flex-end;padding:10px 18px;border-radius:999px;border:0;cursor:pointer;
    font-family:"Jua","Pretendard",sans-serif;font-size:13.5px;color:#3a1530;
    background:linear-gradient(135deg,#ffd1de,#ffb3c6 40%,#ffd166);
    box-shadow:0 8px 18px rgba(255,150,180,.35),inset 0 1px 0 rgba(255,255,255,.9);
  }
  .gpost:active{transform:scale(.95)}
  .gpost[disabled]{opacity:.55}
  .ghead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px;position:relative}
  .ghead h3{margin:0;font-family:"Jua","Pretendard",sans-serif;font-weight:400;font-size:14px;color:#8a2f6c}
  .ghead .cnt{font-size:10.5px;color:#a98bb0}
  .glist{position:relative;display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto;padding-right:2px}
  .gempty{padding:14px 10px;text-align:center;border-radius:14px;border:1px dashed rgba(200,130,170,.4);color:#a98bb0;font-size:11.5px;line-height:1.7}
  .gcard{position:relative;padding:10px 12px 9px;border-radius:14px;background:linear-gradient(160deg,#fffaf4,#ffeef3 60%,#ffe0e9);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 14px rgba(90,20,60,.12);animation:gIn .5s cubic-bezier(.2,1.4,.4,1) both;overflow:hidden}
  .gcard:nth-child(odd){transform:rotate(-.4deg)}
  .gcard:nth-child(even){transform:rotate(.4deg)}
  @keyframes gIn{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1}}
  .gcard::after{content:"🌸";position:absolute;right:-6px;bottom:-10px;font-size:26px;opacity:.14;transform:rotate(-18deg)}
  .gh{display:flex;align-items:center;gap:7px;margin-bottom:4px}
  .av{width:19px;height:19px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(140deg,#8b88d6,#5654a2)}
  .nm{font-weight:700;font-size:12px;color:#8a2f6c}
  .tm{margin-left:auto;font-size:10px;color:#b092b8}
  .tx{font-size:12.5px;line-height:1.55;color:#4a2350;white-space:pre-wrap;word-break:break-word}
  .lclose{position:absolute;top:8px;right:10px;border:0;background:rgba(255,255,255,.7);color:#8d3a63;font-size:12px;width:26px;height:26px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(220,120,170,.3);z-index:2}
  .floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px}
  .floaties span{position:absolute;font-size:13px;opacity:.8;animation:floatUp 5.4s linear infinite}
  @keyframes floatUp{0%{transform:translateY(20px) scale(.7);opacity:0}18%{opacity:.85}100%{transform:translateY(-240px) scale(1.1) rotate(24deg);opacity:0}}

  @media (max-width:400px){.bubble{font-size:15.5px;padding:11px 16px 12px}.hand{font-size:12px;padding:9px 12px 9px 10px}}
  @media (max-height:700px){.soma{height:min(48vh,360px)}.stage{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}}
  @media (prefers-reduced-motion:reduce){
    .bubble,.soma,.halo,.hand{animation:none!important}
    .floaties{display:none}
  }

  /* ── 전체 글꼴: 고운바탕(고풍스러운 명조) ── */
  body, body *{
    font-family:"Gowun Batang","Noto Serif KR","Gowun Dodum",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif !important;
    letter-spacing:.004em;
  }
  .bubble{font-weight:400}

  /* ── 인트로: 검정 화면 → 팡! ── */
  #intro{position:fixed;inset:0;background:#05030c;z-index:120;pointer-events:none;animation:introOut .62s ease-in .4s forwards}
  @keyframes introOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
  .bubble{animation:bubblePop 1s cubic-bezier(.2,1.75,.35,1) .46s both, bubbleFloat 5s ease-in-out 1.7s infinite}
  @keyframes bubblePop{0%{opacity:0;transform:scale(.2) translateY(20px)}60%{opacity:1;transform:scale(1.09) translateY(-4px)}100%{opacity:1;transform:scale(1)}}
  .soma{animation:somaPop 1.05s cubic-bezier(.16,1.8,.36,1) .44s both, somaFloat 6.5s ease-in-out 1.8s infinite}
  @keyframes somaPop{0%{opacity:0;transform:scale(.18) translateY(30px)}58%{opacity:1;transform:scale(1.08) translateY(-8px)}100%{opacity:1;transform:scale(1)}}
  .halo{animation:haloPulse 6s ease-in-out .5s infinite both}
  /* ── 케이크 팝업 (보라·라벤더·도라지 + 금박·벚꽃) ── */
  .cakePop{position:fixed;inset:0;z-index:110;display:none;place-items:center;pointer-events:auto;
    background:radial-gradient(circle at 50% 46%,rgba(38,20,74,.90),rgba(4,2,10,.965))}
  .cakePop.open{display:grid;animation:cakeFade .28s ease-out both}
  @keyframes cakeFade{from{opacity:0}to{opacity:1}}
  .cakeBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 10px;
    animation:cakePop .9s cubic-bezier(.2,1.75,.35,1) both}
  @keyframes cakePop{0%{opacity:0;transform:scale(.1) translateY(60px)}
    58%{opacity:1;transform:scale(1.1) translateY(-10px)}80%{transform:scale(.98)}100%{opacity:1;transform:scale(1)}}
  .cakeSpin{position:relative;perspective:1100px;perspective-origin:50% 55%}
  .cakeSpin::before{content:'';position:absolute;left:50%;top:52%;width:min(92vw,520px);height:min(92vw,520px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(168,140,240,.42),rgba(255,209,102,.12) 45%,rgba(0,0,0,0) 70%);pointer-events:none}
  .cakeSvg{display:block;width:min(86vw,440px);height:auto;
    filter:drop-shadow(0 22px 46px rgba(150,110,235,.55)) drop-shadow(0 0 22px rgba(255,209,102,.28));
    animation:cakeSpinY 4.2s linear infinite;transform-style:preserve-3d;transform-origin:50% 55%}
  @keyframes cakeSpinY{from{transform:rotateY(0deg) rotateX(7deg)}to{transform:rotateY(360deg) rotateX(7deg)}}
  .cakeSvg .flame{animation:flameFlick .3s ease-in-out infinite alternate;transform-origin:center bottom}
  .cakeSvg .flame.f2{animation-duration:.24s}
  .cakeSvg .flame.f3{animation-duration:.36s}
  @keyframes flameFlick{0%{transform:scale(1,1) translateY(0);opacity:.92}100%{transform:scale(.82,1.18) translateY(-1.5px);opacity:1}}
  .cakeCap{font-size:clamp(14px,4.2vw,18px);color:#ffe9f5;text-shadow:0 2px 12px rgba(120,80,200,.9);letter-spacing:.02em}
  .cakeX{position:absolute;top:-6px;right:-6px;z-index:3;padding:7px 13px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,209,102,.65);color:#fff;font-size:12.5px;
    background:linear-gradient(150deg,rgba(122,103,196,.95),rgba(70,55,130,.95));
    box-shadow:0 8px 22px rgba(10,0,30,.5),inset 0 1px 0 rgba(255,255,255,.4)}
  .cakeX:active{transform:scale(.94)}
  .cakeHint{margin-top:-4px;font-size:11.5px;color:rgba(255,233,250,.6)}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="intro" aria-hidden="true"></div>
<div class="cakePop" id="cakePop" role="dialog" aria-modal="true" aria-label="백점 응원 케이크">
  <div class="cakeBox">
    <button class="cakeX" id="cakeClose" type="button">✕ 닫기</button>
    <div class="cakeSpin">
    <svg class="cakeSvg" viewBox="0 0 240 260" role="img" aria-label="보랏빛 3단 백점 응원 케이크">
      <defs>
        <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdbcf7"/><stop offset="1" stop-color="#8f7ad4"/></linearGradient>
        <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a48fe0"/><stop offset="1" stop-color="#6a58b4"/></linearGradient>
        <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d6bc0"/><stop offset="1" stop-color="#4a3c8c"/></linearGradient>
        <linearGradient id="crm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ff"/><stop offset="1" stop-color="#e8dcff"/></linearGradient>
        <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#e8a92e"/></linearGradient>
        <radialGradient id="fl" cx="50%" cy="65%" r="60%"><stop offset="0" stop-color="#fff6c9"/><stop offset="45%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="120" cy="228" rx="98" ry="15" fill="#0b0618" opacity=".55"/>

      for (var i = 0; i < ids.length; i++) {
        var m = messages[ids[i]];
        var card = document.createElement('div'); card.className = 'gcard';
        var head = document.createElement('div'); head.className = 'gh';
        var av = document.createElement('span'); av.className = 'av'; av.textContent = (m.nick || '?').charAt(0);
        var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = m.nick || '익명';
        var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = timeLabel(m.time);
        head.appendChild(av); head.appendChild(nm); head.appendChild(tm);
        var tx = document.createElement('div'); tx.className = 'tx'; tx.textContent = m.msg;
        card.appendChild(head); card.appendChild(tx); listEl.appendChild(card);
      }
    }
    countEl.textContent = ids.length ? '🌸 ' + ids.length + '개' : '';
  }
  function setStatus(t, ok) { statusEl.textContent = t || ''; statusEl.className = 'gmsg' + (ok ? ' ok' : ''); }

  function fetchAll(silent) {
    if (polling) return Promise.resolve();
    polling = true;
    return fetch(GB_POLL + '&_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (txt) {
        txt.split('\n').forEach(function (line) {
          line = line.trim(); if (!line) return;
          var o; try { o = JSON.parse(line); } catch (e) { return; }
          if (o.event !== 'message') return;
          var d = null;
          try { d = JSON.parse(o.message); } catch (e) { d = { nick: '익명', msg: o.message }; }
          if (!d || typeof d !== 'object') return;
          var nick = (d.nick || d.n || '익명').toString().trim().slice(0, 12) || '익명';
          var msg = (d.msg || d.m || '').toString().trim();
          if (!msg) return;
          addMessage({ id: o.id || String(o.time), nick: nick, msg: msg, time: o.time || 0 });
        });
        render(); saveCache();
      })
      .catch(function (e) {
        if (!silent) setStatus('편지를 불러오지 못했어요. 잠시 뒤 다시 시도할게요!');
        window.__bd.gbError = String((e && e.message) || e);
      })
      .then(function () { polling = false; });
  }

  function post() {
    if (posting) return;
    var nick = (nickEl.value || '').replace(/\s+/g, ' ').trim().slice(0, 12);
    var msg = (msgEl.value || '').replace(/\s+/g, ' ').trim();
    if (!nick) { setStatus('보내는 사람 이름을 적어줘!'); try { nickEl.focus(); } catch (e) {} return; }
    if (!msg) { setStatus('응원 한마디를 적어 주시오!'); try { msgEl.focus(); } catch (e) {} return; }
    if (msg.length > 120) msg = msg.slice(0, 120);
    posting = true; postBtn.disabled = true; setStatus('보내는 중…', true);
    var id = 'local_' + Date.now();
    messages[id] = { id: id, nick: nick, msg: msg, time: Math.floor(Date.now() / 1000) };
    pending[keyOf(nick, msg)] = id;
    render();
    try { localStorage.setItem(LS_NICK, nick); } catch (e) {}
    fetch(GB_API, { method: 'POST', body: JSON.stringify({ nick: nick, msg: msg }), headers: { 'Content-Type': 'text/plain' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        msgEl.value = ''; lenEl.textContent = '0/120';
        setStatus('응원 한마디가 등록됐어요! 🌸', true);
        postBtn.disabled = false; posting = false;
        setTimeout(function () { fetchAll(true); }, 700);
        setTimeout(function () { fetchAll(true); }, 2000);
        var p = centerOf(somaImg); partyBlast(p.x, p.y);
      })
      .catch(function (e) {
        setStatus('등록에 실패했어요. 인터넷 상태를 확인하고 다시 시도해줘!');
        postBtn.disabled = false; posting = false;
        window.__bd.gbPostError = String((e && e.message) || e);
      });
  }
  postBtn.addEventListener('click', post);
  msgEl.addEventListener('input', function () { lenEl.textContent = msgEl.value.length + '/120'; });
  msgEl.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); post(); } });

  /* 디버그 훅 */
  window.__bd = window.__bd || {};
  window.__bd.openLetter = openLetter;
  window.__bd.closeLetter = closeLetter;
  window.__bd.audio = function () {
    return audioEl ? { paused: audioEl.paused, currentTime: audioEl.currentTime, duration: audioEl.duration,
      readyState: audioEl.readyState, loop: audioEl.loop } : null;
  };
  window.__bd.cake = function () { return { open: cakePop.classList.contains('open'), svg: !!document.querySelector('.cakeSvg'), spin: getComputedStyle(document.querySelector('.cakeSvg')).animationName, scale: getComputedStyle(document.querySelector('.cakeBox')).transform }; };
  window.__bd.counts = function () { return { sparks: sparks.length, shards: shards.length, petals: petals.length, rockets: rockets.length }; };
  window.__bd.gb = function () { return { topic: GB_TOPIC, count: Object.keys(messages).length, ids: Object.keys(messages), error: window.__bd.gbError || null }; };
  window.__bd.canvas = function () { var r = cv.getBoundingClientRect(); return { W: W, H: H, dpr: DPR, buf: [cv.width, cv.height], css: [Math.round(r.width), Math.round(r.height)], ratio: +((cv.width / cv.height).toFixed(3)), screen: +((r.width / r.height).toFixed(3)) }; };
  window.__bd.font = function () { return getComputedStyle(document.getElementById('bubble')).fontFamily; };
  window.__bd.fetchGb = fetchAll;
  window.__bd.postGb = post;
  window.__bd.ready = true;

  syncSoundBtn(); arm(); loadCache(); render();
  if (!reduce) {
    setTimeout(function () { launchRocket(W * 0.25, H * 0.2, 45); setTimeout(function () { launchRocket(W * 0.75, H * 0.16, 340); }, 500); }, 300);
  }
  fetchAll(true);
  setInterval(function () { fetchAll(true); }, 9000);
  if (typeof requestIdleCallback === 'function') requestIdleCallback(buildAudio, { timeout: 1600 });
  else setTimeout(buildAudio, 500);
})();
</script>
