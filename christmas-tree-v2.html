<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>🎄 Merry Christmas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
  #cv{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab}
  #cv.grabbing{cursor:grabbing}

</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d', { alpha: false });
  var TAU = Math.PI * 2;
  var VW = 0, VH = 0, DPR = 1, CX = 0, CY = 0, BASE = 120;

  /* ───────────── palette (릴스 색감) ───────────── */
  var COLORS = [
    [6, 46, 30],      // 0 deep forest
    [12, 92, 54],     // 1 dark green
    [22, 138, 78],    // 2 green
    [40, 186, 108],   // 3 bright green
    [104, 240, 160],  // 4 mint spark
    [255, 255, 255],  // 5 white
    [236, 22, 40],    // 6 red
    [255, 196, 62],   // 7 gold
    [255, 232, 168],  // 8 pale gold
    [38, 88, 236],    // 9 blue
    [128, 76, 226],   // 10 violet
    [150, 226, 255],  // 11 ice
    [255, 92, 150],   // 12 pink
    [255, 132, 48]    // 13 orange
  ];
  var NCOL = COLORS.length;

  /* ───────────── particle store ───────────── */
  var _x = [], _y = [], _z = [], _c = [], _s = [], _ph = [], _tw = [], _k = [];
  var KINDS = 0;   /* 0 = 잎, 1 = 리본, 2 = 선물·바닥 */

  function addP(x, y, z, c, s, tw) {
    _x.push(x); _y.push(y); _z.push(z);
    _c.push(c); _s.push(s); _ph.push(Math.random() * TAU); _tw.push(tw); _k.push(KINDS);
  }

  /* ───────────── geometry ───────────── */
  var TOP_Y = 4.00;      // 트리 높이
  var BASE_R = 1.74;     // 밑동 반지름 (통통한 비율)
  var TIERS = 8;

  function envR(y) {
    var t = Math.max(0, Math.min(1, y / TOP_Y));
    return BASE_R * Math.pow(1 - t, 0.44);
  }

  function patchNoise(a, y, ti) {
    var n1 = 0.5 + 0.5 * Math.sin(a * 2.7 + y * 2.05 + ti * 1.1);
    var n2 = 0.5 + 0.5 * Math.sin(a * 6.3 - y * 3.7 + ti * 2.3);
    var n3 = 0.5 + 0.5 * Math.sin(a * 11.0 + y * 6.1);
    return n1 * 0.5 + n2 * 0.32 + n3 * 0.18;
  }

  /* ───────────── tree: 8 겹으로 겹친 넓은 가지층 ───────────── */
  (function buildTree() {
    for (var ti = 0; ti < TIERS; ti++) {
      var y0 = TOP_Y * Math.pow(ti / TIERS, 0.90);
      var y1 = TOP_Y * Math.pow((ti + 1) / TIERS, 0.90);
      var hgt = y1 - y0;
      var Rb = envR(y0) * (ti === 0 ? 1.06 : 1.075);
      var Rt = envR(y1) * (ti === TIERS - 1 ? 0.30 : 0.88);
      var rings = 13;
      var per = Math.round(58 + 34 * (1 - ti / TIERS));

      for (var r = 0; r < rings; r++) {
        var u = (r + 0.5 + Math.random() * 0.3) / rings;
        var yc = y0 + hgt * u;
        var rr = Rb + (Rt - Rb) * u;
        var cnt = Math.round(per * (0.55 + 0.85 * rr / Rb));

        for (var k = 0; k < cnt; k++) {
          var a = Math.random() * TAU;
          var wave = 1 + 0.075 * Math.sin(a * 8 + ti * 1.7) + 0.034 * Math.sin(a * 19 - ti * 0.9);
          var inner = Math.random() < 0.42;
          var rad = inner ? rr * wave * (0.25 + 0.65 * Math.random())
                          : rr * wave * (0.94 + 0.075 * Math.random());
          var py = yc + (Math.random() - 0.5) * hgt * 0.18;

          var pn = patchNoise(a, yc, ti);
          var q = Math.random(), lvl;
          if (q < 0.34) lvl = 1;
          else if (q < 0.70) lvl = 2;
          else if (q < 0.92) lvl = 3;
          else lvl = 4;
          if (pn > 0.60 && Math.random() < 0.60) lvl = Math.min(4, lvl + 1);
          if (pn < 0.30 && Math.random() < 0.40) lvl = Math.max(0, lvl - 1);
          /* 층 윗부분은 위층 그늘에 가려 어둡게 */
          if (u > 0.62 && Math.random() < (u - 0.62) * 2.4) lvl = Math.max(0, lvl - 2);
          if (inner && Math.random() < 0.55) lvl = Math.random() < 0.75 ? 0 : 1;

          var sz = inner ? (4.6 + Math.random() * 1.6) : (5.4 + Math.random() * 2.2);
          var tw = lvl >= 4 ? 1 : (inner ? 0.05 : 0.22);
          if (lvl >= 4 && Math.random() < 0.30) { lvl = 5; tw = 1; }
          addP(Math.cos(a) * rad, py, Math.sin(a) * rad, lvl, sz, tw);
        }
      }

      /* 가지층 끝단: 살짝 아래로 처진 밝은 테두리 */
      var rimN = Math.round(190 * (Rb / BASE_R) + 50);
      for (var m = 0; m < rimN; m++) {
        var a2 = Math.random() * TAU;
        var w2 = 1 + 0.075 * Math.sin(a2 * 8 + ti * 1.7) + 0.034 * Math.sin(a2 * 19 - ti * 0.9);
        var r2 = Rb * w2 * (0.97 + 0.045 * Math.random());
        var c2 = Math.random() < 0.34 ? 3 : (Math.random() < 0.62 ? 2 : 1);
        addP(Math.cos(a2) * r2, y0 - 0.02 + (Math.random() - 0.5) * 0.03,
             Math.sin(a2) * r2, c2, 5.4 + Math.random() * 1.8, 0.26);
      }
      /* 가지 끝이 아래로 처지는 살집: 층 경계를 또렷하게 */
      var lipN = Math.round(120 * (Rb / BASE_R) + 26);
      for (var m2 = 0; m2 < lipN; m2++) {
        var a3 = Math.random() * TAU;
        var w3 = 1 + 0.075 * Math.sin(a3 * 8 + ti * 1.7) + 0.034 * Math.sin(a3 * 19 - ti * 0.9);
        var r3 = Rb * w3 * (0.90 + 0.06 * Math.random());
        addP(Math.cos(a3) * r3, y0 - 0.014 - Math.random() * 0.05,
             Math.sin(a3) * r3, Math.random() < 0.5 ? 1 : 2, 4.8 + Math.random() * 1.4, 0.2);
      }
    }
  })();

  /* ───────────── 두툼한 빨간 리본 (4.8바퀴) ───────────── */
  KINDS = 1;
  (function buildRibbon() {
    var N = 1150, TURNS = 4.8, HW = 0.072;
    for (var i = 0; i < N; i++) {
      var t = i / (N - 1);
      var a = t * TURNS * TAU + 2.0;
      var yc = 0.13 + t * TOP_Y * 0.905 + 0.03 * Math.sin(a * 2.3);
      var rr = envR(yc) * 1.028 + 0.012;
      var rows = 2;
      for (var r = 0; r < rows; r++) {
        var off = (r - 0.5) * HW * 1.15;
        var aa = a + (Math.random() - 0.5) * 0.008;
        var rr2 = rr * (1 + (Math.random() - 0.5) * 0.012);
        var c = 6;
        if (r === 0 && Math.random() < 0.18) c = 8;
        if (Math.random() < 0.03) c = 12;
        addP(Math.cos(aa) * rr2, yc + off + (Math.random() - 0.5) * 0.008,
             Math.sin(aa) * rr2, c, 6.3 + Math.random() * 1.5, 0.16);
      }
    }
    /* 리본을 따라 흐르는 금색 실 한 가닥 */
    var N2 = 240;
    for (var k = 0; k < N2; k++) {
      var t2 = k / (N2 - 1);
      var a2 = t2 * TURNS * TAU + 2.0 + 0.22;
      var y2 = 0.13 + t2 * TOP_Y * 0.905 + 0.03 * Math.sin(a2 * 2.3) + HW * 0.55;
      var r2 = envR(y2) * 1.045 + 0.012;
      addP(Math.cos(a2) * r2, y2, Math.sin(a2) * r2, Math.random() < 0.45 ? 8 : 7,
           4.4 + Math.random() * 1.2, 0.75);
    }
  })();

  /* ───────────── 속이 꽉 찬 황금별 (빌보드) ───────────── */
  var STAR_Y = TOP_Y + 0.24;
  var starGeo = [];

  (function buildStar() {
    var R = 0.315, r0 = 0.128;

    var V = [];
    for (var v = 0; v < 10; v++) {
      var ang = -Math.PI / 2 + v * Math.PI / 5;
      var rr = (v % 2 === 0) ? R : r0;
      V.push([Math.cos(ang) * rr, Math.sin(ang) * rr]);
    }

    function inside(px, py) {
      var hit = false;
      for (var i = 0, j = 9; i < 10; j = i++) {
        var xi = V[i][0], yi = V[i][1], xj = V[j][0], yj = V[j][1];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) hit = !hit;
      }
      return hit;
    }

    /* 앞뒤 두 겹 + 속을 채우는 점들 */
    var step = 0.019;
    for (var gx = -R; gx <= R; gx += step) {
      for (var gy = -R; gy <= R; gy += step) {
        if (!inside(gx, gy)) continue;
        var d = Math.sqrt(gx * gx + gy * gy) / R;
        var layers = d < 0.55 ? 2 : 1;
        for (var L = 0; L < layers; L++) {
          var dz = layers === 1 ? 0 : (L === 0 ? 0.030 : -0.030);
          var c = Math.random() < 0.55 ? 8 : 7;
          starGeo.push([gx + (Math.random() - 0.5) * 0.007, gy + (Math.random() - 0.5) * 0.007,
                        dz + (Math.random() - 0.5) * 0.012, c, 4.6 + Math.random() * 1.6, 0.30]);
        }
      }
    }

    /* 테두리를 따라 밝은 선 */
    for (var e = 0; e < 10; e++) {
      var A = V[e], B = V[(e + 1) % 10];
      var len = Math.hypot(B[0] - A[0], B[1] - A[1]);
      var nseg = Math.max(4, Math.round(len / 0.016));
      for (var s = 0; s < nseg; s++) {
        var tt = s / nseg;
        for (var dz2 = -1; dz2 <= 1; dz2 += 2) {
          starGeo.push([A[0] + (B[0] - A[0]) * tt, A[1] + (B[1] - A[1]) * tt,
                        dz2 * 0.024, Math.random() < 0.30 ? 8 : 7, 4.4 + Math.random() * 1.4, 0.45]);
        }
      }
    }

    /* 별을 감싸는 잔불꽃 */
    for (var h = 0; h < 34; h++) {
      var a3 = Math.random() * TAU, b3 = Math.acos(2 * Math.random() - 1);
      var r3 = 0.40 + Math.random() * 0.18;
      var dx = Math.sin(b3) * Math.cos(a3) * r3;
      var dy = Math.cos(b3) * r3;
      var dz3 = Math.sin(b3) * Math.sin(a3) * r3;
      if (!inside(dx, dy)) starGeo.push([dx, dy, dz3, Math.random() < 0.6 ? 7 : 8,
                                         3.4 + Math.random() * 1.6, 1]);
    }
  })();

  KINDS = 2;
  /* ───────────── 트리 아래 큰 선물 상자 4개 ───────────── */
  function addGift(gx, gz, w, h, d, rotY, bodyCol, ribCol) {
    var cs = Math.cos(rotY), sn = Math.sin(rotY);
    function put(a, b, c, ci, s) {
      addP(gx + a * cs + c * sn, b, gz - a * sn + c * cs, ci, s, 0.10);
    }
    var NX = Math.max(7, Math.round(w * 34));
    var NZ = Math.max(7, Math.round(d * 34));
    var NY = Math.max(6, Math.round(h * 34));
    var i, j, a, b, c2, jy;
    var ribW = 0.085;

    function faceCol() {
      var q = Math.random();
      return q < 0.14 ? bodyCol : (q < 0.55 ? bodyCol : bodyCol);
    }

    /* 윗면 */
    for (i = 0; i <= NX; i++) {
      for (j = 0; j <= NZ; j++) {
        a = -w / 2 + w * (i + (Math.random() - 0.5) * 0.5) / NX;
        c2 = -d / 2 + d * (j + (Math.random() - 0.5) * 0.5) / NZ;
        var rib = (Math.abs(a) < ribW * w * 0.42 || Math.abs(c2) < ribW * d * 0.42);
        put(a, h, c2, rib ? ribCol : faceCol(), rib ? 4.6 : 4.0);
      }
    }
    /* 앞 / 뒤 */
    for (i = 0; i <= NX; i++) {
      for (j = 0; j <= NY; j++) {
        a = -w / 2 + w * (i + (Math.random() - 0.5) * 0.5) / NX;
        jy = h * (j + (Math.random() - 0.5) * 0.5) / NY;
        var rib2 = Math.abs(a) < ribW * w * 0.42;
        put(a, jy, d / 2, rib2 ? ribCol : faceCol(), rib2 ? 4.6 : 4.0);
        put(a, jy, -d / 2, rib2 ? ribCol : faceCol(), rib2 ? 4.6 : 4.0);
      }
    }
    /* 좌 / 우 */
    for (i = 0; i <= NZ; i++) {
      for (j = 0; j <= NY; j++) {
        c2 = -d / 2 + d * (i + (Math.random() - 0.5) * 0.5) / NZ;
        jy = h * (j + (Math.random() - 0.5) * 0.5) / NY;
        var rib3 = Math.abs(c2) < ribW * d * 0.42;
        put(w / 2, jy, c2, rib3 ? ribCol : faceCol(), rib3 ? 4.6 : 4.0);
        put(-w / 2, jy, c2, rib3 ? ribCol : faceCol(), rib3 ? 4.6 : 4.0);
      }
    }
    /* 뚜껑 경계 */
    for (i = 0; i <= NX; i++) {
      a = -w / 2 + w * i / NX;
      put(a, h - 0.03, d / 2, bodyCol, 4.4);
      put(a, h - 0.03, -d / 2, bodyCol, 4.4);
    }
    /* 둥근 리본 매듭 */
    for (i = 0; i < 46; i++) {
      var aa = Math.random() * TAU, rr2 = Math.random();
      var bx = Math.cos(aa) * (0.02 + rr2 * w * 0.16);
      var by = h + 0.02 + Math.sin(aa * 2) * h * 0.05 + Math.random() * 0.03;
      var bz = Math.sin(aa) * (0.02 + rr2 * d * 0.16);
      put(bx, by, bz, i < 6 ? 8 : ribCol, 5.0);
    }
  }

  (function buildGifts() {
    addGift(-1.24, 1.16, 0.52, 0.60, 0.48, 0.18, 10, 7);   // 보라 + 금리본
    addGift(-0.54, 1.74, 0.64, 0.52, 0.56, -0.14, 2, 7);    // 초록 + 금리본
    addGift(0.72, 1.72, 0.52, 0.44, 0.48, 0.10, 9, 7);      // 파랑 + 금리본
    addGift(1.38, 1.18, 0.70, 0.58, 0.60, -0.24, 6, 7);     // 빨강 + 금리본
  })();

  /* ───────────── 눈이 덮인 넓은 바닥 ───────────── */
  (function buildGround() {
    for (var i = 0; i < 620; i++) {
      var a = Math.random() * TAU;
      var r = 0.10 + Math.pow(Math.random(), 0.55) * 2.10;
      var y = -0.01 + (Math.random() - 0.5) * 0.02;
      var c = Math.random() < 0.60 ? 11 : 5;
      addP(Math.cos(a) * r, y, Math.sin(a) * r, c, 3.8 + Math.random() * 1.6, 0.18);
    }
    /* 동심원 줄무늬 눈판 */
    for (var rq = 0; rq < 15; rq++) {
      var rad = 0.26 + rq * 0.125;
      var cnt = Math.round(20 + rad * 44);
      for (var q = 0; q < cnt; q++) {
        var aa9 = Math.random() * TAU;
        var jr = rad + (Math.random() - 0.5) * 0.04;
        addP(Math.cos(aa9) * jr, 0.002, Math.sin(aa9) * jr,
             Math.random() < 0.5 ? 11 : 5, 3.8 + Math.random() * 1.3, 0.2);
      }
    }
    /* 바닥 반짝이 */
    for (var j = 0; j < 110; j++) {
      var a2 = Math.random() * TAU;
      var r2 = 0.15 + Math.pow(Math.random(), 0.7) * 1.95;
      addP(Math.cos(a2) * r2, 0.006, Math.sin(a2) * r2, 5, 4.6 + Math.random() * 1.6, 1);
    }
  })();

  /* freeze */
  var NP = _x.length;
  var PX = new Float32Array(_x), PY = new Float32Array(_y), PZ = new Float32Array(_z);
  var PCOL = new Uint8Array(_c), PSZ = new Float32Array(_s);
  var PPH = new Float32Array(_ph), PTW = new Float32Array(_tw);
  var PK = new Uint8Array(_k);

  /* ───────────── glow sprites ───────────── */
  var SIZES = [5.5, 9, 14];
  var SS = Math.min(3, Math.max(2, Math.round(window.devicePixelRatio || 2)));
  var sprites = [];

  function makeSprite(rgb, size) {
    var c = document.createElement('canvas');
    var n = Math.ceil(size * SS);
    c.width = c.height = n;
    var g = c.getContext('2d');
    var r = n / 2;
    var gr = g.createRadialGradient(r, r, 0, r, r, r);
    var R = rgb[0], G = rgb[1], B = rgb[2];
    gr.addColorStop(0, 'rgba(' + Math.min(255, R + 70) + ',' + Math.min(255, G + 70) + ',' + Math.min(255, B + 70) + ',1)');
    gr.addColorStop(0.22, 'rgba(' + R + ',' + G + ',' + B + ',0.86)');
    gr.addColorStop(0.45, 'rgba(' + R + ',' + G + ',' + B + ',0.16)');
    gr.addColorStop(0.68, 'rgba(' + R + ',' + G + ',' + B + ',0.03)');
    gr.addColorStop(1, 'rgba(' + R + ',' + G + ',' + B + ',0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, n, n);
    return c;
  }

  for (var ci = 0; ci < NCOL; ci++) {
    sprites[ci] = [];
    for (var si = 0; si < SIZES.length; si++) sprites[ci][si] = makeSprite(COLORS[ci], SIZES[si]);
  }

  function bigGlow(rgb, size, falloff) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var r = size / 2;
    var gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',1)');
    gr.addColorStop(0.14, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.5 * falloff) + ')');
    gr.addColorStop(0.40, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (0.10 * falloff) + ')');
    gr.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    return c;
  }

  var GLOW_STAR = bigGlow([255, 206, 116], 256, 1);

  /* ───────────── background stars & snow ───────────── */
  var bgStars = [];
  for (var bsi = 0; bsi < 210; bsi++) {
    bgStars.push({
      x: Math.random(), y: Math.random(),
      ph: Math.random() * TAU,
      sp: 0.35 + Math.random() * 1.1,
      c: Math.random() < 0.10 ? 8 : (Math.random() < 0.22 ? 11 : 5),
      sz: 0.55 + Math.random() * 0.9
    });
  }

  var snow = [];
  for (var sni = 0; sni < 120; sni++) {
    snow.push({
      x: Math.random() * 1.2 - 0.1,
      y: Math.random(),
      z: Math.random(),
      vy: 0.05 + Math.random() * 0.10,
      ph: Math.random() * TAU,
      sw: 0.4 + Math.random() * 1.2
    });
  }

  /* ───────────── sparks ───────────── */
  var sparks = [];

  function burst() {
    for (var i = 0; i < 110; i++) {
      var t = Math.pow(Math.random(), 0.8);
      var y = 0.2 + t * TOP_Y * 0.9;
      var a = Math.random() * TAU;
      var rr = envR(y) * (0.85 + Math.random() * 0.3);
      var sp = 0.35 + Math.random() * 0.95;
      var col = Math.random();
      sparks.push({
        x: Math.cos(a) * rr, y: y, z: Math.sin(a) * rr,
        vx: Math.cos(a) * sp, vy: 0.15 + Math.random() * 0.7, vz: Math.sin(a) * sp,
        life: 0, max: 0.9 + Math.random() * 1.0,
        c: col < 0.4 ? 8 : (col < 0.68 ? 5 : (col < 0.86 ? 7 : 4)),
        ph: Math.random() * TAU
      });
    }
  }

  /* ───────────── camera / state ───────────── */
  var yaw = 0.0, pitch = 0.20, zoom = 1;
  var dYaw = 0, dPitch = 0;
  var camD = 9.4, FOCUS_Y = 2.05;
  var spinOn = true, snowOn = true, musicOn = false;
  var time = 0, last = 0;

  function layout() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    VW = window.innerWidth;
    VH = window.innerHeight;
    cv.width = Math.round(VW * DPR);
    cv.height = Math.round(VH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    BASE = Math.min(VH / 6.9, VW / 4.08);
    CX = VW * 0.5;
    CY = VH * 0.5 + VH * 0.035;
  }

  /* ───────────── batching buckets ───────────── */
  var NAL = 6, NSZ = 3;
  var NK = NCOL * NAL * NSZ;
  var bkX = [], bkY = [], bkCount = new Array(NK);
  for (var q0 = 0; q0 < NK; q0++) {
    bkX.push(new Float32Array(5000));
    bkY.push(new Float32Array(5000));
    bkCount[q0] = 0;
  }

  /* ───────────── rendering ───────────── */
  function drawFlake(f) {
    var fx = (f.x + Math.sin(f.ph) * 0.014 * f.sw) * VW;
    var fy = f.y * VH;
    var sz = (SIZES[0] * 0.30 + f.z * SIZES[1] * 0.40) * (BASE / 130);
    ctx.globalAlpha = 0.04 + f.z * 0.24;
    var img = sprites[5][f.z > 0.62 ? 1 : 0];
    ctx.drawImage(img, fx - sz / 2, fy - sz / 2, sz, sz);
  }

  function stepSnow(dt) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += f.vy * dt * (0.35 + f.z * 0.85);
      f.ph += dt * 0.8;
      if (f.y > 1.06) { f.y = -0.06; f.x = Math.random() * 1.2 - 0.1; }
    }
  }

  function render(dt) {
    var f = BASE * zoom * camD;
    var cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    var cosP = Math.cos(pitch), sinP = Math.sin(pitch);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, VW, VH);

    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < bgStars.length; i++) {
      var st = bgStars[i];
      ctx.globalAlpha = 0.10 + 0.34 * (0.5 + 0.5 * Math.sin(time * st.sp + st.ph));
      var ssz = SIZES[0] * 0.5 * st.sz;
      ctx.drawImage(sprites[st.c][0], st.x * VW - ssz / 2, st.y * VH - ssz / 2, ssz, ssz);
    }

    for (var s3 = 0; s3 < snow.length; s3++) if (snow[s3].z < 0.5) drawFlake(snow[s3]);

    /* ── particles ── */
    for (var b = 0; b < NK; b++) bkCount[b] = 0;

    for (var p = 0; p < NP; p++) {
      var x = PX[p], y = PY[p] - FOCUS_Y, z = PZ[p];

      var X = x * cosY + z * sinY;
      var Z = -x * sinY + z * cosY;
      var Y = y * cosP - Z * sinP;
      var Z2 = y * sinP + Z * cosP;

      var depth = camD - Z2;
      if (depth < 0.8) continue;
      var sc = f / depth;
      var sxp = CX + X * sc;
      var syp = CY - Y * sc;
      if (sxp < -40 || sxp > VW + 40 || syp < -40 || syp > VH + 40) continue;

      var tw = PTW[p];
      var twinkle = 1;
      if (tw > 0) {
        var w = 0.5 + 0.5 * Math.sin(time * 2.6 + PPH[p] + p * 0.61);
        twinkle = 1 - tw * 0.5 + tw * 1.0 * w;
      }
      /* 앞쪽 점은 밝게, 뒤쪽 점은 어둡게 -> 입체감 (뒤로 돌아간 리본은 잎에 가려진 것처럼 사라짐) */
      var fr = 0.5 + 0.5 * Math.max(-1, Math.min(1, Z2 / 1.85));
      var kd = PK[p];
      var front;
      if (kd === 1) {
        /* 뒤로 돌아간 리본은 잎에 가려진 것처럼 흐려진다 */
        front = Math.max(0.10, Math.min(1, (Z2 + 1.25) / 1.05));
      } else if (kd === 0) {
        front = 0.48 + 0.52 * fr;
      } else {
        front = 0.55 + 0.45 * fr;
      }
      var fog = 1 - 0.30 * Math.min(1, Math.max(0, (depth - (camD - 2.4)) / 4.6));
      var a = fog * twinkle * front;
      if (a <= 0.02) continue;
      if (a > 1) a = 1;

      var al = (a * (NAL - 1)) | 0;
      var szp = PSZ[p] * (camD / depth) * zoom;
      var szb = szp < 6.6 ? 0 : (szp < 10.5 ? 1 : 2);

      var key = PCOL[p] * (NAL * NSZ) + al * NSZ + szb;
      var idx = bkCount[key];
      if (idx < 5000) {
        bkX[key][idx] = sxp;
        bkY[key][idx] = syp;
        bkCount[key] = idx + 1;
      }
    }

    for (var kk = 0; kk < NK; kk++) {
      var cnt = bkCount[kk];
      if (!cnt) continue;
      var col = (kk / (NAL * NSZ)) | 0;
      var rest = kk - col * NAL * NSZ;
      var alv = (rest / NSZ) | 0;
      var szv = rest - alv * NSZ;
      ctx.globalAlpha = 0.08 + (alv / (NAL - 1)) * 0.84;
      var img = sprites[col][szv];
      var S = SIZES[szv], half = S / 2;
      var ax = bkX[kk], ay = bkY[kk];
      for (var n2 = 0; n2 < cnt; n2++) ctx.drawImage(img, ax[n2] - half, ay[n2] - half, S, S);
    }

    /* ── star ── */
    var sbase = STAR_Y - FOCUS_Y;
    for (var sg = 0; sg < starGeo.length; sg++) {
      var g = starGeo[sg];
      var gb = sbase + g[1];
      var gY = gb * cosP - g[2] * sinP;
      var gZ = gb * sinP + g[2] * cosP;
      var gd = camD - gZ;
      if (gd < 0.8) continue;
      var gsc = f / gd;
      var gtw = g[5];
      var gal = 1 - gtw * 0.4 + gtw * 0.4 * (0.5 + 0.5 * Math.sin(time * 3.2 + sg * 1.9));
      gal *= 1 - 0.25 * Math.min(1, Math.max(0, (gd - (camD - 2)) / 4));
      if (gal < 0.03) continue;
      ctx.globalAlpha = Math.min(1, gal);
      var gsz2 = g[4] * (camD / gd) * zoom;
      var gidx = gsz2 < 6.6 ? 0 : (gsz2 < 10.5 ? 1 : 2);
      var GS = SIZES[gidx];
      ctx.drawImage(sprites[g[3]][gidx], CX + g[0] * gsc - GS / 2, CY - gY * gsc - GS / 2, GS, GS);
    }

    /* ── sparks ── */
    for (var s4 = sparks.length - 1; s4 >= 0; s4--) {
      var k4 = sparks[s4];
      k4.life += dt;
      if (k4.life > k4.max) { sparks.splice(s4, 1); continue; }
      k4.x += k4.vx * dt;
      k4.y += k4.vy * dt;
      k4.z += k4.vz * dt;
      k4.vy -= 1.05 * dt;
      k4.vx *= Math.pow(0.35, dt);
      k4.vz *= Math.pow(0.35, dt);

      var xx = k4.x, yy = k4.y - FOCUS_Y, zz = k4.z;
      var X4 = xx * cosY + zz * sinY;
      var Z4 = -xx * sinY + zz * cosY;
      var Y4 = yy * cosP - Z4 * sinP;
      var Z24 = yy * sinP + Z4 * cosP;
      var d4 = camD - Z24;
      if (d4 < 0.7) continue;
      var lifeT = k4.life / k4.max;
      var al4 = (1 - lifeT) * (0.6 + 0.4 * Math.sin(time * 16 + k4.ph));
      if (al4 < 0.03) continue;
      var sc4 = f / d4;
      var spx = CX + X4 * sc4, spy = CY - Y4 * sc4;
      var sz4 = (4.2 + 3.6 * (1 - lifeT)) * Math.min(1.7, BASE / 95);

      if (k4.hx !== undefined) {
        ctx.globalAlpha = Math.min(0.5, al4 * 0.45);
        ctx.drawImage(sprites[k4.c][1], k4.hx - sz4 * 0.55, k4.hy - sz4 * 0.55, sz4 * 1.1, sz4 * 1.1);
      }
      k4.hx = spx; k4.hy = spy;

      ctx.globalAlpha = Math.min(1, al4);
      ctx.drawImage(sprites[k4.c][1], spx - sz4 / 2, spy - sz4 / 2, sz4, sz4);
    }

    /* ── star halo ── */
    var syr = (STAR_Y - FOCUS_Y) * cosP;
    var sz2 = (STAR_Y - FOCUS_Y) * sinP;
    var ssc = f / (camD - sz2);
    var gsz = (0.56 + 0.04 * Math.sin(time * 1.7)) * ssc;
    ctx.globalAlpha = 0.24;
    ctx.drawImage(GLOW_STAR, CX - gsz / 2, CY - syr * ssc - gsz / 2, gsz, gsz);
    ctx.globalAlpha = 0.09 + 0.02 * Math.sin(time * 2.3);
    ctx.drawImage(GLOW_STAR, CX - gsz * 1.5, CY - syr * ssc - gsz * 1.5, gsz * 3, gsz * 3);

    for (var s5 = 0; s5 < snow.length; s5++) if (snow[s5].z >= 0.5) drawFlake(snow[s5]);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ───────────── loop ───────────── */
  var dragging = false;
  var frameCount = 0, fpsT = 0, slowStrikes = 0;
  window.__fps = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) { last = now; fpsT = now; }
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;

    if (spinOn && !dragging) yaw += dt * 0.22;
    if (!dragging) {
      yaw += dYaw * dt;
      pitch += dPitch * dt;
      var damp = Math.pow(0.0018, dt);
      dYaw *= damp; dPitch *= damp;
      if (Math.abs(dYaw) < 0.0003) dYaw = 0;
      if (Math.abs(dPitch) < 0.0003) dPitch = 0;
    }
    pitch = Math.max(-0.30, Math.min(0.72, pitch));

    if (snowOn) stepSnow(dt);
    render(dt);

    frameCount++;
    if (now - fpsT > 500) {
      var fps = Math.round(frameCount / ((now - fpsT) / 1000));
      window.__fps = fps;
      frameCount = 0;
      fpsT = now;
      if (fps < 30 && DPR > 1.4) {
        slowStrikes++;
        if (slowStrikes > 10) { DPR = 1; layout(); slowStrikes = -1e9; }
      } else if (slowStrikes > 0) {
        slowStrikes--;
      }
    }
  }

  /* ───────────── interaction ───────────── */
  var pointers = new Map();
  var lastPt = null, downPt = null, downTime = 0, moved = 0;
  var pinchStart = 0, pinchZoom = 1;

  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cv.classList.add('grabbing');
    if (pointers.size === 1) {
      dragging = true;
      lastPt = { x: e.clientX, y: e.clientY };
      downPt = { x: e.clientX, y: e.clientY };
      downTime = performance.now();
      moved = 0;
      dYaw = 0; dPitch = 0;
    } else if (pointers.size === 2) {
      var it = pointers.values();
      var a = it.next().value, b = it.next().value;
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
      pinchZoom = zoom;
    }
  });

  cv.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2) {
      var it = pointers.values();
      var a = it.next().value, b = it.next().value;
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStart > 0) zoom = Math.max(0.55, Math.min(2.8, pinchZoom * (d / pinchStart)));
      return;
    }
    if (!dragging || !lastPt) return;

    var dx = e.clientX - lastPt.x;
    var dy = e.clientY - lastPt.y;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * 0.0062;
    pitch = Math.max(-0.30, Math.min(0.72, pitch + dy * 0.0042));
    dYaw = dx * 0.09;
    dPitch = dy * 0.06;
    lastPt = { x: e.clientX, y: e.clientY };
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 1) {
      var it = pointers.values();
      var a = it.next().value;
      lastPt = { x: a.x, y: a.y };
      dragging = true;
      return;
    }
    if (pointers.size === 0) {
      dragging = false;
      lastPt = null;
      cv.classList.remove('grabbing');
      if (downPt && moved < 12 && performance.now() - downTime < 450) {
        burst();
        dYaw = 0; dPitch = 0;
      }
      downPt = null;
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom = Math.max(0.55, Math.min(2.8, zoom * Math.exp(-e.deltaY * 0.0012)));
  }, { passive: false });

  /* ───────────── 오르골 캐롤 (iOS Safari 무음 모드에서도 나는 <audio> 방식) ───────────── */
  musicOn = true;

  var NT = {
    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99
  };

  var MELODY = [
    ['E4', 1], ['E4', 1], ['E4', 2],
    ['E4', 1], ['E4', 1], ['E4', 2],
    ['E4', 1], ['G4', 1], ['C4', 1], ['D4', 1], ['E4', 4],
    ['F4', 1], ['F4', 1], ['F4', 1], ['F4', 1],
    ['F4', 1], ['E4', 0.5], ['E4', 0.5], ['E4', 1], ['E4', 1],
    ['E4', 1], ['D4', 1], ['D4', 1], ['E4', 1],
    ['D4', 2], ['G4', 2],
    ['E4', 1], ['E4', 1], ['E4', 2],
    ['E4', 1], ['E4', 1], ['E4', 2],
    ['E4', 1], ['G4', 1], ['C4', 1], ['D4', 1], ['E4', 4],
    ['F4', 1], ['F4', 1], ['F4', 1], ['F4', 1],
    ['F4', 1], ['E4', 0.5], ['E4', 0.5], ['E4', 1], ['E4', 1],
    ['G4', 1], ['G4', 1], ['F4', 1], ['D4', 1],
    ['C4', 4], ['-', 1]
  ];

  var BASS = [
    [0, 'C3', 4], [4, 'G3', 4], [8, 'C3', 4], [12, 'F3', 4],
    [16, 'C3', 6], [22, 'G3', 2], [24, 'C3', 4], [28, 'G3', 4],
    [32, 'C3', 4], [36, 'G3', 4], [40, 'C3', 4], [44, 'F3', 4],
    [48, 'C3', 6], [54, 'G3', 2], [56, 'C3', 4], [60, 'C3', 2]
  ];

  var BEAT = 60 / 128;

  /* 징글벨 오르골 멜로디 한 바퀴를 통째로 16bit PCM WAV로 메모리에서 합성한다.
     iOS는 Web Audio(AudioContext)를 측면 무음 스위치에 묶어 버려서 소리가 안 나지만,
     <audio>로 재생하는 미디어는 무음 모드에서도 소리가 난다. 그래서 AudioContext 대신 이 방식만 쓴다. */
  function buildCarolWav() {
    var SR = 16000;
    var i, total = 0.12;
    for (i = 0; i < MELODY.length; i++) total += MELODY[i][1] * BEAT;
    total += 1.15;                                  /* 마지막 여운 + 한 바퀴 사이 숨 고르기 */
    var N = Math.ceil(total * SR);
    var buf = new Float32Array(N);
    var attack = Math.max(1, Math.round(0.012 * SR));
    var tau = 0.30 * SR;

    function voice(freq, at, dur, vol, kind) {
      var start = Math.round(at * SR);
      if (start >= N) return;
      var len = Math.min(N - start, Math.round((dur + 0.6) * SR));
      if (len <= 1) return;
      var w = 2 * Math.PI * freq / SR;
      var w2 = w * 2.005;
      var fade = Math.max(1, Math.round(0.09 * SR));
      var fadeFrom = len - fade;
      for (var j = 0; j < len; j++) {
        var env = j < attack ? j / attack : Math.exp(-(j - attack) / tau);
        if (j > fadeFrom) env *= (len - j) / fade;
        var ph = w * j;
        var s = kind === 'tri' ? (2 / Math.PI) * Math.asin(Math.sin(ph)) : Math.sin(ph);
        s += 0.16 * Math.sin(w2 * j);
        buf[start + j] += vol * env * s;
      }
    }

    var t = 0.12;
    for (i = 0; i < MELODY.length; i++) {
      var nm = MELODY[i][0], bt = MELODY[i][1];
      if (nm !== '-' && NT[nm]) {
        voice(NT[nm], t, bt * BEAT, 0.55, 'sine');
        voice(NT[nm] * 2, t, bt * BEAT * 0.45, 0.07, 'sine');
      }
      t += bt * BEAT;
    }
    for (i = 0; i < BASS.length; i++) {
      var b = BASS[i];
      voice(NT[b[1]] * 0.5, b[0] * BEAT + 0.12, b[2] * BEAT, 0.20, 'tri');
    }

    var peak = 0;
    for (i = 0; i < N; i++) { var av = buf[i] < 0 ? -buf[i] : buf[i]; if (av > peak) peak = av; }
    var gain = peak > 0.0001 ? Math.min(12, 0.92 / peak) : 1;

    var bytes = 44 + N * 2;
    var ab = new ArrayBuffer(bytes);
    var dv = new DataView(ab);
    function tag(off, str) { for (var q = 0; q < str.length; q++) dv.setUint8(off + q, str.charCodeAt(q)); }
    tag(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); tag(8, 'WAVE');
    tag(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, SR, true); dv.setUint32(28, SR * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    tag(36, 'data'); dv.setUint32(40, N * 2, true);
    var off = 44;
    for (i = 0; i < N; i++) {
      var v = buf[i] * gain;
      v = v > 1 ? 1 : (v < -1 ? -1 : v);
      dv.setInt16(off, Math.round(v < 0 ? v * 32768 : v * 32767), true);
      off += 2;
    }
    return ab;
  }

  var musicEl = null, musicUrl = null, musicBuilt = false, musicArmed = false;

  var MUSIC_EVS = ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'keydown'];

  function armMusic() {
    if (musicArmed) return;
    musicArmed = true;
    for (var i = 0; i < MUSIC_EVS.length; i++) {
      document.addEventListener(MUSIC_EVS[i], onMusicGesture, true);
      window.addEventListener(MUSIC_EVS[i], onMusicGesture, true);
    }
  }

  function disarmMusic() {
    if (!musicArmed) return;
    musicArmed = false;
    for (var i = 0; i < MUSIC_EVS.length; i++) {
      document.removeEventListener(MUSIC_EVS[i], onMusicGesture, true);
      window.removeEventListener(MUSIC_EVS[i], onMusicGesture, true);
    }
  }

  function makeMusic() {
    if (musicEl || musicBuilt) return musicEl;
    musicBuilt = true;
    try {
      musicUrl = URL.createObjectURL(new Blob([buildCarolWav()], { type: 'audio/wav' }));
      var a = document.createElement('audio');
      a.setAttribute('playsinline', '');
      a.setAttribute('webkit-playsinline', '');
      a.setAttribute('preload', 'auto');
      a.loop = true;
      a.volume = 1;
      a.src = musicUrl;
      a.style.cssText = 'position:fixed;left:-4px;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;';
      a.addEventListener('playing', function () { if (!a.paused) disarmMusic(); }, false);
      a.addEventListener('pause', function () {
        if (musicOn && !a.ended) setTimeout(function () { if (a.paused) armMusic(); }, 400);
      }, false);
      document.body.appendChild(a);
      musicEl = a;
    } catch (e) { musicEl = null; }
    return musicEl;
  }

  function playCarol() {
    if (!musicOn) return;
    var a = musicEl || makeMusic();
    if (!a || !a.paused) return;
    try {
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function onMusicGesture() {
    playCarol();
    if (musicEl && !musicEl.paused) disarmMusic();
  }

  armMusic();

  /* 로드 직후 한 번 재생을 시도하고(아이폰은 대개 차단), 막히면 첫 터치에서 반드시 재생된다.
     캔버스가 터치를 먹어도 잡히도록 document와 window 양쪽에 리스너를 걸어 둔다. */
  function bootMusic() { makeMusic(); playCarol(); }
  window.addEventListener('load', function () { setTimeout(bootMusic, 40); });
  if (typeof requestIdleCallback === 'function') requestIdleCallback(bootMusic, { timeout: 1200 });
  else setTimeout(bootMusic, 300);

  /* ───────────── go ───────────── */
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });

  requestAnimationFrame(frame);

  window.__tree = { burst: burst, sparks: function () { return sparks.length; }, count: NP };
})();
</script>
</body>
</html>
