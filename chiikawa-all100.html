<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe8f3">
<title>🍀 지웅님 기말고사 올백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#6b4a63; --plum-soft:#8a6b81;
    --pink:#ff9ec4; --pink-deep:#ff7bb0; --sky:#8fd3ff; --cream:#fff6e2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:"Gowun Dodum","Jua",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--plum);
    background:
      radial-gradient(60% 40% at 12% 6%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(50% 35% at 88% 14%, rgba(198,240,255,.85), rgba(198,240,255,0) 70%),
      radial-gradient(70% 50% at 50% 100%, rgba(255,233,199,.95), rgba(255,233,199,0) 75%),
      linear-gradient(180deg,#dff2ff 0%,#eaf6ff 18%,#ffe9f4 52%,#fff3e4 78%,#fff8ec 100%);
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  #fx{position:fixed;inset:0;display:block;z-index:0;pointer-events:none;touch-action:manipulation}

  /* 🎵 버튼 */
  #sound{
    position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
    width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    font-size:17px;line-height:1;padding:0;cursor:pointer;
    border:2px solid #fff;
    background:linear-gradient(150deg,#ffe6f1,#d9f1ff);
    box-shadow:0 6px 16px rgba(180,130,170,.32),inset 0 1px 0 #fff;
    transition:transform .18s,filter .25s,opacity .25s;
  }
  #sound:active{transform:scale(.9)}
  #sound.off{filter:grayscale(1);opacity:.66}

  .stage{
    position:relative;z-index:2;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 26px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);
  }
  .wrap{width:min(760px,100%);display:flex;flex-direction:column;align-items:center}

  /* ── 타이틀 ── */
  .hero{text-align:center;position:relative;padding:2px 0 8px}
  .rainbow{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:4px;
  }
  .rainbow svg,.foot svg{display:block}
  .rainbow .ico{filter:drop-shadow(0 2px 3px rgba(255,150,190,.35));animation:bob 3s ease-in-out infinite}
  .rainbow .ico:nth-child(2){animation-delay:-.7s}
  .rainbow .ico:nth-child(4){animation-delay:-1.4s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
  h1{
    margin:0;font-family:"Jua",sans-serif;font-weight:400;
    line-height:1.06;letter-spacing:-.01em;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  h1 .l1{
    font-size:clamp(20px,5.2vw,30px);color:#a98aa4;
    letter-spacing:.16em;padding-left:.16em;
  }
  h1 .l2{
    font-size:clamp(38px,11.4vw,64px);
    background:linear-gradient(178deg,#ff9dc6 0%,#ff7fb3 38%,#c48cf0 72%,#7fc8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:0;
    filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 4px 0 rgba(255,255,255,.85)) drop-shadow(0 8px 16px rgba(190,130,180,.35));
    padding:0 .04em 6px;
  }
  h1 .l2 em{font-style:normal;position:relative;display:inline-block}
  .twinkle{display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
  .twinkle:nth-child(2){animation-delay:.7s}
  .twinkle:nth-child(3){animation-delay:1.3s}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:.75}50%{transform:scale(1.28) rotate(14deg);opacity:1}}
  .sub{
    margin:10px auto 0;font-size:clamp(12px,3.3vw,15px);color:#8a6b81;
    background:rgba(255,255,255,.78);border:2px solid #fff;border-radius:999px;
    padding:7px 16px;display:inline-block;
    box-shadow:0 5px 14px rgba(190,150,180,.18);
  }

  /* ── 6마리 그리드 ── */
  .grid{
    width:100%;margin:16px 0 0;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
  }
  @media (min-width:620px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  }
  .card{
    position:relative;font:inherit;color:inherit;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:0;padding:10px 8px 12px;
    border-radius:26px;border:2px solid #fff;
    background:linear-gradient(180deg,#fdeaf3 0%,#fbe0ea 100%);
    box-shadow:0 10px 22px rgba(190,150,180,.18),inset 0 1px 0 #fff;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:transform .18s ease,box-shadow .25s ease;
    overflow:visible;
  }
  .card:active{transform:scale(.97)}
  .card.jump{animation:cardJump .62s cubic-bezier(.3,1.6,.45,1)}
  @keyframes cardJump{
    0%{transform:translateY(0) scale(1)}
    26%{transform:translateY(-14px) scale(1.04)}
    48%{transform:translateY(0) scale(.97)}
    66%{transform:translateY(-6px) scale(1.015)}
    100%{transform:translateY(0) scale(1)}
  }
  .card::after{
    content:"";position:absolute;inset:-3px;border-radius:29px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(255,158,196,0);
    transition:box-shadow .35s;
  }
  .card.jump::after{box-shadow:0 0 22px 4px rgba(255,158,196,.55)}

  /* 말풍선 */
  .bubble{
    position:relative;width:100%;min-height:56px;
    display:flex;align-items:center;justify-content:center;
    padding:9px 10px;margin-bottom:6px;
    border-radius:18px 18px 18px 6px;
    font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;
    font-size:clamp(11px,3.05vw,14px);line-height:1.34;
    color:#77415f;letter-spacing:-.01em;
    background:linear-gradient(155deg,#fffdfd,#fff0f7 60%,#ffe3f0);
    box-shadow:0 4px 12px rgba(210,140,180,.22),inset 0 1px 0 #fff,0 0 0 1.5px rgba(255,255,255,.9);
    word-break:keep-all;overflow-wrap:break-word;
    transition:transform .3s ease,box-shadow .3s ease,background .3s ease;
  }
  .bubble::after{
    content:"";position:absolute;left:16px;bottom:-7px;width:12px;height:12px;
    background:#ffe3f0;border-radius:0 0 3px 0;
    transform:rotate(45deg);box-shadow:2px 2px 4px rgba(210,140,180,.15);
  }
  .bubble.shine{
    animation:bubbleShine .8s ease;
  }
  @keyframes bubbleShine{
    0%{transform:scale(1)}
    30%{transform:scale(1.09) rotate(-1.2deg);box-shadow:0 8px 22px rgba(255,140,190,.5),0 0 0 3px #ffd6e8,inset 0 1px 0 #fff}
    100%{transform:scale(1)}
  }
  .pet{
    display:block;width:clamp(66px,18vw,104px);height:auto;aspect-ratio:1/1;
    border-radius:20%;
    box-shadow:0 0 0 3px #fff, 0 8px 14px rgba(196,150,180,.22);
    animation:petFloat 3.6s ease-in-out infinite;
    will-change:transform;
  }
  .grid .card:nth-child(2) .pet{animation-delay:-.6s}
  .grid .card:nth-child(3) .pet{animation-delay:-1.2s}
  .grid .card:nth-child(4) .pet{animation-delay:-1.8s}
  .grid .card:nth-child(5) .pet{animation-delay:-2.4s}
  .grid .card:nth-child(6) .pet{animation-delay:-3s}
  @keyframes petFloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-5px) rotate(1.2deg)}}
  .card.jump .pet{animation:bounceHard .62s cubic-bezier(.3,1.7,.4,1)}
  @keyframes bounceHard{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(2px) scale(1.06,.92)}42%{transform:translateY(-22px) scale(.95,1.07)}70%{transform:translateY(0) scale(1.05,.95)}86%{transform:translateY(-7px) scale(1,1)}100%{transform:translateY(0)}}
  .card:active .pet{transform:scale(1.04)}
  .name{
    margin-top:2px;font-family:"Jua",sans-serif;
    font-size:clamp(10px,2.7vw,12.5px);color:#b090a9;letter-spacing:.04em;
  }

  .foot{
    margin:20px 0 4px;text-align:center;
    font-family:"Jua",sans-serif;font-size:clamp(13px,3.6vw,17px);
    color:#9b7a95;
    background:rgba(255,255,255,.7);border:2px dashed #ffd2e6;border-radius:20px;
    padding:10px 18px;
  }
  .foot small{display:block;margin-top:3px;font-family:"Gowun Dodum",sans-serif;font-size:11.5px;color:#b39bac}

  /* 💗 터지는 하트/별 (DOM 이펙트) */
  .pop{
    position:fixed;z-index:70;pointer-events:none;
    font-size:18px;line-height:1;will-change:transform,opacity;
    animation:popUp .9s ease-out forwards;
  }
  @keyframes popUp{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
    18%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.05) rotate(var(--rot));opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    .card.jump,.bubble.shine,.twinkle{animation:none!important}
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="sound" aria-label="음악 켜기/끄기" title="음악">🎵</button>

<main class="stage">
  <div class="wrap">
    <header class="hero">
      <div class="rainbow">

        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.4 7.6L22 10l-7.6 2.4L12 20l-2.4-7.6L2 10l7.6-2.4z" fill="#ffd76e"/></svg>
        <svg class="ico" width="34" height="22" viewBox="0 0 48 30" aria-hidden="true" fill="none" stroke-width="4.4" stroke-linecap="round"><path d="M5 27a19 19 0 0138 0" stroke="#ff9ec4"/><path d="M11 27a13 13 0 0126 0" stroke="#ffc86e"/><path d="M17 27a7 7 0 0114 0" stroke="#8fc9f2"/></svg>
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.4 7.6L22 10l-7.6 2.4L12 20l-2.4-7.6L2 10l7.6-2.4z" fill="#ffb3d1"/></svg>
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="#9bd7a8"><circle cx="12" cy="7.4" r="3.4"/><circle cx="12" cy="16.6" r="3.4"/><circle cx="7.4" cy="12" r="3.4"/><circle cx="16.6" cy="12" r="3.4"/></g><circle cx="12" cy="12" r="1.5" fill="#6cb87e"/></svg>
      </div>
      <h1>
        <span class="l1">지웅님</span>
        <span class="l2">기말고사 <em>올백</em></span>

      <p class="sub">여섯 친구가 응원하러 왔어요 · 콕 눌러봐요 💛</p>

<script>
(function(){
  "use strict";

  /* ══════════ 배경 캔버스 (구름·별·하트) ══════════ */
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var clouds = [], stars = [], bits = [], bursts = [];

  function rnd(a,b){ return a + Math.random()*(b-a); }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // 같은 비율 → 1:1 픽셀, 왜곡 없음
    buildClouds();
  }

  function buildClouds(){
    clouds = [];
    var n = W < 520 ? 5 : 7;
    for (var i=0;i<n;i++){
      clouds.push({
        x: rnd(-60, W+60),
        y: rnd(H*0.04, H*0.92),
        r: rnd(26, 58) * (W<520 ? 0.9 : 1.1),
        v: rnd(0.06, 0.20) * (Math.random()<0.5 ? 1 : 1),
        a: rnd(0.28, 0.55)
      });
    }
    stars = [];
    var ns = W < 520 ? 26 : 42;
    for (var j=0;j<ns;j++){
      stars.push({ x: rnd(0,W), y: rnd(0,H), r: rnd(0.7,2.1), p: rnd(0,Math.PI*2), s: rnd(0.008,0.026) });
    }
  }

  var GLYPHS = ['💗','✦','⭐','🌸','🍀','💕','✧','🎀'];
  function spawnBit(){
    bits.push({
      x: rnd(0, W), y: H + 20,
      vy: rnd(0.22, 0.65), vx: rnd(-0.18, 0.18),
      size: rnd(9, 17), rot: rnd(0, Math.PI*2), vr: rnd(-0.02, 0.02),
      g: GLYPHS[(Math.random()*GLYPHS.length)|0], life: 1, fade: rnd(0.0016, 0.0035)
    });
  }
  for (var b=0;b<(W<520?10:16);b++){ spawnBit(); bits[bits.length-1].y = rnd(0,H); }

  function burst(x, y){
    var gs = ['💗','⭐','✨','💕','🌸','🍀','✦','🎉'];
    for (var i=0;i<16;i++){
      var ang = (Math.PI*2) * (i/16) + rnd(-0.2,0.2);
      var sp  = rnd(1.6, 4.6);
      bursts.push({
        x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 1.2,
        g: gs[(Math.random()*gs.length)|0], size: rnd(11,20),
        rot: rnd(0,6.28), vr: rnd(-0.12,0.12), life: 1, fade: rnd(0.012,0.021)
      });
    }
  }

  function drawCloud(c){
    ctx.save();
    ctx.globalAlpha = c.a;
    var grd = ctx.createRadialGradient(c.x, c.y, c.r*0.15, c.x, c.y, c.r);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.55, 'rgba(255,255,255,.85)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r, c.r*0.62, 0, 0, Math.PI*2);
    ctx.ellipse(c.x - c.r*0.55, c.y + c.r*0.12, c.r*0.6, c.r*0.42, 0, 0, Math.PI*2);
    ctx.ellipse(c.x + c.r*0.6, c.y + c.r*0.1, c.r*0.55, c.r*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  var last = 0, acc = 0;
  function loop(t){
    var dt = last ? Math.min(2.5, (t-last)/16.67) : 1;
    last = t;
    ctx.clearRect(0,0,W,H);

    // 구름
    for (var i=0;i<clouds.length;i++){
      var c = clouds[i];
      c.x += c.v * dt;
      if (c.x - c.r > W + 40) c.x = -c.r - 40;
      drawCloud(c);
    }
    // 별 반짝
    for (var j=0;j<stars.length;j++){
      var s = stars[j];
      s.p += s.s * dt;
      var a = 0.35 + 0.55 * Math.abs(Math.sin(s.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff9d6';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 흩날리는 글리프
    acc += dt;
    if (acc > 26 && bits.length < 26){ acc = 0; spawnBit(); }
    for (var k=bits.length-1;k>=0;k--){
      var p = bits[k];
      p.x += p.vx*dt; p.y -= p.vy*dt; p.rot += p.vr*dt; p.life -= p.fade*dt;
      if (p.life <= 0 || p.y < -40){ bits.splice(k,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life*1.5));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.font = p.size + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.g, 0, 0);
      ctx.restore();
    }

    // 터지는 폭죽
    for (var m=bursts.length-1;m>=0;m--){
      var q = bursts[m];
      q.x += q.vx*dt; q.y += q.vy*dt;
      q.vy += 0.06*dt; q.vx *= 0.985; q.rot += q.vr*dt;
      q.life -= q.fade*dt;
      if (q.life <= 0){ bursts.splice(m,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, q.life*1.6));
      ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.font = q.size + 'px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(q.g, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });
  resize();
  requestAnimationFrame(loop);

  /* ══════════ 캐릭터 터치 ══════════ */
  var cards = document.querySelectorAll('.card');
  function tapCard(card){
    card.classList.remove('jump');
    void card.offsetWidth;
    card.classList.add('jump');
    var bub = card.querySelector('.bubble');
    if (bub){ bub.classList.remove('shine'); void bub.offsetWidth; bub.classList.add('shine'); }
    var r = card.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height*0.42;
    burst(cx, cy);
    // DOM 팝 (캔버스 위에 겹쳐도 보이게)
    for (var i=0;i<5;i++){
      var el = document.createElement('span');
      el.className = 'pop';
      el.textContent = ['💗','⭐','✨','🍀','💕'][i];
      el.style.left = cx + 'px';
      el.style.top  = cy + 'px';
      el.style.setProperty('--dx', (Math.random()*160-80).toFixed(0)+'px');
      el.style.setProperty('--dy', (-60 - Math.random()*90).toFixed(0)+'px');
      el.style.setProperty('--rot', (Math.random()*80-40).toFixed(0)+'deg');
      document.body.appendChild(el);
      (function(n){ setTimeout(function(){ n.remove(); }, 950); })(el);
    }
    poke();
  }
  cards.forEach(function(card){
    card.addEventListener('click', function(){ tapCard(card); });
  });

  /* ══════════ BGM : 마림바/오르골풍 WAV ══════════ */
  var SR = 22050;
  var audio = null, audioReady = false, wantSound = true, soundBtn = document.getElementById('sound');

  // 멜로디: [midi, 길이(8분음표 단위)] — C장조 밝은 응원 멜로디
  var MELODY = [
    [64,1],[67,1],[72,1],[67,1], [62,1],[67,1],[71,1],[67,1], [64,1],[69,1],[72,1],[69,1], [65,1],[69,1],[72,1],[69,1],
    [64,1],[67,1],[72,1],[76,1], [74,1],[71,1],[67,1],[62,1], [72,1],[69,1],[65,1],[69,1], [67,1],[64,1],[60,1],[64,1],
    [64,1],[67,1],[72,1],[67,1], [62,1],[65,1],[71,1],[74,1], [72,1],[76,1],[81,1],[76,1], [69,1],[72,1],[77,1],[72,1],
    [65,1],[69,1],[74,1],[77,1], [67,1],[71,1],[74,1],[71,1], [76,1],[72,1],[67,1],[72,1], [64,1],[67,1],[72,2]
  ];
  var BASS = [48,43,45,41,48,43,41,48, 48,43,45,41,50,43,48,48];

  function midi2f(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function makeWav(){
    var eighth = 0.155;                       // 8분음표 길이(초)
    var totalE = 0;
    for (var i=0;i<MELODY.length;i++) totalE += MELODY[i][1];
    var dur = totalE * eighth + 0.9;
    var n = Math.ceil(dur * SR);
    var buf = new Float32Array(n);

    function bell(start, f, amp, decay){
      var s0 = Math.floor(start * SR);
      var len = Math.min(n - s0, Math.floor(decay * 3.2 * SR));
      var parts = [[1,1.0,1.0],[2,0.34,1.5],[3.01,0.13,2.1],[4.97,0.05,2.8]];
      for (var p=0;p<parts.length;p++){
        var pf = parts[p][0], pa = parts[p][1], pd = parts[p][2];
        var w = 2*Math.PI*pf*f/SR;
        for (var k=0;k<len;k++){
          var t = k / SR;
          var atk = t < 0.006 ? t/0.006 : 1;
          var env = atk * Math.exp(-t * decay * pd);
          buf[s0+k] += amp * pa * env * Math.sin(w * k);
        }
      }
    }

    var t = 0, barIdx = 0, beat = 0;
    for (var i=0;i<MELODY.length;i++){
      var midi = MELODY[i][0], len = MELODY[i][1];
      var f = midi2f(midi);
      bell(t, f, 0.20, 7.2);
      // 살짝 반짝이는 옥타브 위 (아주 작게)
      if (midi >= 72) bell(t + 0.008, f*2, 0.045, 10);
      t += len * eighth;
      beat += len;
      if (beat >= 4){
        beat -= 4;
        var root = BASS[barIdx % BASS.length];
        bell(t - 4*eighth, midi2f(root), 0.115, 3.4);   // 마디 첫 박 베이스
        barIdx++;
      }
    }

    // 노멀라이즈 + 끝 페이드
    var peak = 0;
    for (var q=0;q<n;q++){ var v = Math.abs(buf[q]); if (v > peak) peak = v; }
    var gain = peak > 0 ? 0.72 / peak : 1;
    var fadeIn = Math.floor(0.02*SR), fadeOut = Math.floor(0.35*SR);
    for (var q2=0;q2<n;q2++){
      var g = gain;
      if (q2 < fadeIn) g *= q2/fadeIn;
      if (q2 > n - fadeOut) g *= Math.max(0, (n - q2)/fadeOut);
      buf[q2] *= g;
    }

    // 16bit PCM WAV
    var bytes = 44 + n*2;
    var ab = new ArrayBuffer(bytes);
    var dv = new DataView(ab);
    function ws(off, s){ for (var x=0;x<s.length;x++) dv.setUint8(off+x, s.charCodeAt(x)); }
    ws(0,'RIFF'); dv.setUint32(4, bytes-8, true); ws(8,'WAVE');
    ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,SR,true); dv.setUint32(28,SR*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    ws(36,'data'); dv.setUint32(40, n*2, true);
    var off = 44;
    for (var z=0;z<n;z++){
      var s = Math.max(-1, Math.min(1, buf[z]));
      dv.setInt16(off, s < 0 ? s*0x8000 : s*0x7FFF, true);
      off += 2;
    }
    return new Blob([ab], {type:'audio/wav'});
  }

  function initAudio(){
    if (audio) return audio;
    audio = new Audio();
    audio.loop = true;
    audio.playsInline = true;
    audio.setAttribute('playsinline','');
    audio.setAttribute('webkit-playsinline','');
    audio.preload = 'auto';
    audio.volume = 0.55;
    try {
      audio.src = URL.createObjectURL(makeWav());
      audioReady = true;
    } catch(e){ audioReady = false; }
    return audio;
  }

  function tryPlay(){
    if (!wantSound) return;
    var a = initAudio();
    if (!a) return;
    var p = a.play();
    if (p && p.catch) p.catch(function(){ /* 다음 제스처에서 재시도 */ });
  }
  function poke(){ if (wantSound && audio && audio.paused) tryPlay(); }

  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (wantSound){
      wantSound = false;
      soundBtn.classList.add('off');
      soundBtn.textContent = '🔇';
      if (audio) audio.pause();
    } else {
      wantSound = true;
      soundBtn.classList.remove('off');
      soundBtn.textContent = '🎵';
      tryPlay();
    }
  });

  // 첫 터치/클릭/키 에서 재생 (iOS 제스처 요구사항)
  var started = false;
  function firstGesture(){
    if (started) return;
    started = true;
    tryPlay();
  }
  ['pointerdown','touchstart','click','keydown'].forEach(function(ev){
    document.addEventListener(ev, firstGesture, {once:false, passive:true});
  });

  // WAV 미리 만들어 두기
  setTimeout(function(){
    try {
      if (!audio) { audio = new Audio(); audio.loop = true; audio.playsInline = true;
        audio.setAttribute('playsinline',''); audio.volume = 0.55;
        audio.src = URL.createObjectURL(makeWav()); audioReady = true; }
    } catch(e){}
  }, 260);

  // 화면 크기 바뀔 때 다시 터지는 이펙트 정리 (메모리)
  setInterval(function(){
    if (bursts.length > 220) bursts.splice(0, bursts.length-220);
    if (bits.length > 40) bits.splice(0, bits.length-40);
  }, 4000);

  // 진단용 (검증에서 사용)
  window.__chiikawa = {
    get canvasRatio(){ return cv.width / parseFloat(cv.style.width); },
    get dpr(){ return DPR; },
    get audioReady(){ return audioReady; },
    get audioPaused(){ return audio ? audio.paused : null; },
    cards: cards.length,
    bubbles: document.querySelectorAll('.bubble').length
  };
})();
</script>
