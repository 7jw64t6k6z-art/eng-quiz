 되어야 한다. has not make는 조동사 뒤에 원형이 온 형태라 비문이다."],"sol":"정답 ⑤. 'has/have + p.p.' 구조에서 부정어 not은 has 뒤에 온다. has not make처럼 조동사 뒤에 동사원형이 오면 곧바로 오류다.","sum":"[한줄 요약] 소리는 뇌가 만들어 내는 지각 현상이므로, 듣는 생명체가 없으면 소리도 없다."},{"id":38,"src":37,"rng":"35-42","type":"순서","instr":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오. [3점]","passage":"<div class=\"insbox\"><span class=\"inslabel\">주어진 글</span>When people are collaborating face to face they can easily see each other and the range of different communication cues being used, so the task space is a subset of the communication space.</div>\n<div class=\"blkbox\"><span class=\"blabel\">(A)</span> So, there is an artificial seam between the communication space and task space. This is the type of impact of remote communication technology that needs to be predicted through communication models.</div>\n<div class=\"blkbox\"><span class=\"blabel\">(B)</span> Ishii, a professor at the MIT Media Lab, describes this as seamless communication because there is no functional separation between the task and communication space. However, when people are working remotely, the task space is often separated from the communication space.</div>\n<div class=\"blkbox\"><span class=\"blabel\">(C)</span> For example, when video conferencing, people may have the face of their collaborator on one screen, while looking at a shared document on another. In this case, it is impossible to see many of the remote collaborator's communication cues at the same time as looking at the task space.</div>\n<p class=\"gloss\">* seam: 갈라진 틈</p>","choices":["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],"answer":2,"exp":["(A)가 먼저 오면 'seam(이음매)'이 무엇 때문에 생겼는지 설명되기 전에 결론이 나온다.","(B)-(A)-(C)로 놓으면 (A)의 'So'가 (C)의 구체적 예시보다 앞서 근거 없이 결론이 나온다.","<b>정답.</b> 주어진 글의 '대면 협업에서는 과업 공간이 소통 공간의 부분집합'이라는 내용을 (B)가 'seamless communication'으로 명명하며 이어받는다. (B) 끝의 'However, 원격에서는 과업 공간이 분리된다'를 (C)가 화상 회의 예시로 구체화하고, (C)의 결과로 '인위적인 이음매가 생긴다'고 정리하는 (A)가 마무리한다.","(C)의 'For example'이 가리킬 원격 협업 내용이 앞에 없으므로 시작이 될 수 없다.","(C)가 먼저 오면 'For example'의 대상이 없고 (B)의 'this'도 지시 대상이 없어진다."],"sol":"정답 ③. '대면 상황 일반 → 원격 상황(However) → 예시(For example) → 결과(So)'의 흐름을 잡으면 된다. (B)의 this는 주어진 글의 'task space is a subset of the communication space'를 받는다.","sum":"[한줄 요약] 대면 협업에서는 과업 공간과 소통 공간이 분리되지 않지만, 원격 협업에서는 둘 사이에 인위적인 이음매가 생긴다."},{"id":39,"src":37,"rng":"35-42","type":"어휘","instr":"다음 (A)~(C)의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은? ( (A)~(C)는 순서와 관계없이 제시된 글의 일부입니다. )","passage":"\n<div class=\"blkbox\"><span class=\"blabel\">(A)</span> So, there is an <u class=\"pt\"><b>①</b> artificial</u> seam between the communication space and task space. This is the type of impact of remote communication technology that needs to be <u class=\"pt\"><b>②</b> ignored</u> through communication models.</div>\n<div class=\"blkbox\"><span class=\"blabel\">(B)</span> Ishii, a professor at the MIT Media Lab, describes this as <u class=\"pt\"><b>③</b> seamless</u> communication because there is no functional separation between the task and communication space. However, when people are working remotely, the task space is often <u class=\"pt\"><b>④</b> separated</u> from the communication space.</div>\n<div class=\"blkbox\"><span class=\"blabel\">(C)</span> For example, when video conferencing, people may have the face of their collaborator on one screen, while looking at a shared document on another. In this case, it is impossible to see many of the remote collaborator's communication <u class=\"pt\"><b>⑤</b> cues</u> at the same time as looking at the task space.</div>\n<p class=\"gloss\">* seam: 갈라진 틈</p>","choices":["①","②","③","④","⑤"],"answer":1,"exp":["artificial seam(인위적인 이음매) — 기술 때문에 생긴 틈이라는 뜻으로 옳다.","<b>정답.</b> 원문은 <b>predicted</b>(예측되다)다. 원격 소통 기술의 영향은 소통 모델을 통해 '예측되어야' 하는 것이므로 ignored(무시되어야)는 문맥과 반대다.","seamless communication(매끄러운 소통) — 기능적 분리가 없어 끊김 없는 소통이라는 뜻으로 옳다.","the task space is often separated from the communication space — 옳다.","communication cues(소통 단서) — 표정·몸짓 같은 단서라는 뜻으로 옳다."],"sol":"정답 ②. 'needs to be predicted through communication models'는 '모델을 통해 예측할 필요가 있다'는 뜻이다. ignore로 바꾸면 '예측'이 '무시'가 되어 논리가 무너진다.","sum":"[한줄 요약] 원격 협업에서는 소통 공간과 과업 공간이 분리되어 이음매가 생기므로, 그 영향을 소통 모델로 예측할 필요가 있다."},{"id":40,"src":38,"rng":"35-42","type":"문장삽입","instr":"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.","passage":"<div class=\"insbox\"><span class=\"inslabel\">주어진 문장</span>Regardless of whether the statement was true or false, belief in the truth of the claim went up as a function of repetition.</div><p>In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false. The students were asked to evaluate the sixty statements three times, at two-week intervals. <span class=\"mk\">(①)</span> Crucially, only twenty of the statements were repeated each time; the other forty were new. <span class=\"mk\">(②)</span> The researchers then compared the 'truth-ratings' of the repeated versus non-repeated statements. <span class=\"mk\">(③)</span> What they found was astonishing. <span class=\"mk\">(④)</span> In other words, the more often you hear a statement, the more 'true' it sounds. <span class=\"mk\">(⑤)</span> This became known as the illusory truth effect.</p>\n<p class=\"gloss\">* trivia: 잡학적 지식</p>","choices":["①","②","③","④","⑤"],"answer":3,"exp":["①은 연구 방법(평가 3회, 2주 간격)이 먼저 제시되어야 하는 자리다.","②는 반복된 20개와 새 40개를 구분한 직후로, 아직 'truth-ratings 비교'라는 절차가 나오기 전이다.","③은 비교 절차 앞이라 결과가 먼저 나오면 순서가 뒤집힌다.","<b>정답.</b> 'What they found was astonishing.'(놀라운 발견) 다음에 그 발견의 내용(반복될수록 참이라고 믿는 정도가 올라갔다)이 와야 하고, 이어지는 'In other words, the more often you hear a statement, the more \"true\" it sounds.'가 이를 풀어 설명한다.","⑤는 'This became known as the illusory truth effect.' 앞으로, 이미 'In other words'로 요약한 뒤라 문장이 들어갈 자리가 없다."],"sol":"정답 ④. 주어진 문장은 '연구 결과'이므로 ① 실험 절차 → ② 비교 → ③ 놀라운 발견 → ④ (결과 진술) → ⑤ 요약·명명의 순서에서 ④ 자리에 들어간다.","sum":"[한줄 요약] 같은 문장을 반복해서 들을수록 그것이 참이라고 믿는 정도가 높아진다(착각적 진실 효과)."},{"id":41,"src":38,"rng":"35-42","type":"내용일치","instr":"다음 글의 내용과 일치하는 것은?","passage":"<p>In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students how certain they were that sixty general-knowledge trivia-like statements were either true or false. The students were asked to evaluate the sixty statements three times, at two-week intervals. <span class=\"mk\">(①)</span> Crucially, only twenty of the statements were repeated each time; the other forty were new. <span class=\"mk\">(②)</span> The researchers then compared the 'truth-ratings' of the repeated versus non-repeated statements. <span class=\"mk\">(③)</span> What they found was astonishing. <span class=\"mk\">(④)</span> In other words, the more often you hear a statement, the more 'true' it sounds. <span class=\"mk\">(⑤)</span> This became known as the illusory truth effect.</p>\n<p class=\"gloss\">* trivia: 잡학적 지식</p>","choices":["학생들은 매번 같은 60개의 문장을 평가했다.","평가는 2주 간격으로 세 번 이루어졌다.","연구 결과, 반복은 문장에 대한 믿음을 낮췄다.","이 효과는 'sleeper effect'로 알려졌다.","연구자들은 학생들에게 직접 잡학 문장을 쓰게 했다."],"answer":1,"exp":["매번 같은 60개가 아니라, 20개만 반복되고 40개는 매번 새로운 문장이었다.","<b>정답.</b> \"asked to evaluate the sixty statements three times, at two-week intervals\" — 2주 간격으로 3회.","반복될수록 문장이 '참'이라고 믿는 정도가 올라갔다(illusory truth effect).","'illusory truth effect'로 알려졌다.","연구자는 문장을 제시했을 뿐, 학생에게 작성을 요구하지 않았다."],"sol":"정답 ②. 숫자(20/40/3회)와 고유명사(illusory truth effect)를 바꿔 놓는 전형적 오답 유형이다.","sum":"[한줄 요약] 2주 간격 3회 평가 실험에서 반복된 문장일수록 '참'이라는 평가가 높아졌다."},{"id":42,"src":39,"rng":"35-42","type":"문장삽입","instr":"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.","passage":"<div class=\"insbox\"><span class=\"inslabel\">주어진 문장</span>When submerged underwater, to avoid feeling the pressure of the surrounding environment, it is necessary to maintain the condition of equal external and internal pressure.</div><p>The human body on the Earth's surface experiences constant air pressure equal to 16-18 tons per square meter of its body surface. However, this pressure is not felt because external pressure is balanced by internal pressure in the lungs and air cavities of the body. <span class=\"mk\">(①)</span> During dives, in addition to atmospheric pressure, the pressure of the water also acts on the human body. <span class=\"mk\">(②)</span> To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water. <span class=\"mk\">(③)</span> Water pressure increases proportionally with depth. <span class=\"mk\">(④)</span> It increases by 1 bar for every 10 meters. <span class=\"mk\">(⑤)</span> It follows that a diver at a depth of 10 meters experiences a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under pressure of 2 atmospheres is required.</p>\n<p class=\"gloss\">* submerge: 물속에 잠그다 &nbsp; ** air cavity: 공기가 들어 있는 공간</p>","choices":["①","②","③","④","⑤"],"answer":1,"exp":["①은 지상에서 기압이 느껴지지 않는 이유를 설명한 직후로, '잠수 시 수압'이라는 새 정보가 와야 자연스럽다.","<b>정답.</b> 주어진 문장은 '외부 압력과 내부 압력을 같게 유지해야 한다'는 원리이고, 바로 뒤의 'To achieve this, ~'가 그 원리를 실현하는 방법(주변 수압과 같은 압력의 호흡 혼합기 공급)을 제시한다. 원리와 'this'가 정확히 연결되는 자리다.","③은 '수압은 깊이에 비례해 증가한다'는 물리적 사실 뒤라, 원리 문장을 다시 꺼내면 흐름이 끊긴다.","④는 '1 bar for every 10 meters'라는 수치 뒤로, 'this'가 가리킬 내용이 이미 사라진 자리다.","⑤는 결론(10m 수심 예시) 뒤라 원리를 다시 제시하는 것이 결론을 되돌리는 구성이 된다."],"sol":"정답 ②. 삽입 문제는 'To achieve this / This means / For example' 같은 지시·연결 표현의 바로 앞이 빈자리인 경우가 많다. 여기서는 'To achieve this'의 this가 주어진 문장의 'equal external and internal pressure'를 가리킨다.","sum":"[한줄 요약] 잠수 시에는 주변 수압과 같은 압력의 호흡 혼합기를 공급해 내외부 압력을 같게 유지해야 한다."},{"id":43,"src":39,"rng":"35-42","type":"어법","instr":"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?","passage":"<p>The human body on the Earth's surface experiences constant air pressure <u class=\"pt\"><b>①</b> equal to</u> 16-18 tons per square meter of its body surface. However, this pressure is not felt because external pressure <u class=\"pt\"><b>②</b> is balanced</u> by internal pressure in the lungs and air cavities of the body. During dives, in addition to atmospheric pressure, the pressure of the water also <u class=\"pt\"><b>③</b> acts</u> on the human body. To achieve this, air or a breathing mixture is supplied to the diver under pressure equal to the pressure applied by the surrounding water. Water pressure increases <u class=\"pt\"><b>④</b> proportional</u> with depth. It increases by 1 bar for every 10 meters. It follows that a diver at a depth of 10 meters <u class=\"pt\"><b>⑤</b> experiences</u> a pressure of 2 bar, and to stabilize pressure, the supply of a breathing mixture under pressure of 2 atmospheres is required.</p>\n<p class=\"gloss\">* submerge: 물속에 잠그다 &nbsp; ** air cavity: 공기가 들어 있는 공간</p>","choices":["①","②","③","④","⑤"],"answer":3,"exp":["equal to ~ — 'air pressure'를 뒤에서 수식하는 형용사구로 옳다.","external pressure is balanced by internal pressure — 수동태로 옳다.","주어 'the pressure of the water'가 단수이므로 acts가 옳다.","<b>정답.</b> 동사 increases를 수식하는 것은 부사이므로 <b>proportionally</b>가 되어야 한다. proportional은 형용사라 동사를 꾸밀 수 없다.","주어 'a diver'가 단수이므로 experiences가 옳다."],"sol":"정답 ④. 동사를 수식하려면 부사(-ly)가 필요하다. increase proportionally with ~ 형태를 기억해 두자.","sum":"[한줄 요약] 수압은 10m마다 1 bar씩 증가하므로, 잠수자는 수심에 맞춰 같은 압력의 호흡 혼합기를 공급받아야 한다."},{"id":44,"src":40,"rng":"35-42","type":"요약","instr":"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?","passage":"<p>Researchers recently found that goldenrods that live in peaceful areas without much threat from predators will issue chemical alarm calls that are incredibly specific — comprehensible only to their close kin — on the rare occasion they are attacked. But goldenrods in more hostile territory signal to their neighbors using chemical phrases easily understood by all the goldenrod in the area, not just their biological kin. Instead of using coded whisper networks, these goldenrod broadcast the threat over loudspeaker, so to speak. It is the first time research has confirmed that these chemical communications are beneficial not only to the plant receiving them but also to the sender. When times are truly tough, you do not want to be left standing in a field alone. There will be no one to mate with, no one to help bring in pollinators.</p>\n<p class=\"gloss\">* goldenrod: 미역취 &nbsp; ** pollinator: 꽃가루 매개자</p>\n<div class=\"sumbox\"><p>Compared to those in peaceful areas, goldenrods in more hostile environments send more <b>(A)</b> <span class=\"blk\">&nbsp;________&nbsp;</span> understandable chemical messages, thereby <b>(B)</b> <span class=\"blk\">&nbsp;________&nbsp;</span> both the senders and the receivers.</p></div>","choices":["(A) broadly / (B) benefiting","(A) easily / (B) harming","(A) narrowly / (B) protecting","(A) accidentally / (B) profiting","(A) specifically / (B) endangering"],"answer":0,"exp":["<b>정답.</b> 적대적 환경의 미역취는 '모두가 쉽게 이해할 수 있는(easily understood)' 화학 신호를 널리 보낸다 → broadly understandable. 그리고 그런 소통은 신호를 받는 쪽뿐 아니라 보내는 쪽에도 이익이 된다 → benefiting both.","'easily'는 (A)로는 가능하지만, (B) harming은 'beneficial not only to the plant receiving them but also to the sender'와 정반대다.","'narrowly'는 평화로운 지역의 특징(specific — 오직 가까운 친족에게만)이며, (B) protecting도 근거가 약하다.","'accidentally'는 문맥에 없고, (B) profiting은 (A)와 함께 성립하지 않는다.","'specifically'는 평화로운 지역의 특징이고, (B) endangering은 이익과 반대다."],"sol":"정답 ①. 요약문의 (A)는 '평화 지역과 대비되는 적대적 지역'의 특징을, (B)는 마지막 문단의 'beneficial to both'를 그대로 반영해야 한다.","sum":"[한줄 요약] 적대적 환경의 미역취는 모든 이가 알아듣는 넓은 화학 신호를 보내, 보내는 쪽과 받는 쪽 모두에게 이익이 된다."},{"id":45,"src":40,"rng":"35-42","type":"어휘","instr":"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?","passage":"<p>Researchers recently found that goldenrods that live in <u class=\"pt\"><b>①</b> peaceful</u> areas without much threat from predators will issue chemical alarm calls that are incredibly <u class=\"pt\"><b>②</b> specific</u> — <u class=\"pt\"><b>③</b> unintelligible</u> only to their close kin — on the rare occasion they are attacked. But goldenrods in more <u class=\"pt\"><b>④</b> hostile</u> territory signal to their neighbors using chemical phrases easily understood by all the goldenrod in the area, not just their biological kin. Instead of using coded whisper networks, these goldenrod <u class=\"pt\"><b>⑤</b> broadcast</u> the threat over loudspeaker, so to speak. It is the first time research has confirmed that these chemical communications are beneficial not only to the plant receiving them but also to the sender. When times are truly tough, you do not want to be left standing in a field alone. There will be no one to mate with, no one to help bring in pollinators.</p>\n<p class=\"gloss\">* goldenrod: 미역취 &nbsp; ** pollinator: 꽃가루 매개자</p>","choices":["①","②","③","④","⑤"],"answer":2,"exp":["peaceful areas — 포식자의 위협이 적은 '평화로운' 지역이라는 뜻으로 옳다.","incredibly specific — 매우 '특정한' 신호라는 뜻으로 옳다.","<b>정답.</b> 원문은 <b>comprehensible</b>(이해 가능한)이다. '오직 가까운 친족에게만 이해되는'이라는 뜻이어야 하므로 unintelligible(이해할 수 없는)은 정반대다.","hostile territory(적대적인 영역) — 위협이 많은 지역이라는 뜻으로 옳다.","broadcast(방송하다) — 확성기로 위협을 알리듯 널리 퍼뜨린다는 비유로 옳다."],"sol":"정답 ③. 뒤에 붙은 'only to their close kin'이 결정적 단서다. '오직 친족에게만' 이해된다는 뜻이므로 comprehensible이 와야 한다.","sum":"[한줄 요약] 위협이 적은 곳의 미역취는 친족만 알아듣는 좁은 신호를, 위협이 많은 곳의 미역취는 모두가 알아듣는 넓은 신호를 보내 서로를 돕는다."},{"id":46,"src":41,"rng":"35-42","type":"제목","instr":"윗글의 제목으로 가장 적절한 것은? [3점]","passage":"<p>Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience. From a sustainability perspective, many of these patterns encourage overconsumption of data and attention. Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing. Autoplay forces media to load and play even for people who may never watch it. These choices consume more energy on both the user's device and the servers delivering the content. Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default. This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings. As a result, most users consume more resources unless they actively search for a way to opt out.</p>\n<p>It is important to acknowledge that web design always nudges behavior in some way. Showing consequences and highlighting options are all forms of influence. The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests. In many cases, the most responsible approach is to make the lower-impact option the default, while keeping alternatives clearly available. Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.</p>\n<p class=\"gloss\">* default: 기본값 &nbsp; ** nudge: 유도하다 &nbsp; *** transparent: 투명한</p>","choices":["Creating Web Design That Respects Users and the Environment","The Better the Web Design, the More Data Usage Required","The Environmental Costs of Making Digital Devices","Why Do Users Prefer Autoplaying Visual Content?","User-Friendly Design: Making Purchasing Easier"],"answer":0,"exp":["<b>정답.</b> 사용자의 통제권을 존중하고 환경 영향까지 고려한 웹 디자인(투명하고 되돌릴 수 있는 기본값)을 논한다.","데이터 사용이 많을수록 좋은 디자인이라는 말은 글과 정반대다.","디지털 '기기 제조'의 환경 비용이 아니라 '웹 디자인 패턴'이 만드는 비용이다.","사용자가 자동 재생 콘텐츠를 '선호한다'는 근거가 없으며, 오히려 부정적으로 서술된다.","구매를 쉽게 하는 디자인이 아니라 사용자 통제와 환경 문제를 다룬다."],"sol":"정답 ①. 제목은 '글의 소재 + 필자의 태도'를 담는다. 이 글의 결론은 'the most responsible approach is to make the lower-impact option the default'로, 사용자와 환경을 함께 존중하는 디자인이다.","sum":"[한줄 요약] 사용자의 통제권을 빼앗는 웹 디자인 패턴은 자원을 낭비하므로, 투명하고 되돌릴 수 있는 '저영향 기본값'이 윤리적이다."},{"id":47,"src":42,"rng":"35-42","type":"어휘","instr":"밑줄 친 (a) ~ (e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","passage":"<p>Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience. From a sustainability perspective, many of these patterns encourage <u class=\"pt\"><b>(a)</b> overconsumption</u> of data and attention. Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing. Autoplay <u class=\"pt\"><b>(b)</b> forces</u> media to load and play even for people who may never watch it. These choices consume more energy on both the user's device and the servers delivering the content. Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default. This change significantly increases data usage and battery consumption, while the option to disable it is buried <u class=\"pt\"><b>(c)</b> deep</u> in the settings. As a result, most users consume more resources unless they actively search for a way to opt out.</p>\n<p>It is important to acknowledge that web design always nudges behavior in some way. Showing consequences and highlighting options are all forms of influence. The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests. In many cases, the most <u class=\"pt\"><b>(d)</b> responsible</u> approach is to make the lower-impact option the default, while keeping alternatives clearly available. Defaults are <u class=\"pt\"><b>(e)</b> powerless</u>, and when chosen carefully, they can reduce environmental impact without removing user agency.</p>\n<p class=\"gloss\">* default: 기본값 &nbsp; ** nudge: 유도하다 &nbsp; *** transparent: 투명한</p>","choices":["(a)","(b)","(c)","(d)","(e)"],"answer":4,"exp":["(a) overconsumption — 무한 스크롤 등이 데이터와 주의력의 '과소비'를 조장한다는 뜻으로 옳다.","(b) forces — 자동 재생이 미디어를 '강제로' 불러오게 한다는 뜻으로 옳다.","(c) deep — 끄는 옵션이 설정 '깊숙이' 묻혀 있다는 뜻으로 옳다.","(d) responsible — '가장 책임 있는 접근'이라는 뜻으로 옳다.","<b>정답.</b> 원문은 'Defaults are <b>powerful</b>'이다. 기본값을 신중히 고르면 환경 영향을 줄이면서도 사용자의 선택권을 없애지 않는다는 뜻이므로 powerless(힘없는)는 정반대다."],"sol":"정답 ⑤. (e) 문장은 '기본값은 강력하다 → 신중히 고르면 환경 영향을 줄일 수 있다'는 논리다. powerless가 들어가면 뒤의 'can reduce'와 모순된다.","sum":"[한줄 요약] 기본값은 강력하므로, 저영향 옵션을 기본값으로 삼되 대안을 명확히 열어 두는 것이 윤리적이다."},{"id":48,"src":41,"rng":"35-42","type":"어법","instr":"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?","passage":"<p>Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all <u class=\"pt\"><b>①</b> interfere with</u> the user's control over their own experience. From a sustainability perspective, many of these patterns encourage <u class=\"pt\"><b>②</b> overconsumption</u> of data and attention. Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing. Autoplay <u class=\"pt\"><b>③</b> force</u> media to load and play even for people who may never watch it. These choices consume more energy on both the user's device and the servers delivering the content. Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default. This change significantly increases data usage and battery consumption, while the option to disable it is buried <u class=\"pt\"><b>④</b> deep</u> in the settings. As a result, most users consume more resources unless they actively search for a way to opt out.</p>\n<p>It is important to acknowledge that web design always nudges behavior in some way. Showing consequences and highlighting options are all forms of influence. The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests. In many cases, the most responsible approach is to make the lower-impact option the default, while <u class=\"pt\"><b>⑤</b> keeping</u> alternatives clearly available. Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.</p>\n<p class=\"gloss\">* default: 기본값 &nbsp; ** nudge: 유도하다</p>","choices":["①","②","③","④","⑤"],"answer":2,"exp":["주어 'Patterns'가 복수이므로 interfere with가 옳다.","'encourage overconsumption of ~' — 셀 수 없는 명사 overconsumption으로 옳다.","<b>정답.</b> 주어 Autoplay가 단수이므로 <b>forces</b>가 되어야 한다. 바로 앞의 복수 명사 videos/patterns에 끌리면 틀린다.","buried deep in the settings — 부사 deep(~깊숙이)이 전치사구를 수식하므로 옳다.","'while + -ing' 분사구문으로, 앞의 'to make ~'와 의미상 병렬을 이루어 옳다."],"sol":"정답 ③. 주어(Autoplay)와 동사(force) 사이에 복수 명사가 없어도, 앞 문장의 복수 주어에 끌려 수일치를 놓치는 유형이다.","sum":"[한줄 요약] 자동 재생·무한 스크롤 같은 패턴은 사용자의 통제를 빼앗고 자원을 낭비한다."},{"id":49,"src":42,"rng":"35-42","type":"내용일치","instr":"윗글의 내용과 일치하는 것은?","passage":"<p>Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase all interfere with the user's control over their own experience. From a sustainability perspective, many of these patterns encourage overconsumption of data and attention. Infinite scroll keeps loading new content whether the user wants it or not, increasing data usage and device processing. Autoplay forces media to load and play even for people who may never watch it. These choices consume more energy on both the user's device and the servers delivering the content. Take the decision by a popular music streaming platform to replace static album artwork with short video loops by default. This change significantly increases data usage and battery consumption, while the option to disable it is buried deep in the settings. As a result, most users consume more resources unless they actively search for a way to opt out.</p>\n<p>It is important to acknowledge that web design always nudges behavior in some way. Showing consequences and highlighting options are all forms of influence. The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests. In many cases, the most responsible approach is to make the lower-impact option the default, while keeping alternatives clearly available. Defaults are powerful, and when chosen carefully, they can reduce environmental impact without removing user agency.</p>\n<p class=\"gloss\">* default: 기본값 &nbsp; ** nudge: 유도하다 &nbsp; *** transparent: 투명한</p>","choices":["무한 스크롤은 데이터 사용량을 줄인다.","자동 재생은 그것을 시청할 사람에게만 미디어를 재생한다.","한 음악 스트리밍 플랫폼이 기본값을 동영상 루프에서 정적 앨범 아트로 바꿨다.","윤리적 쟁점은 유도(nudging)의 존재 여부가 아니라 그것이 투명하고 되돌릴 수 있는지 여부다.","필자는 기본값(default)을 없애야 한다고 주장한다."],"answer":3,"exp":["무한 스크롤은 'increasing data usage'로 데이터 사용을 늘린다.","'even for people who may never watch it' — 시청하지 않을 사람에게도 재생된다.","정적 아트워크를 '동영상 루프로' 바꾼 것과 반대다.","<b>정답.</b> \"The ethical line is not whether nudging exists, but whether it is transparent, reversible, and aligned with the user's interests.\"","기본값을 없애자는 것이 아니라, 신중히 고른 기본값이 환경 영향을 줄인다고 했다."],"sol":"정답 ④. 'not A but B' 구문은 그 자체로 정답 근거가 되는 경우가 많다. 여기서는 A(유도 존재 여부)와 B(투명성·되돌릴 수 있음)를 바꿔 놓은 선지가 없음을 확인하자.","sum":"[한줄 요약] 웹 디자인의 윤리적 기준은 유도 행위의 유무가 아니라 투명성·가역성·사용자 이익과의 일치 여부다."}]</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('qdata').textContent);
var TOTAL = DATA.length;
var KEY = 'g1eng_2026_10_quiz_v1';
var MARKS = ['①','②','③','④','⑤'];
var RANGES = [
  {id:'all', label:'전체'},
  {id:'18-24', label:'18~24'},
  {id:'29-34', label:'29~34'},
  {id:'35-42', label:'35~42'},
  {id:'wrong', label:'틀린 문제만'}
];
var REVIEW_KEY = 'g1eng_2026_10_review';

var reviewIds = null;
var cur = {list:[], idx:0};
var autoOpened = false;

/* ---------- state ---------- */
function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && s.v === 1) return {answers: s.answers || {}, last: s.last || {}, filter: s.filter || 'all'};
    }
  }catch(e){}
  return {answers:{}, last:{}, filter:'all'};
}
var state = loadState();
if(!RANGES.some(function(r){return r.id === state.filter;})) state.filter = 'all';

function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify({v:1, answers:state.answers, last:state.last, filter:state.filter})); }catch(e){}
}

function isAnswered(q){ return Object.prototype.hasOwnProperty.call(state.answers, q.id); }
function isCorrect(q){ return isAnswered(q) && state.answers[q.id] === q.answer; }
function wrongQuestions(){ return DATA.filter(function(q){ return isAnswered(q) && state.answers[q.id] !== q.answer; }); }
function doneCount(){ return DATA.filter(isAnswered).length; }
function correctCount(){ return DATA.filter(isCorrect).length; }

function listFor(f){
  if(f === 'all') return DATA;
  if(f === 'wrong'){
    var ids = reviewIds || wrongQuestions().map(function(q){return q.id;});
    return DATA.filter(function(q){ return ids.indexOf(q.id) !== -1; });
  }
  return DATA.filter(function(q){ return q.rng === f; });
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var d = document.createElement(tag);
  if(cls) d.className = cls;
  if(html != null) d.innerHTML = html;
  return d;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- header ---------- */
function renderHeader(){
  var d = doneCount(), c = correctCount();
  document.getElementById('statCorrect').textContent = c;
  document.getElementById('statDone').textContent = d;
  var rateEl = document.getElementById('statRate');
  rateEl.textContent = d ? Math.round(c / d * 100) + '%' : '-';
  document.getElementById('barFill').style.width = (d / TOTAL * 100) + '%';
  document.getElementById('totalTag').textContent = TOTAL + '문항';
}

function renderTabs(){
  var host = document.getElementById('tabs');
  host.innerHTML = '';
  RANGES.forEach(function(r){
    var n = listFor(r.id).length;
    var b = el('button', 'tab' + (state.filter === r.id ? ' on' : ''),
      esc(r.label) + '<span class="cnt">' + n + '</span>');
    b.type = 'button';
    b.setAttribute('aria-pressed', state.filter === r.id ? 'true' : 'false');
    b.addEventListener('click', function(){ setFilter(r.id); });
    host.appendChild(b);
  });
}

function setFilter(f){
  if(f !== 'wrong') reviewIds = null;
  state.filter = f;
  saveState();
  rebuild(true);
}

/* ---------- card ---------- */
function renderCard(){
  var host = document.getElementById('cardHost');
  host.innerHTML = '';
  var q = cur.list[cur.idx];

  if(!q){
    var e = el('div', 'card empty');
    e.innerHTML = '<div class="big">🎉</div><p>' +
      (state.filter === 'wrong' ? '틀린 문제가 없어요! 모두 맞혔습니다.' : '해당 범위에 문항이 없어요.') +
      '</p>';
    var b = el('button','btn primary','전체 문제 보기');
    b.type = 'button';
    b.addEventListener('click', function(){ setFilter('all'); });
    e.appendChild(b);
    host.appendChild(e);
    return;
  }

  var card = el('div', 'card');

  var head = el('div', 'card-head');
  head.appendChild(el('span', 'qno', 'Q' + String(q.id).padStart(2,'0')));
  head.appendChild(el('span', 'badge', '지문 ' + q.src + '번'));
  head.appendChild(el('span', 'badge type', esc(q.type)));
  head.appendChild(el('span', 'badge pos', (cur.idx + 1) + ' / ' + cur.list.length));
  card.appendChild(head);

  card.appendChild(el('p', 'instr', esc(q.instr)));

  var pass = el('div', 'passage');
  pass.innerHTML = q.passage;
  card.appendChild(pass);

  /* underline points inside passage */
  var pts = pass.querySelectorAll('u.pt');

  var choices = el('div', 'choices');
  var compact = q.choices.every(function(c){ return c.length <= 2; });
  if(compact) choices.className = 'choices compact';

  q.choices.forEach(function(text, i){
    var btn = el('button', 'ch');
    btn.type = 'button';
    btn.dataset.i = String(i);
    if(compact){
      btn.innerHTML = esc(text);
    }else{
      btn.innerHTML = '<span class="num">' + MARKS[i] + '</span><span class="tx">' + esc(text) + '</span>';
    }
    btn.addEventListener('click', function(){ pick(q, i); });
    choices.appendChild(btn);
  });
  card.appendChild(choices);

  var fbHost = el('div');
  card.appendChild(fbHost);

  if(isAnswered(q)) paintAnswered(q, choices, pts, fbHost, false);
  host.appendChild(card);
}

function paintAnswered(q, choicesEl, pts, fbHost, animate){
  var picked = state.answers[q.id];
  var ok = picked === q.answer;

  Array.prototype.forEach.call(choicesEl.children, function(btn){
    var i = Number(btn.dataset.i);
    btn.disabled = true;
    if(i === q.answer) btn.classList.add('ok');
    else if(i === picked) btn.classList.add('no');
  });

  if(pts && pts.length){
    if(pts[q.answer]) pts[q.answer].classList.add('pt-ok');
    if(!ok && pts[picked]) pts[picked].classList.add('pt-no');
  }

  fbHost.innerHTML = '';
  var fb = el('div', 'fb ' + (ok ? 'ok' : 'no'));
  var hd = el('div', 'fb-hd');
  hd.innerHTML = (ok ? '✅ 정답입니다!' : '❌ 아쉬워요 · 정답은 ' + MARKS[q.answer]) +
    '<button class="sp" type="button">이 문제 다시 풀기</button>';
  fb.appendChild(hd);

  var ol = el('ol', 'exp');
  q.exp.forEach(function(t, i){
    var li = el('li', i === q.answer ? 'correct' : '');
    li.innerHTML = '<span class="m">' + MARKS[i] + '</span>' + t;
    ol.appendChild(li);
  });
  fb.appendChild(ol);

  if(q.sol) fb.appendChild(el('div', 'sol', '<b>핵심 해설</b> · ' + q.sol));
  if(q.sum) fb.appendChild(el('div', 'sum', esc(q.sum)));

  hd.querySelector('.sp').addEventListener('click', function(){
    delete state.answers[q.id];
    saveState();
    rebuild(false);
  });

  fbHost.appendChild(fb);
  if(animate){
    fb.style.scrollMarginTop = '150px';
    try{ fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
  }
}

function pick(q, i){
  if(isAnswered(q)) return;
  state.answers[q.id] = i;
  saveState();

  var card = document.querySelector('#cardHost .card');
  if(!card) return;
  var choicesEl = card.querySelector('.choices');
  var pass = card.querySelector('.passage');
  var pts = pass ? pass.querySelectorAll('u.pt') : [];
  var fbHost = card.lastElementChild;
  paintAnswered(q, choicesEl, pts, fbHost, true);

  renderHeader(); renderTabs(); renderMini();

  if(doneCount() === TOTAL && !autoOpened){
    autoOpened = true;
    setTimeout(openResult, 900);
  }
}

/* ---------- nav ---------- */
function goto(i){
  if(!cur.list.length) return;
  cur.idx = Math.max(0, Math.min(cur.list.length - 1, i));
  state.last[state.filter] = cur.idx;
  saveState();
  renderCard(); renderNav(); renderMini();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderNav(){
  document.getElementById('btnPrev').disabled = cur.idx <= 0;
  document.getElementById('btnNext').disabled = cur.idx >= cur.list.length - 1;
  var jump = document.getElementById('jump');
  jump.innerHTML = '';
  cur.list.forEach(function(q, i){
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = 'Q' + String(q.id).padStart(2,'0') + ' · ' + q.src + '번 · ' + q.type;
    if(i === cur.idx) o.selected = true;
    jump.appendChild(o);
  });
}

function renderMini(){
  var host = document.getElementById('minimap');
  host.innerHTML = '';
  if(!cur.list.length){ document.getElementById('mmwrap').style.display = 'none'; return; }
  document.getElementById('mmwrap').style.display = '';
  cur.list.forEach(function(q, i){
    var b = el('button', 'mm' + (isCorrect(q) ? ' ok' : (isAnswered(q) ? ' no' : '')) + (i === cur.idx ? ' cur' : ''), String(q.id));
    b.type = 'button';
    b.setAttribute('aria-label', 'Q' + q.id + ' ' + q.type);
    b.addEventListener('click', function(){ goto(i); });
    host.appendChild(b);
  });
}

/* ---------- rebuild ---------- */
function rebuild(resetIdx){
  cur.list = listFor(state.filter);
  var saved = state.last[state.filter] || 0;
  cur.idx = resetIdx ? 0 : Math.max(0, Math.min(cur.list.length - 1, saved));
  renderHeader(); renderTabs(); renderCard(); renderNav(); renderMini();
}

/* ---------- result ---------- */
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

function renderResult(){
  var d = doneCount(), c = correctCount();
  var body = document.getElementById('resultBody');
  var html = '';

  html += '<div class="rgrid">' +
    '<div class="cell"><div class="v">' + TOTAL + '</div><div class="l">전체 문항</div></div>' +
    '<div class="cell acc"><div class="v">' + d + '</div><div class="l">푼 문항</div></div>' +
    '<div class="cell okk"><div class="v">' + pct(c, d) + '<span style="font-size:12px">%</span></div><div class="l">정답률</div></div>' +
    '</div>';

  /* by range */
  html += '<p class="sec-t">범위별 정답률</p>';
  var rangeStats = [];
  ['18-24','29-34','35-42'].forEach(function(r){
    var qs = DATA.filter(function(q){ return q.rng === r; });
    var dd = qs.filter(isAnswered).length;
    var cc = qs.filter(isCorrect).length;
    var p = pct(cc, dd);
    rangeStats.push({r:r, d:dd, c:cc, p:p, n:qs.length});
    html += '<div class="rrow"><div class="top"><span>' + r + '번</span>' +
      '<span class="d">' + cc + '/' + dd + ' · ' + qs.length + '문항</span>' +
      '<span class="pct">' + (dd ? p + '%' : '-') + '</span></div>' +
      '<div class="mini-bar"><span class="' + (p < 50 && dd ? 'vlow' : (p < 75 && dd ? 'low' : '')) + '" style="width:' + (dd ? p : 0) + '%"></span></div></div>';
  });

  /* by type */
  var types = {};
  DATA.forEach(function(q){
    if(!types[q.type]) types[q.type] = {n:0, d:0, c:0};
    types[q.type].n++;
    if(isAnswered(q)) types[q.type].d++;
    if(isCorrect(q)) types[q.type].c++;
  });
  var tlist = Object.keys(types).map(function(t){
    var o = types[t];
    return {t:t, n:o.n, d:o.d, c:o.c, p:pct(o.c, o.d)};
  }).filter(function(o){ return o.d > 0; }).sort(function(a,b){ return a.p - b.p; });

  html += '<p class="sec-t">유형별 정답률 (낮은 순)</p>';
  if(!tlist.length){
    html += '<div class="rrow"><div class="top"><span style="color:#a3aab6">아직 푼 문제가 없어요.</span></div></div>';
  }else{
    tlist.forEach(function(o){
      html += '<div class="rrow"><div class="top"><span>' + esc(o.t) + '</span>' +
        '<span class="d">' + o.c + '/' + o.d + ' · ' + o.n + '문항</span>' +
        '<span class="pct">' + o.p + '%</span></div>' +
        '<div class="mini-bar"><span class="' + (o.p < 50 ? 'vlow' : (o.p < 75 ? 'low' : '')) + '" style="width:' + o.p + '%"></span></div></div>';
    });
  }

  /* tip */
  var weakR = rangeStats.filter(function(o){ return o.d > 0; }).sort(function(a,b){ return a.p - b.p; })[0];
  var tips = [];
  if(tlist.length){
    var worst = tlist.slice(0, 2).filter(function(o){ return o.p < 85; });
    if(worst.length){
      tips.push('가장 약한 유형은 <b>' + worst.map(function(o){ return esc(o.t) + '(' + o.p + '%)'; }).join(', ') + '</b> 입니다. 해설에서 근거 문장을 다시 확인해 보세요.');
    }else{
      tips.push('모든 유형에서 85% 이상이에요. 아주 좋아요! 틀린 문제만 다시 풀어 마무리해 보세요.');
    }
  }
  if(weakR && weakR.p < 80 && weakR.d >= 3) tips.push('<b>' + weakR.r + '번</b> 범위의 정답률이 ' + weakR.p + '%로 상대적으로 낮아요. 이 범위부터 다시 보는 것을 추천합니다.');
  if(d < TOTAL) tips.push('아직 ' + (TOTAL - d) + '문항이 남았어요. 이어서 풀면 취약점 통계가 더 정확해져요.');
  if(tips.length) html += '<div class="tipbox">' + tips.join('<br>') + '</div>';

  var wrongN = wrongQuestions().length;
  html += '<div class="acts">' +
    '<button class="btn primary" id="btnRetryWrong"' + (wrongN ? '' : ' disabled style="opacity:.45"') + '>틀린 문제만 다시 풀기' + (wrongN ? ' (' + wrongN + ')' : '') + '</button>' +
    '<button class="btn" id="btnReset2">전체 처음부터 다시 풀기</button>' +
    '</div>';

  body.innerHTML = html;

  var rw = document.getElementById('btnRetryWrong');
  if(rw) rw.addEventListener('click', function(){
    var ids = wrongQuestions().map(function(q){ return q.id; });
    if(!ids.length) return;
    ids.forEach(function(id){ delete state.answers[id]; });
    reviewIds = ids;
    state.filter = 'wrong';
    autoOpened = false;
    saveState();
    closeResult();
    rebuild(true);
  });
  var r2 = document.getElementById('btnReset2');
  if(r2) r2.addEventListener('click', function(){ closeResult(); resetAll(); });
}

function openResult(){
  renderResult();
  document.getElementById('modal').classList.add('show');
}
function closeResult(){
  document.getElementById('modal').classList.remove('show');
}

function resetAll(){
  if(!window.confirm('모든 풀이 기록을 지우고 처음부터 다시 풀까요?')) return;
  state.answers = {};
  state.last = {};
  reviewIds = null;
  state.filter = 'all';
  autoOpened = false;
  saveState();
  rebuild(true);
}

/* ---------- events ---------- */
document.getElementById('btnPrev').addEventListener('click', function(){ goto(cur.idx - 1); });
document.getElementById('btnNext').addEventListener('click', function(){ goto(cur.idx + 1); });
document.getElementById('jump').addEventListener('change', function(e){ goto(Number(e.target.value)); });
document.getElementById('btnResult').addEventListener('click', openResult);
document.getElementById('btnClose').addEventListener('click', closeResult);
document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === document.getElementById('modal')) closeResult();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft' && e.target.tagName !== 'SELECT'){ goto(cur.idx - 1); }
  else if(e.key === 'ArrowRight' && e.target.tagName !== 'SELECT'){ goto(cur.idx + 1); }
  else if(e.key === 'Escape'){ closeResult(); }
});

/* swipe */
(function(){
  var sx = 0, sy = 0, active = false;
  var host = document.getElementById('cardHost');
  host.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true;
  }, {passive:true});
  host.addEventListener('touchend', function(e){
    if(!active) return;
    active = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 70 && Math.abs(dy) < 45){
      if(dx < 0) goto(cur.idx + 1); else goto(cur.idx - 1);
    }
  }, {passive:true});
})();

/* go */
rebuild(true);
})();
</script>
</body>
