<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>영어 II 통합 퀴즈 · 2학기 2차 정기고사</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1b2230; --sub:#69707e; --line:#e5e8ee;
  --accent:#3563e9; --accent-soft:#eef2fe; --accent-line:#c7d5fb;
  --ok:#0f7a55; --ok-bg:#e9f8f1; --ok-line:#9ad8c1;
  --no:#c5374b; --no-bg:#fdeef0; --no-line:#f2b3bd;
  --radius:16px; --hdh:170px; --c1:#3563e9; --c2:#0f7a55; --c3:#c2790a; --c4:#8a3ffc;
}
*,*::before,*::after{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.6; word-break:keep-all;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit; cursor:pointer;}

/* header */
.hd{position:sticky; top:0; z-index:60; background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);}
.hd-top{display:flex; align-items:center; gap:8px; padding:7px 13px 0;}
.hd-title{font-size:14.5px; font-weight:800; letter-spacing:-.35px; flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hd-title em{font-style:normal; color:var(--accent); font-size:10.5px; font-weight:800; margin-left:5px;
  background:var(--accent-soft); padding:2px 6px; border-radius:6px; vertical-align:1.5px;}
.hd-prog{display:flex; align-items:center; gap:8px; padding:4px 13px 5px;}
.bar{flex:1 1 auto; height:6px; background:#e8ebf1; border-radius:999px; overflow:hidden;}
.bar-fill{height:100%; width:0%; background:linear-gradient(90deg,#5b84f2,#3563e9); border-radius:999px;
  transition:width .3s cubic-bezier(.4,0,.2,1);}
.stat{font-size:11px; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:700;}
.stat b{color:var(--accent); font-weight:800;}
.stat i{font-style:normal; color:var(--ok); font-weight:800;}
/* tabs */
.tabs{display:flex; gap:5px; padding:0 10px 6px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.cat{flex:1 1 0; min-width:76px; border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:12.4px; font-weight:800; padding:7px 6px; border-radius:11px; white-space:nowrap;
  display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.15;
  transition:transform .08s, background .15s, color .15s, border-color .15s;}
.cat span{font-size:9.6px; font-weight:800; opacity:.75; font-variant-numeric:tabular-nums;}
.cat:active{transform:scale(.97);}
.cat.act{background:var(--ink); border-color:var(--ink); color:#fff;}
.cat.act span{opacity:.85;}
.kind{flex:1 1 0; min-width:70px; border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:11.6px; font-weight:800; padding:7px 4px; border-radius:10px; white-space:nowrap;
  display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.15;}
.kind span{font-size:9.3px; opacity:.75; font-variant-numeric:tabular-nums;}
.kind.act{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
.toolrow{display:flex; gap:5px; overflow-x:auto; padding:0 10px 7px; scrollbar-width:none; align-items:center;}
.toolrow::-webkit-scrollbar{display:none;}
.tool{border:1px solid var(--line); background:#fff; color:var(--ink); font-size:11px; font-weight:800;
  padding:5px 8px; border-radius:999px; white-space:nowrap; flex:0 0 auto; transition:transform .08s, background .15s, color .15s;}
.tool:active{transform:scale(.96);}
.tool.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.tool.danger{color:#9aa1ae;}
.sep{flex:0 0 auto; width:1px; align-self:stretch; background:var(--line); margin:3px 2px;}
.chip{border:1px solid var(--line); background:#fff; color:var(--sub); font-size:11.6px; font-weight:800;
  min-width:32px; height:27px; padding:0 7px; border-radius:999px; flex:0 0 auto;
  font-variant-numeric:tabular-nums; position:relative; transition:transform .08s, background .15s, color .15s;}
.chip:active{transform:scale(.94);}
.chip.act{background:var(--ink); border-color:var(--ink); color:#fff;}
.chip.done{border-color:var(--ok-line); color:var(--ok); background:var(--ok-bg);}
.chip.done.act{background:var(--ok); border-color:var(--ok); color:#fff;}
.chip .dot{position:absolute; top:2px; right:3px; width:5px; height:5px; border-radius:50%; background:#e0a100; display:none;}
.chip.hasq .dot{display:block;}

/* list */
.wrap{max-width:780px; margin:0 auto; padding:12px 12px 44px;}
.tip{font-size:11.8px; color:var(--sub); line-height:1.55; padding:0 4px 10px; font-weight:600;}
.tip b{color:var(--ink);}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  margin:0 0 14px; box-shadow:0 1px 2px rgba(20,30,60,.04); overflow:hidden;
  scroll-margin-top:calc(var(--hdh) + 8px); transition:box-shadow .25s, border-color .25s;}
.card.flash{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.card-hd{display:flex; align-items:center; gap:8px; padding:11px 13px 9px; border-bottom:1px solid #f0f2f6; background:#fbfcfe;}
.num{flex:0 0 auto; min-width:40px; height:25px; padding:0 8px; border-radius:8px; background:var(--ink); color:#fff;
  font-size:12px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; letter-spacing:-.2px;}
.card.full .num{background:var(--ok);}
.card.half .num{background:var(--accent);}
.ttl{flex:1 1 auto; font-size:13px; font-weight:750; letter-spacing:-.25px; line-height:1.35; min-width:0;}
.src{display:block; font-size:10px; color:var(--sub); font-weight:700; margin-top:1px;}
.cnt{flex:0 0 auto; font-size:11px; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums;
  background:#f1f3f8; padding:3px 7px; border-radius:999px;}
.card.full .cnt{color:var(--ok); background:var(--ok-bg);}
.body{padding:13px 14px 4px; font-size:16px; line-height:1.95; letter-spacing:.05px; color:#222a38;}
.body p{margin:0 0 10px;}
.body .lbl{display:inline-block; font-size:11px; font-weight:800; color:var(--accent); background:var(--accent-soft);
  border-radius:6px; padding:1px 6px; margin-right:5px; vertical-align:1px;}
.givenbox{border:1px solid var(--accent-line); background:var(--accent-soft); border-radius:12px;
  padding:10px 12px; margin:0 0 12px; font-size:14.6px; line-height:1.7; color:#22314f;}
.givenbox .gt{display:block; font-size:10.5px; font-weight:800; color:var(--accent); margin-bottom:4px; letter-spacing:.2px;}
.mk{display:inline-block; min-width:17px; height:17px; padding:0 3px; border-radius:50%; border:1.4px solid #b9c3d8;
  background:#fff; color:#33415c; font-size:10.5px; font-weight:800; text-align:center; line-height:15px;
  margin:0 1px; vertical-align:1.5px; font-variant-numeric:tabular-nums;}
.wd{border-bottom:2px solid var(--accent-line); font-weight:600;}

/* word blank */
.blank{display:inline-flex; align-items:center; flex-wrap:wrap; gap:3px; padding:2px 3px 2px 4px; margin:1px 2px;
  max-width:100%; border:1px dashed var(--accent-line); background:var(--accent-soft); border-radius:10px; vertical-align:middle;
  transition:background .2s, border-color .2s;}
.blank .bn{font-size:9px; font-weight:800; color:#93a0bb; line-height:1; padding-right:1px; font-variant-numeric:tabular-nums; align-self:flex-start; margin-top:4px;}
.opt{min-height:36px; min-width:44px; padding:5px 10px; border:1px solid var(--accent-line); background:#fff; color:var(--ink);
  font-size:15px; font-weight:750; border-radius:8px; line-height:1.15; letter-spacing:.1px;
  transition:transform .07s, background .18s, color .18s, border-color .18s, box-shadow .18s;}
.opt:active{transform:scale(.95);}
.blank.ok{background:var(--ok-bg); border:1px solid var(--ok-line);}
.blank.ok .opt{opacity:.5;}
.blank.ok .opt.correct{opacity:1; background:var(--ok); border-color:var(--ok); color:#fff;}
.blank.no{background:var(--no-bg); border:1px solid var(--no-line);}
.blank.no .opt{opacity:.55; color:#8d94a1;}
.blank.no .opt.wrong{opacity:1; background:var(--no); border-color:var(--no); color:#fff; text-decoration:line-through;}
.blank.no .opt.correct{opacity:1; background:#fff; border:1.5px solid var(--ok); color:var(--ok); font-weight:800;}
body.reveal .blank{border-style:solid; border-color:var(--ok-line); background:var(--ok-bg);}
body.reveal .blank .opt{opacity:.45;}
body.reveal .blank .opt.correct{opacity:1; background:#fff; border:1.5px solid var(--ok); color:var(--ok);}

/* questions */
.qwrap{border-top:1px solid #f0f2f6; padding:11px 13px 12px; background:#fcfdff;}
.q{margin:0 0 11px;}
.q:last-child{margin-bottom:0;}
.qh{display:flex; gap:6px; align-items:flex-start; margin-bottom:7px;}
.tag{flex:0 0 auto; font-size:10px; font-weight:800; color:var(--accent); background:var(--accent-soft);
  border-radius:5px; padding:2px 6px; margin-top:2px; white-space:nowrap;}
.qq{flex:1 1 auto; font-size:13px; font-weight:750; color:#2a3346; line-height:1.5; letter-spacing:-.15px;}
.opts{display:flex; flex-direction:column; gap:5px;}
.mc{display:flex; gap:7px; align-items:flex-start; text-align:left; width:100%;
  border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px;
  padding:8px 10px; font-size:13.4px; line-height:1.5; font-weight:600;
  transition:transform .07s, background .15s, border-color .15s, color .15s;}
.mc:active{transform:scale(.99);}
.mc .mcn{flex:0 0 auto; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums; min-width:14px;}
.mc .mct{flex:1 1 auto;}
.mc.correct{background:var(--ok); border-color:var(--ok); color:#fff;}
.mc.correct .mcn{color:#fff;}
.mc.correct .mct{text-decoration:none;}
.mc.wrong{background:var(--no); border-color:var(--no); color:#fff;}
.mc.wrong .mcn{color:#fff;}
.mc.dim{opacity:.55;}
.qexp{display:none; margin-top:8px; font-size:12.2px; line-height:1.6; color:#3d4759;
  background:#fff; border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:8px; padding:8px 10px;}
.qexp.show{display:block;}
.qexp b{color:var(--ok);}
.qexp.bad{border-left-color:var(--no);}
.qexp.bad b{color:var(--no);}

/* word explanations */
.exp-wrap{border-top:1px solid #f0f2f6; padding:8px 13px 12px; background:#fcfdff;}
.exp-btn{border:1px solid var(--line); background:#fff; color:var(--sub); font-size:11px; font-weight:800;
  padding:5px 10px; border-radius:999px;}
.exp-btn.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
.exps{list-style:none; margin:8px 0 0; padding:0; display:none;}
.exps.open{display:block;}
.exp-line{display:none; align-items:flex-start; gap:6px; flex-wrap:wrap; font-size:12.4px; line-height:1.55;
  padding:5px 0; border-bottom:1px dashed #eef0f5; color:#3a4252;}
.exp-line:last-child{border-bottom:0;}
.exp-line.show{display:flex;}
.exp-line .en{flex:0 0 auto; width:16px; height:16px; border-radius:5px; background:#eef1f7; color:var(--sub);
  font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; margin-top:2px;}
.exp-line.okc .en{background:var(--ok-bg); color:var(--ok);}
.exp-line.nox .en{background:var(--no-bg); color:var(--no);}
.exp-line .ans{flex:0 0 auto; font-size:12.4px; font-weight:800; color:var(--ok);}
.exp-line .why{flex:1 1 100%; color:#4a5364; font-size:12px;}

/* misc */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(14px);
  background:rgba(27,34,48,.94); color:#fff; font-size:12.5px; font-weight:700; padding:9px 15px; border-radius:999px;
  opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; z-index:90; max-width:88vw; text-align:center;}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
.foot{text-align:center; font-size:11.5px; color:var(--sub); line-height:1.7; padding:8px 6px 0;}
.foot b{color:var(--ink);}
.foot .reset2{margin-top:10px; border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:11.5px; font-weight:800; padding:7px 13px; border-radius:999px;}
.empty{text-align:center; color:var(--sub); font-size:13px; font-weight:700; padding:40px 10px; line-height:1.8;}
@media (max-width:430px){
  .body{font-size:15px; line-height:1.9;}
  .opt{min-height:36px; padding:5px 9px; font-size:14.5px; min-width:42px;}
  .ttl{font-size:12.4px;}
  .hd-title{font-size:13.5px;}
  .stat{font-size:10.4px;}
  .mc{font-size:13px;}
  .qq{font-size:12.6px;}
}
</style>
</head>
<body>
<header class="hd" id="hd">
  <div class="hd-top">
    <div class="hd-title">영어 II 통합 퀴즈 <em>2학기 2차</em></div>

</header>

  <div id="list"></div>

</main>

 the employee in a negative way. [[N5]] Precautions need to be taken regarding organizational exclusion, which is very important for business."], "tokens": {"W1": {"type": "w", "a": "precautions", "b": "opportunities", "ok": 0, "ka": "예방 조치", "kb": "기회", "exp": "뒤 문장의 ‘Precautions need to be taken’과 짝을 이루는 단어."}, "W2": {"type": "w", "a": "competition", "b": "belonging", "ok": 1, "ka": "경쟁", "kb": "소속감", "exp": "‘자기 존중(self-respect)’과 나란히 긍정적 사회적 행동이 만들어 내는 것은 ‘소속감’."}, "W3": {"type": "w", "a": "contribution", "b": "opposition", "ok": 0, "ka": "기여", "kb": "반대", "exp": "소통·사회활동에서 멀어진 사람의 조직에 대한 ‘기여’가 줄어든다는 문맥."}, "N1": {"type": "n", "plain": " "}, "N2": {"type": "n", "plain": " "}, "N3": {"type": "n", "plain": " "}, "N4": {"type": "n", "plain": " "}, "N5": {"type": "n", "plain": " "}, "B1": {"type": "b", "plain": "strengthen their basic needs, which are threatened", "opts": ["strengthen their basic needs, which are threatened", "ignore the organization completely", "leave the organization immediately", "punish the people around them", "ask for higher wages"], "ok": 0, "exp": "배제된 개인은 위협받는 기본 욕구를 '강화하려' 반응한다."}}, "mc": [{"tag": "문장 삽입", "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "opts": ["①", "②", "③", "④", "⑤"], "ok": 2, "exp": "앞 문장이 ‘적응하려는 사람은 배제될 가능성이 낮아진다’고 한 뒤, ‘However’로 반전해 ‘적응하지 못하면 더 많은 배제를 직면한다’고 붙는다. → ③."}]}, {"id": "s40", "num": "40", "title": "선행이 낳는 선행", "src": "9월 모평 40번", "kind": "plain", "paras": ["Our adult brains retain a [[W3]] for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly [[B]] in the future. In one [[W1]] study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they'd made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who'd taken pains to describe not only how they'd been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less [[W2]] than those who cared more about doing good for its own sake."], "tokens": {"W1": {"type": "w", "a": "paid", "b": "unpaid", "ok": 0, "ka": "사례를 받는", "kb": "무보수의", "exp": "실험 참가자가 번 돈을 기부했다는 뒤문장으로 보아 사례가 지급된 실험."}, "W2": {"type": "w", "a": "generous", "b": "reluctant", "ok": 0, "ka": "관대한", "kb": "꾸리는", "exp": "‘선을 그 자체를 위해 행하는 사람’보다 ‘겹모습을 의식하는 사람’이 더 ‘관대하지 않다(기부도 적다)’."}, "W3": {"type": "w", "a": "dislike", "b": "preference", "ok": 1, "ka": "혐오", "kb": "선호", "exp": "성인의 뇌는 선하고 공정한 행동을 계속 이어가려는 ‘선호’를 지닌다."}, "B": {"type": "b", "plain": "motivates us to do greater good", "ok": 2, "opts": ["makes us doubt our past actions", "leads us to expect rewards for kindness", "motivates us to do greater good", "turns us into passive observers of others", "weakens our sense of fairness"], "exp": "자신을 선한 사람으로 인식하고 그에 맞게 행동하는 것이 미래에 더 큰 선을 행하도록 동기부여한다."}}, "mc": [{"tag": "요약문", "q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "opts": ["① evident … conscious", "② lacking … observant", "③ noticeable … ignorant", "④ suspended … tolerant", "⑤ activated … forgetful"], "ok": 0, "exp": "과거의 미덕을 떠올린 사람은 동기가 더 ‘분명하게(evident)’ 드러났고, 겹모습을 의식하는 사람은 더 덜 관대했다. → evident / conscious."}]}]}, {"cat": "oct", "label": "10모", "icon": "📗", "desc": "2026 10월 모평 · 33~40번", "items": [{"id": "o33", "num": "33", "title": "가소성(plasticity)과 평생 발달", "src": "10월 모평 33번", "kind": "plain", "paras": ["Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of [[W1]]. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely [[W2]] recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of [[W3]]. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life [[B]]."], "tokens": {"W1": {"type": "w", "a": "plasticity", "b": "rigidity", "ok": 0, "ka": "가소성, 변화 가능성", "kb": "경직성", "exp": "뒤 문장이 'change, adapt, and reorganize'로 정의하므로 '가소성'."}, "W2": {"type": "w", "a": "active", "b": "passive", "ok": 1, "ka": "능동적인", "kb": "수동적인", "exp": "'not merely ___ ... but active agents'의 대조 구조 — 앞은 '수동적인'."}, "W3": {"type": "w", "a": "growth", "b": "decline", "ok": 1, "ka": "성장", "kb": "쇠퇴", "exp": "예전 관점: 아동기 발달 → 성인기 안정 → 노년기 '쇠퇴'. 글은 이 관점을 반박한다."}, "B": {"type": "b", "plain": "allows room for adaptation and transformation", "ok": 1, "opts": ["is independent of the previous change", "allows room for adaptation and transformation", "leads to less variation in human development", "requires stability for meaningful growth to occur", "has its own limit in adjusting to new experiences"], "exp": "양보절(변화의 정도는 다를 수 있다) 뒤에 오는 주절이므로 '그래도 모든 단계에 적응·변화의 여지가 있다'가 자연스럽다."}}, "mc": [{"tag": "주제", "q": "다음 글의 주제로 가장 적절한 것은?", "opts": ["노년기의 신체적 쇠퇴를 늦추는 방법", "인간 발달은 전 생애에 걸쳐 변화·적응하는 유연한 과정이라는 관점", "아동기 교육이 평생 발달에 미치는 결정적 영향", "환경보다 유전이 발달에 더 큰 영향을 준다는 주장", "발달 단계별 검사 도구의 필요성"], "ok": 1, "exp": "가소성 개념을 통해 발달이 고정된 단계가 아니라 평생 이어지는 유연한 과정임을 강조한다."}]}, {"id": "o34", "num": "34", "title": "상호의존이 만드는 복잡한 실패", "src": "10월 모평 34번", "kind": "plain", "paras": ["Social media has altered business, politics, and friendships, making going viral a household term. The global financial industry links every bank and countless households in every country, making us [[W1]] to human error taking place on the other side of the world. As Columbia University strategy professor Rita McGrath explains, years ago most of our institutions were separate and thereby [[W2]] from the effects of errors outside their walls. That is no longer the case. The digitization of massive amounts of information has continued to grow enormously as the cost of computing power has decreased. The development of smart systems that communicate autonomously gave rise to an infinite variety of potential breakdowns. This interdependence is a [[W3]] for complex failure. As Rita puts it, when “things that used to be kept separate bump up against each other, it becomes far more difficult to predict what's going to happen next.” Information technology creates new vulnerabilities because [[B]]."], "tokens": {"W1": {"type": "w", "a": "vulnerable", "b": "immune", "ok": 0, "ka": "취약한", "kb": "면역이 있는", "exp": "지구 반대편의 인적 오류에도 영향을 받는다 → '취약한'."}, "W2": {"type": "w", "a": "buffered", "b": "exposed", "ok": 0, "ka": "완충된, 보호받는", "kb": "노출된", "exp": "과거에는 기관들이 분리되어 외부 오류의 영향에서 '보호받았다'."}, "W3": {"type": "w", "a": "breeding ground", "b": "safeguard", "ok": 0, "ka": "온상", "kb": "보호 장치", "exp": "상호의존은 복잡한 실패가 생겨나는 '온상'이라는 부정적 논지."}, "B": {"type": "b", "plain": "interconnectedness instantly spreads the impact of small failures", "ok": 0, "opts": ["interconnectedness instantly spreads the impact of small failures", "complex issues involving smart systems are oversimplified", "vast amounts of online information destroy social hierarchy", "digitization widens the information gap between institutions", "digital networks fall like dominoes due to increasing computing costs"], "exp": "연결된 시스템에서는 작은 오류의 영향이 즉시 번진다. ‘due to increasing computing costs’라고 한 선택지는 computing costs has decreased와 반대 내용이라 오답."}}, "mc": [{"tag": "제목", "q": "다음 글의 제목으로 가장 적절한 것은?", "opts": ["The Hidden Costs of Social Media Addiction", "How Smart Systems Replace Human Workers", "Interdependence: How Small Failures Turn into Big Ones", "The Rising Price of Computing Power", "Why Institutions Should Stay Separate"], "ok": 2, "exp": "기관들이 서로 연결되면서 작은 오류가 예측 불가능하게 확산된다는 것이 핵심."}]}, {"id": "o35", "num": "35", "title": "의학의 발전과 감염병", "src": "10월 모평 35번", "kind": "irrelevant", "paras": ["Scientific developments and technologies in medical practice have brought us enormous progress in the treatment and prevention of infectious diseases. [[N1]]The discovery of penicillin in 1928 by Alexander Fleming, for which he later received the Nobel Prize, was one of the biggest [[W1]] in the battle against infectious diseases. [[N2]]Edward Jenner discovered around 1796 that humans were protected against the deadly smallpox virus after exposure to the cowpox virus, which is harmless to humans. [[N3]]A human's average life expectancy has increased, but relying too much on medicine damages our body system. [[N4]]Vaccines developed in laboratories have contributed enormously to [[B1]] and have even led to the [[W2]] of poxvirus. [[N5]]For other infectious diseases (for example cholera and malaria), control and hygiene management measures have reduced their burden, while for others treatment therapies turned viral diseases that were deadly into [[W3]] manageable diseases."], "tokens": {"W1": {"type": "w", "a": "breakthroughs", "b": "setbacks", "ok": 0, "ka": "획기적 발전", "kb": "차질, 퇴보", "exp": "펠리실린 발견은 감염병과의 싸움에서 가장 큰 '돌파구'였다."}, "W2": {"type": "w", "a": "spread", "b": "elimination", "ok": 1, "ka": "확산", "kb": "박멸", "exp": "백신이 폭스바이러스의 '박멸'까지 이끌었다고 했으므로 긍정적 방향의 단어."}, "W3": {"type": "w", "a": "chronic", "b": "fatal", "ok": 0, "ka": "만성의", "kb": "치명적인", "exp": "'deadly → ___ manageable'로 죽음의 병이 '관리 가능한 만성질환'으로 바뀌었다는 대조."}, "N1": {"type": "n", "plain": "The"}, "N2": {"type": "n", "plain": "Edward"}, "N3": {"type": "n", "plain": "A"}, "N4": {"type": "n", "plain": "Vaccines"}, "N5": {"type": "n", "plain": "For other"}, "B1": {"type": "b", "plain": "the reduction of the burden of bacterial and viral diseases", "opts": ["wiped out every infectious disease on Earth", "made vaccines unnecessary for most people", "increased the burden of bacterial diseases", "replaced hygiene management measures entirely", "the reduction of the burden of bacterial and viral diseases"], "ok": 4, "exp": "치료법이 치명적인 바이러스 질환을 '관리 가능한 만성질환'으로 바꾸었다."}}, "mc": [{"tag": "무관한 문장", "q": "다음 글에서 전체 흐름과 관계 없는 문장은?", "opts": ["① The discovery of penicillin in 1928 by Alexander Fleming, for which he later received the Nobel Prize, was one of the biggest breakthroughs in the battle against infectious diseases.", "② Edward Jenner discovered around 1796 that humans were protected against the deadly smallpox virus after exposure to the cowpox virus, which is harmless to humans.", "③ A human's average life expectancy has increased, but relying too much on medicine damages our body system.", "④ Vaccines developed in laboratories have contributed enormously to the reduction of the burden of bacterial and viral diseases and have even led to the elimination of poxvirus.", "⑤ For other infectious diseases (for example cholera and malaria), control and hygiene management measures have reduced their burden, while for others treatment therapies turned viral diseases that were deadly into chronic manageable diseases."], "ok": 2, "exp": "글의 주제는 '의학 발전이 감염병 치료·예방에 가져온 진보'. ③은 약에 대한 의존의 해로움으로 방향이 달라 무관하다."}]}, {"id": "o36", "num": "36", "title": "우리는 사용자가 아니다", "src": "10월 모평 36번", "kind": "order", "given": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "blocks": {"A": "This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through [[W3]] revisions based on the findings from representative users.", "B": "An incredibly effective way is with usability testing. The goal of this method is to [[W2]] problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "C": "We're much too close to what we build to [[W1]] see it and understand how users will interact with it. The best user interfaces are those that have been [[B1]]. So how can designers shape their work to be more effective?"}, "order": ["C", "B", "A"], "tokens": {"W1": {"type": "w", "a": "objectively", "b": "subjectively", "ok": 0, "ka": "객관적으로", "kb": "주관적으로", "exp": "우리는 만든 것에 너무 가까워 '객관적으로' 보기 어렵다는 논지."}, "W2": {"type": "w", "a": "conceal", "b": "uncover", "ok": 1, "ka": "감추다", "kb": "찾아내다", "exp": "사용성 테스트의 목표는 디자인의 문제를 '찾아내는' 것."}, "W3": {"type": "w", "a": "previous", "b": "subsequent", "ok": 1, "ka": "이전의", "kb": "그 뒤의", "exp": "발견된 결과를 바탕으로 '그 뒤에 이어지는' 수정을 한다."}, "B1": {"type": "b", "plain": "shaped by observations of real users and their interactions with them", "opts": ["designed only by experts in the laboratory", "copied from the most popular competitor", "created as quickly as possible", "shaped by observations of real users and their interactions with them", "kept simple by removing all features"], "ok": 3, "exp": "최고의 인터페이스는 '실제 사용자 관찰'로 다듬어진 것이라는 논지."}}, "mc": [{"tag": "글의 순서", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ok": 4, "exp": "(C)의 의문문 'how can designers shape their work more effective?'에 (B)의 'An incredibly effective way is...'가 답하고, (A)의 'This technique'이 사용성 테스트를 받는다. → (C)-(B)-(A)."}]}, {"id": "o37", "num": "37", "title": "재평가(reappraisal)와 회복 탄력성", "src": "10월 모평 37번", "kind": "order", "given": "Reappraisal —changing the way one thinks about emotional situations—might present a particularly effective avenue to regulating emotions because it transforms emotions at their [[W1]].", "blocks": {"A": "This example illustrates how reappraisal might powerfully transform short-term emotional responses. When repeated over time, these short-term emotional consequences of reappraisal might [[B1]]. Thereby, reappraisal might be a key to resilience.", "B": "Take, for example, someone who is going through a divorce. This is often an [[W3]] event, and yet, it can be construed in different ways. One might view it as an overpowering loss that will mark one's family for life. Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "C": "As a result of these different construals, one might feel different emotions. The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels. Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude."}, "order": ["B", "C", "A"], "tokens": {"W1": {"type": "w", "a": "root", "b": "surface", "ok": 0, "ka": "뿌리", "kb": "표면", "exp": "재평가는 감정을 '뿌리'에서 바꾸기 때문에 효과적이라는 설명."}, "W2": {"type": "w", "a": "predict", "b": "construe", "ok": 1, "ka": "예측하다", "kb": "해석하다", "exp": "같은 사건을 다르게 '해석'할 수 있고, 그 해석이 감정을 낳는다."}, "W3": {"type": "w", "a": "favorable", "b": "adverse", "ok": 1, "ka": "유리한", "kb": "불리한, 부정적인", "exp": "이혼은 보통 '부정적인' 사건이지만 다르게 해석될 수 있다는 흐름."}, "B1": {"type": "b", "plain": "accumulate to shape people's psychological health", "opts": ["disappear without leaving any trace", "reverse the effects of the original emotion", "accumulate to shape people's psychological health", "create stronger negative emotions over time", "have no connection to resilience"], "ok": 2, "exp": "재평가의 단기적 정서 효과가 쌓여 '심리적 건강을 형성'한다."}}, "mc": [{"tag": "글의 순서", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ok": 2, "exp": "(B)의 'Take, for example'이 사례를 들고, (C)의 'these different construals'가 (B)의 두 해석을 받 ale Orchard Oriole [[W2]] weaves grasses to form the hanging nest. Constructing an oriole nest would be [[W3]] for any human."}, "order": ["B", "C", "A"], "tokens": {"W1": {"type": "w", "a": "innate", "b": "learned", "ok": 0, "ka": "타고난", "kb": "배운", "exp": "둥지 짓기의 세부는 대부분 '선천적'이지만 조립에는 사고와 기술이 필요하다는 대조."}, "W2": {"type": "w", "a": "intricately", "b": "loosely", "ok": 0, "ka": "정교하게", "kb": "헐겁게", "exp": "오리올 새의 둥지는 풀을 '정교하게' 엮어 만든다."}, "W3": {"type": "w", "a": "challenging", "b": "effortless", "ok": 0, "ka": "힘든", "kb": "손쉬운", "exp": "그 둥지를 만드는 일은 인간에게도 '힘든' 일이라는 평가."}, "B": {"type": "b", "plain": "searching", "opts": ["strength", "instinct", "luck", "searching", "eyesight"], "ok": 3, "exp": "재료를 찾아 모으는 일에는 '찾고 기억하는' 인지 행동이 필요하다."}}, "mc": [{"tag": "글의 순서", "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ok": 2, "exp": "주어진 글의 '17종'을 (B)의 'This ... is but a small percentage'가 받고, (C)의 'But consider bird nests'가 새 화제를 열며, (A)가 둥지 짓기의 인지적 요구로 마무리한다. → (B)-(C)-(A)."}]}, {"id": "k0804", "num": "8-4", "title": "아이들의 몰입과 플로우(flow)", "src": "08강 Exercise 04 · 글의 순서", "kind": "order", "given": "Children come by their excitement naturally. Until it gets [[W1]] out of them in school, kids innately know how to have fun and love what they do.", "blocks": {"A": "But as Csikszentmihalyi noted, “Most enjoyable activities are not natural; they demand an effort that initially one is reluctant to make.” Some activities will only [[W2]] us if we take the trouble to pay close attention to them.", "B": "Simply put, flow is when your concentration is such that you lose all sense of time and place. The experience is its own [[B]]; its end goal or outcome is just the icing on the cake. The satisfactions that go with creating an inspired work of art or flawlessly executing an athletic feat are easy enough to imagine.", "C": "Give them a wooden stick and watch as they begin to play with it. Wai econds. In the case of all [[N4]]unfamiliar words, recognition and meaning are registered [[W2]]. Any words not read before will take slightly longer to decipher but are usually identified from their pronounceable spelling patterns or by [[W3]] them letter by letter. All words that are encountered frequently enough become stored in memory as “sight words” and no longer need to be [[N5]]decoded."], "tokens": {"W1": {"type": "w", "a": "hesitant", "b": "fluent", "ok": 1, "ka": "머뭇거리는", "kb": "유창한", "exp": "단어 인식이 '유창하고 빠른' 독자가 되는 것이 목표."}, "W2": {"type": "w", "a": "separately", "b": "simultaneously", "ok": 1, "ka": "따로", "kb": "동시에", "exp": "익숙한 단어는 인식과 의미가 '동시에' 등록된다."}, "W3": {"type": "w", "a": "memorizing", "b": "decoding", "ok": 1, "ka": "암기하기", "kb": "해독하기", "exp": "글자를 하나씩 '해독'해 단어를 알아낸다."}, "N1": {"type": "n", "plain": "relevant"}, "N2": {"type": "n", "plain": "instantly"}, "N3": {"type": "n", "plain": "known"}, "N4": {"type": "n", "plain": "unfamiliar"}, "N5": {"type": "n", "plain": "decoded"}, "B1": {"type": "b", "plain": "most printed words can be identified very swiftly by the skilled reader", "opts": ["meaning is recognized only after a long delay", "each letter must be sounded out one by one", "readers always skip unfamiliar words", "sight words are never stored in memory", "most printed words can be identified very swiftly by the skilled reader"], "ok": 4, "exp": "익숙한 단어는 인식과 의미가 '동시에' 처리된다."}}, "mc": [{"tag": "어휘", "q": "밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "opts": ["① relevant", "② instantly", "③ known", "④ unfamiliar", "⑤ decoded"], "ok": 3, "exp": "④는 'unfamiliar(익숙하지 않은)'가 아니라 'familiar(익숙한)'이어야 한다. 익숙한 단어일수록 인식과 의미가 동시에 처리된다."}]}, {"id": "k0903", "num": "9-3", "title": "강경책과 연성책(soft measures)", "src": "09강 Exercise 03 · 문장 삽입", "kind": "insert", "given": "But there are whole areas of human behavior where standard policies are particularly ill-suited.", "paras": ["To achieve behavior change, the government could well choose “hard” measures such as r ion of health as “a state of optimal physical, mental, and social well-being, and not merely the absence of disease and infirmity.” This opens up the question of what “health” is in old age. Some [[W1]] have focused on health as the ability to function independently, while others emphasize social participation and a sense of purpose. Professionals, however, do not necessarily view old age in overly [[W2]] terms: many describe aging as a process of adaptation rather than simple decline. Still, there is a growing shift toward [[W3]] definitions of health that [[B1]]. Older people have been shown to focus more on supportive social environments, their ability to use resources and manage restrictions, and connectedness with others."], "tokens": {"W1": {"type": "w", "a": "rejections", "b": "definitions", "ok": 1, "ka": "거부", "kb": "정의", "exp": "건강을 어떻게 '정의'하는지에 대한 여러 접근."}, "W2": {"type": "w", "a": "positive", "b": "negative", "ok": 1, "ka": "긍정적인", "kb": "부정적인", "exp": "전문가들은 노년을 지나치게 '부정적으로'만 보지 않는다."}, "W3": {"type": "w", "a": "narrow", "b": "broad", "ok": 1, "ka": "좁은", "kb": "폭넓은", "exp": "활동·관계·대처 능력까지 포함하는 '폭넓은' 정의로의 전환."}, "B1": {"type": "b", "plain": "include meaningful activity, relationships, and the capacity to cope with change", "opts": ["focus only on the absence of disease", "include meaningful activity, relationships, and the capacity to cope with change", "reject any role for social participation", "require complete independence from others", "measure health only by physical tests"], "ok": 1, "exp": "건강의 폭넓은 정의는 활동·관계·변화 대처 능력까지 포함한다."}}, "mc": [{"tag": "요약문", "q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "opts": ["① ethical … rapid", "② creative … rapid", "③ negative … broad", "④ executive … narrow", "⑤ economic … stable"], "ok": 2, "exp": "전문가들은 노년을 부정적으로만 보지 않지만, 건강 개념은 활동·관계까지 포함하는 폭넓은 정의로 확장되고 있다. → negative / broad."}]}, {"id": "k1001", "num": "10-1", "title": "보너스와 업무 내용의 부차화", "src": "10강 Exercise 01 · 어휘", "kind": "vocab", "paras": ["Fooling ourselves is often the easiest thing to do. A classic example comes from the world of work. Professionals are notably good at focusing on the [[W1]] parts of a job. In their [[W2]] of a bonus, workers concentrate on the criteria that will be counted and rewarded. [[N1]]All that matters is to reach the criteria in order to get the bonus promised. [[N2]]The content of work becomes [[N3]]primary. [[N4]]In the same way, students who study only for grades lose interest in what they are learning. [[N5]]What began as a [[W3]] [[B1]]."], "tokens": {"W1": {"type": "w", "a": "measurable", "b": "invisible", "ok": 0, "ka": "측정 가능한", "kb": "보이지 않는", "exp": "직장인은 업무에서 '측정 가능한' 부분에 집중한다."}, "W2": {"type": "w", "a": "pursuit", "b": "avoidance", "ok": 0, "ka": "추구", "kb": "회피", "exp": "'보너스를 추구하면서'라는 문맥."}, "W3": {"type": "w", "a": "means", "b": "end", "ok": 0, "ka": "수단", "kb": "목적", "exp": "본래 '수단'이던 것이 그 자체로 목적이 된다."}, "N1": {"type": "n", "plain": "All"}, "N2": {"type": "n", "plain": "The"}, "N3": {"type": "n", "plain": "primary"}, "N4": {"type": "n", "plain": "In"}, "N5": {"type": "n", "plain": "What"}, "B1": {"type": "b", "plain": "becomes an end in itself", "opts": ["loses all its meaning", "turns into a source of leisure", "is replaced by a new goal", "becomes an end in itself", "brings no reward at all"], "ok": 3, "exp": "수단이던 것이 그 자체로 '목적'이 된다."}}, "mc": [{"tag": "어휘", "q": "밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "opts": ["① measurable", "② pursuit", "③ primary", "④ In the same way", "⑤ means"], "ok": 2, "exp": "③은 'primary(주된)'가 아니라 'secondary(부차적인)'이어야 한다. 보너스를 좇는 순간 일의 내용은 부차적으로 밀려난다."}]}, {"id": "k1003", "num": "10-3", "title": "심리학은 언제나 개인을 설명했나", "src": "10강 Exercise 03 · 문장 삽입", "kind": "insert", "given": "The prevailing explanation of human action was that people were “pushed” by their internal drives or “pulled” by external events.", "paras": ["The science of psychology has not always cared about individual styles of thinking, or about individual huma and the construction of urban areas and other infrastructure, including the removal of mangroves and other wetland systems, [[N5]]altering areas key to reproduction for many species."], "tokens": {"W1": {"type": "w", "a": "transforming", "b": "preserving", "ok": 0, "ka": "변형시키다", "kb": "보존하다", "exp": "인간이 생물권을 '변형'시키기 시작했다."}, "W2": {"type": "w", "a": "conservation", "b": "harvest", "ok": 1, "ka": "보전", "kb": "수확, 어획", "exp": "해산물 수요가 야생종에 강한 '어획' 압력을 준다."}, "W3": {"type": "w", "a": "variety", "b": "intensity", "ok": 1, "ka": "다양성", "kb": "강도", "exp": "1950년 이후 어업이 규모와 '강도'에서 커졌다."}, "N1": {"type": "n", "plain": "extinctions"}, "N2": {"type": "n", "plain": "primary"}, "N3": {"type": "n", "plain": "similar"}, "N4": {"type": "n", "plain": "insufficient"}, "N5": {"type": "n", "plain": "altering"}, "B1": {"type": "b", "plain": "hunting and foraging pressures on terrestrial, freshwater, and marine species caused local populations to decline", "opts": ["hunting pressures disappeared completely", "terrestrial species began to increase rapidly", "agriculture had no effect on wildlife", "hunting and foraging pressures on terrestrial, freshwater, and marine species caused local populations to decline", "marine species were unaffected by humans"], "ok": 3, "exp": "농업 확산과 함께 '서식지 손실'이 개체 감소·멸종의 주된 원인이 되었다."}}, "mc": [{"tag": "제목", "q": "윗글의 제목으로 가장 적절한 것은?", "opts": ["① How Early Humans Began Reshaping Earth's Species", "② Saving Marine Species from Modern-Day Overfishing", "③ Population Growth and Urbanization: Threats to Earth's Environment", "④ Vanishing Wildlife: How Habitat Loss Drives Modern Species Extinction", "⑤ From Hunting to Fishing: Human Impacts on Earth's Species Over Time"], "ok": 4, "exp": "선사시대 사냥·채집에서 산업적 어업까지, 시대에 따라 인간이 종에 가한 압력이 어떻게 바뀌었는지를 다룬다."}, {"tag": "어휘", "q": "밑줄 친 (a)~(e) 중 문맥상 낱말의 쓰임이 적절하지 않은 것은? (본문 ①~⑤ 표시)", "opts": ["(a) extinctions", "(b) primary", "(c) similar", "(d) insufficient", "(e) altering"], "ok": 2, "exp": "(c)는 'similar'가 아니라 'different'여야 한다. 수생종은 전통적 사냥·채집 압력이 대규모 감소를 일으키지 못했고, 산업적 어업 이후에 상황이 달라졌다."}]}, {"id": "m2q4", "num": "MT2-4", "title": "산업 자본주의는 스스로를 먹는다", "src": "Mini Test 2 · 04번", "kind": "plain", "paras": ["Free markets have undoubtedly delivered substantial benefits. Not only is there a logical link between capitalism and liberty, but the discipline given by the price mechanism filters out inefficient businesses and drives [[W1]]. Industrial capitalism has generated a cornucopia of material wealth unimaginable to previous generations, and its essentially [[W2]] character most closely mirrors the vast emergent system that is the globalised world. As observed by Vaclav Havel, the Czech Republic's first president following liberation from Soviet shackles, capitalism is “the only natural economy, the only kind that makes sense, the only one that can lead to [[W3]], because it is the only one that reflects the nature of life itself.” But although the free market system now seems more natural than nature, ironically it [[B1]] — our biggest source of wealth, crucial to all human life and flourishing — and in consequence, industrial capitalism is eating itself from within."], "tokens": {"W1": {"type": "w", "a": "stagnation", "b": "innovation", "ok": 1, "ka": "정체", "kb": "혁신", "exp": "가격 기제가 비효율 기업을 걸러내고 '혁신'을 이끈다."}, "W2": {"type": "w", "a": "decentralised", "b": "centralised", "ok": 0, "ka": "분권적인", "kb": "중앙집권적인", "exp": "산업 자본주의의 '분권적' 성격이 세계화된 세계와 닮았다."}, "W3": {"type": "w", "a": "prosperity", "b": "poverty", "ok": 0, "ka": "번영", "kb": "빈곤", "exp": "자본주의만이 '번영'으로 이끌 수 있다는 하벨의 말."}, "B1": {"type": "b", "plain": "fails to value and maintain natural capital", "opts": ["fails to value and maintain natural capital", "protects natural resources more than ever", "rejects the price mechanism entirely", "depends on central planning", "distributes wealth equally"], "ok": 0, "exp": "자본주의가 '자연 자본'을 평가·유지하지 못해 스스로를 먹는다."}}, "mc": [{"tag": "함의 추론", "q": "밑줄 친 eating itself from within이 다음 글에서 의미하는 ervices for the poor. When we plan for our future, it looks as if we often treat our future self not as a later instance of “me,” but as a stranger."], "tokens": {"W1": {"type": "w", "a": "condemned", "b": "justified", "ok": 1, "ka": "비난받는", "kb": "정당화될 수 있는", "exp": "공감에 기반한 사회 정책의 경로는 '정당화될 수 있다'."}, "W2": {"type": "w", "a": "flawed", "b": "reliable", "ok": 0, "ka": "결함 있는", "kb": "믿을 만한", "exp": "'체계적으로 결함 있는' 추론 패턴이 편향."}, "W3": {"type": "w", "a": "overspend", "b": "undersave", "ok": 1, "ka": "과소비하다", "kb": "덜 저축하다", "exp": "미래를 낯선 사람처럼 여겨 '저축을 덜 한다'."}, "N1": {"type": "n", "plain": "justified"}, "N2": {"type": "n", "plain": "poor"}, "N3": {"type": "n", "plain": "discount"}, "N4": {"type": "n", "plain": "exotic"}, "N5": {"type": "n", "plain": "pessimistic"}, "B1": {"type": "b", "plain": "Individuals suffer a collection of biases in judgment", "opts": ["we care too much about our future health", "we save more than we need for retirement", "Individuals suffer a collection of biases in judgment", "we always plan carefully for old age", "we see our future self as our closest friend"], "ok": 2, "exp": "미래의 자신을 '낯선 사람'처럼 대하는 것이 편향의 핵심."}}, "mc": [{"tag": "제목", "q": "윗글의 제목으로 가장 적절한 것은?", "opts": ["① Everyday Biases: How They Affect Our Relationships at Work", "② We Need More Social Welfare for People Who Don't Plan Ahead", "③ The Slippery Slope of Social Policy: Why Empathy Can Be Dangerous", "④ The Future Self Is Not a Stranger: Rethinking How We Plan and Care", "⑤ Lack of Financial Literacy Leaving Retirees Vulnerable to Bad Decisions"], "ok": 3, "exp": "사람들이 미래의 자신을 낯선 사람처럼 대하는 편향을 다루며, 계획과 돌봄을 다시 생각하자는 글."}, {"tag": "어휘", "q": "밑줄 친 (a)~(e) 중 문맥상 낱말의 쓰임이 적절하지 않은 것은? (본문 ①~⑤ 표시)", "opts": ["(a) justified", "(b) poor", "(c) discount", "(d) exotic", "(e) pessimistic"], "ok": 4, "exp": "(e)는 'pessimistic'이 아니라 'optimistic'이어야 한다. 글은 우리가 미래의 건강에 대해 '지나치게 낙관적'인 편향을 말한다."}]}, {"id": "m3q4", "num": "MT3-4", "title": "자연의 제동 장치가 인간을 구한다", "src": "Mini Test 3 · 04번", "kind" <script>

  /* index */

      if (it.given) order.unshift(it.given);

        var re = /\[\[([A-Za-z0-9_]+)\]\]/g, m;

  });

  function catOf(c){ for (var i=0;i<DATA.length;i++) if (DATA[i].cat===c) return DATA[i]; return DATA[0]; }

    if (kind==='w') return it.wTok.length;

  function itemsOf(cat, kind){ return cat.items.filter(function(it){ return itemCount(it, kind) > 0; }); }

  function isDone(it, kind){ return itemCount(it, kind) > 0 && itemDone(it, kind) === itemCount(it, kind); }
  function itemDone(it, kind){
    var n = 0;
    if (kind==='w') it.wTok.forEach(function(t){ if (state.answers[keyOf(it,'w',t)] !== undefined) n++; });
    else if (kind==='b') it.bTok.forEach(function(t){ if (state.answers[keyOf(it,'b',t)] !== undefined) n++; });

    return n;

  function isRight(it, kind, sub){

  function tokHTML(it, name, kind){
    var t = it.tokens[name];
    if (!t) return '';
    if (t.type === 'w'){
      if (kind !== 'w') return '<span class="wd">' + t[['a','b'][t.ok]] + '</span>';
      var cls = 'blank', tt = state.answers[keyOf(it,'w',name)];
      var idx = it.wTok.indexOf(name) + 1;
      var html = '<span class="' + cls + '" id="bw_' + it.id + '_' + name + '"><span class="bn">' + idx + '</span>';
      [t.a, t.b].forEach(function(lab, i){
        html += '<button type="button" class="opt' + (i===t.ok?' correct':'') + '" data-item="' + it.id + '" data-kind="w" data-sub="' + name + '" data-i="' + i + '">' + lab + '</button>';
      });
      return html + '</span>';
    }
    if (t.type === 'b'){
      if (kind !== 'b') return t.plain;
      var bi = it.bTok.indexOf(name) + 1;
      return '<span class="blk" id="bb_' + it.id + '_' + name + '" style="border-bottom:2px solid #3563e9;display:inline-block;min-width:120px;font-weight:700;">&nbsp;(' + bi + ')&nbsp;</span>';
    }
    if (t.type === 'n'){
      if (kind === 'm' && (it.kind==='grammar' || it.kind==='irrelevant' || it.kind==='insert' || it.kind==='vocab')){
        return '<span class="mk">' + (it.mkIndex[name] || '') + '</span>';
      }
      return '';
    }
    return '';
  }
  function fill(it, txt, kind){
    return txt.replace(/\[\[([A-Za-z0-9_]+)\]\]/g, function(_, n){ return tokHTML(it, n, kind); });
  }
  function passageHTML(it, kind){
    var out = '';
    if (it.given){
      if (it.kind === 'order' || kind === 'm'){
        out += '<div class="givenbox"><span class="gt">' + (it.kind==='order' ? '주어진 글' : '주어진 문장') + '</span>' + fill(it, it.given, kind) + '</div>';
      }
    }
    if (it.kind === 'order'){
      var seq = (kind === 'm') ? ['A','B','C'] : (it.order || ['A','B','C']);
      seq.forEach(function(b){
        var lbl = (kind === 'm')
          ? '<span class="lbl">(' + b + ')</span>'
          : (it.order && it.order.indexOf(b) === (it.order.length-1) ? '' : '');
        out += '<p>' + lbl + fill(it, it.blocks[b], kind) + '</p>';
      });
    } else {
      (it.paras||[]).forEach(function(p){ out += '<p>' + fill(it, p, kind) + '</p>'; });
    }
    return out;
  }

  /* ---------- render cards ---------- */
  function buildCard(it, kind){
    var art = document.createElement('article');
    art.className = 'card'; art.id = 'c_' + it.id; art.dataset.id = it.id;
    var n = itemCount(it, kind), d = itemDone(it, kind);
    var hd = document.createElement('div'); hd.className = 'card-hd';
    hd.innerHTML = '<span class="num">' + it.num + '</span><div class="ttl">' + it.title
      + '<span class="src">' + it.src + '</span></div><span class="cnt" id="cnt_' + it.id + '">' + d + '/' + n + '</span>';
    art.appendChild(hd);

    var body = document.createElement('div'); body.className = 'body';
    body.innerHTML = passageHTML(it, kind);
    art.appendChild(body);

    var qw = document.createElement('div'); qw.className = 'qwrap';
    if (kind === 'm'){
      (it.mc||[]).forEach(function(q, qi){
        var qd = document.createElement('div'); qd.className = 'q';
        var oh = '<div class="qh"><span class="tag">' + q.tag + '</span><div class="qq">' + q.q + '</div></div><div class="opts">';
        q.opts.forEach(function(o, oi){
          oh += '<button type="button" class="mc" data-item="' + it.id + '" data-kind="m" data-sub="' + qi + '" data-i="' + oi + '">'
             + '<span class="mcn">' + ['①','②','③','④','⑤'][oi] + '</span><span class="mct">' + o + '</span></button>';
        });
        oh += '</div><div class="qexp" id="qe_' + it.id + '_' + qi + '"></div>';
        qd.innerHTML = oh;
        qw.appendChild(qd);
      });
    } else if (kind === 'b'){
      it.bTok.forEach(function(b, bi){
        var t = it.tokens[b];
        var qd = document.createElement('div'); qd.className = 'q';
        var oh = '<div class="qh"><span class="tag">빈칸 (' + (bi+1) + ')</span><div class="qq">' + (it.blankQ || '밑줄 친 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.') + '</div></div><div class="opts">';
        t.opts.forEach(function(o, oi){
          oh += '<button type="button" class="mc" data-item="' + it.id + '" data-kind="b" data-sub="' + b + '" data-i="' + oi + '">'
             + '<span class="mcn">' + ['①','②','③','④','⑤'][oi] + '</span><span class="mct">' + o + '</span></button>';
        });
        oh += '</div><div class="qexp" id="qe_' + it.id + '_' + b + '"></div>';
        qd.innerHTML = oh;
        qw.appendChild(qd);
      });
    } else {
      qw.remove();
    }
    if (kind !== 'w') art.appendChild(qw);

    if (kind === 'w'){
      var ew = document.createElement('div'); ew.className = 'exp-wrap';
      var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'exp-btn';
      btn.textContent = '💡 어휘 뜻·해설';
      var ol = document.createElement('ol'); ol.className = 'exps'; ol.id = 'ex_' + it.id;
      it.wTok.forEach(function(w, wi){
        var t = it.tokens[w];
        var li = document.createElement('li'); li.className = 'exp-line'; li.id = 'el_' + it.id + '_' + w;
        li.innerHTML = '<span class="en">' + (wi+1) + '</span><span class="ans">' + t.a + ' = ' + t.ka + ' / ' + t.b + ' = ' + t.kb + '</span><span class="why">' + t.exp + '</span>';
        ol.appendChild(li);
      });
      ew.appendChild(btn); ew.appendChild(ol);
      btn.addEventListener('click', function(){
        var open = ol.classList.toggle('open');
        btn.classList.toggle('on', open);
        btn.textContent = open ? '💡 해설 접기' : '💡 어휘 뜻·해설';
        if (open) Array.prototype.forEach.call(ol.children, function(li){ li.classList.add('show'); });
        else if (!state.reveal) syncWordExp(it);
      });
      art.appendChild(ew);
    } else {
      // question explanations live inside each .q
    }
    return art;
  }

  function syncWordExp(it){
    it.wTok.forEach(function(w){
      var li = document.getElementById('el_' + it.id + '_' + w);
      if (!li) return;
      var a = state.answers[keyOf(it,'w',w)];
      var show = (a !== undefined) || state.reveal || state.showAllExp;
      li.classList.toggle('show', show);
      if (a === undefined) return;
      var ok = a === it.tokens[w].ok;
      li.classList.toggle('okc', ok); li.classList.toggle('nox', !ok);
    });
  }
  function paintWord(it, w){
    var t = it.tokens[w], a = state.answers[keyOf(it,'w',w)];
    var wrap = document.getElementById('bw_' + it.id + '_' + w);
    if (!wrap) return;
    wrap.classList.remove('ok','no');
    Array.prototype.forEach.call(wrap.querySelectorAll('.opt'), function(o){
      o.classList.remove('wrong');
      if (a !== undefined && +o.dataset.i === a && a !== t.ok) o.classList.add('wrong');
    });
    if (a !== undefined) wrap.classList.add(a === t.ok ? 'ok' : 'no');
  }
  function paintQ(it, kind, sub){
    var a = state.answers[keyOf(it, kind, sub)];
    var box = document.querySelectorAll('[data-item="' + it.id + '"][data-kind="' + kind + '"][data-sub="' + sub + '"]');
    var q = (kind === 'm') ? it.mc[+sub] : it.tokens[sub];
    var ok = q.ok;
    Array.prototype.forEach.call(box, function(b){
      b.classList.remove('correct','wrong','dim');
      var i = +b.dataset.i;
      if (a === undefined){ return; }
      if (i === ok) b.classList.add('correct');
      else if (i === a) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    var ex = document.getElementById('qe_' + it.id + '_' + sub);
    if (ex){
      if (a === undefined && !state.reveal){ ex.classList.remove('show'); ex.innerHTML = ''; }
      else {
        var right = (a === ok) || (state.reveal && a === undefined);
        ex.classList.add('show');
        ex.classList.toggle('bad', a !== undefined && a !== ok);
        var nm = ['①','②','③','④','⑤'][ok];
        ex.innerHTML = '<b>' + (a === undefined ? '정답 ' : (a === ok ? '정답! ' : '오답 · 정답은 ')) + nm + '</b> '
          + (q.opts ? q.opts[ok] : '') + '<br>' + (q.exp || '');
      }
    }
  }

  function refreshCard(it, kind){
    var el = document.getElementById('c_' + it.id);
    if (!el) return;
    var n = itemCount(it, kind), d = itemDone(it, kind);
    var cnt = document.getElementById('cnt_' + it.id);
    if (cnt) cnt.textContent = d + '/' + n;
    el.classList.toggle('full', d === n); el.classList.toggle('half', d > 0 && d < n);
    var chip = jumpEl.querySelector('[data-jump="' + it.id + '"]');
    if (chip){
      chip.classList.toggle('done', d === n);
      var wrong = false;
      if (kind === 'w') it.wTok.forEach(function(t){ if (isRight(it,'w',t) === false) wrong = true; });
      else if (kind === 'b') it.bTok.forEach(function(t){ if (isRight(it,'b',t) === false) wrong = true; });
      else (it.mc||[]).forEach(function(q,i){ if (isRight(it,'m',i) === false) wrong = true; });
      chip.classList.toggle('hasq', wrong);
    }
  }

  /* count helpers */
  function countAll(items, kind){
    var done = 0, tot = 0;
    items.forEach(function(it){
      if (kind === 'w'){
        tot += it.wTok.length;
        it.wTok.forEach(function(x){ if (state.answers[keyOf(it,'w',x)] !== undefined) done++; });
      } else if (kind === 'b'){
        tot += it.bTok.length;
        it.bTok.forEach(function(x){ if (state.answers[keyOf(it,'b',x)] !== undefined) done++; });
      } else {
        var mc = it.mc || [];
        tot += mc.length;
        mc.forEach(function(q,i){ if (state.answers[keyOf(it,'m',i)] !== undefined) done++; });
      }
    });
    return [done, tot];
  }

  /* ---------- stats ---------- */
  function curItems(){
    var cat = curCat(), kind = state.kind;
    return itemsOf(cat, kind);
  }
  function stats(){
    var cat = curCat(), kind = state.kind;
    var items = cat.items;
    var tot = 0, done = 0, right = 0;
    items.forEach(function(it){
      var n = itemCount(it, kind); tot += n;
      if (kind === 'w') it.wTok.forEach(function(t){ var a = state.answers[keyOf(it,'w',t)]; if (a!==undefined){ done++; if (a===it.tokens[t].ok) right++; } });
      else if (kind === 'b') it.bTok.forEach(function(t){ var a = state.answers[keyOf(it,'b',t)]; if (a!==undefined){ done++; if (a===it.tokens[t].ok) right++; } });
      else (it.mc||[]).forEach(function(q,i){ var a = state.answers[keyOf(it,'m',i)]; if (a!==undefined){ done++; if (a===q.ok) right++; } });
    });
    bar.style.width = (tot ? (done/tot*100) : 0).toFixed(1) + '%';
    var acc = done ? Math.round(right/done*100) : null;
    stat.innerHTML = '<b>' + done + '</b>/' + tot + ' · 정답률 <i>' + (acc===null?'—':acc+'%') + '</i>';
    // cat/kind tab counters
    var kindNow = state.kind;
    DATA.forEach(function(cc){
      var el = catsEl.querySelector('[data-cat="' + cc.cat + '"] span');
      if (!el) return;
      var res = countAll(cc.items, kindNow);
      el.textContent = res[0] + '/' + res[1];
    });
    KINDS.forEach(function(kk){
      var el = kindsEl.querySelector('[data-kind="' + kk.id + '"] span');
      if (!el) return;
      var res = countAll(cat.items, kk.id);
      el.textContent = res[0] + '/' + res[1];
    });
    var gd = 0, gr = 0, gt = 0;
    DATA.forEach(function(c){ c.items.forEach(function(it){
      KINDS.forEach(function(k){
        var n = itemCount(it, k.id); gt += n;
        if (k.id==='w') it.wTok.forEach(function(x){ var a=state.answers[keyOf(it,'w',x)]; if(a!==undefined){gd++; if(a===it.tokens[x].ok) gr++;} });
        else if (k.id==='b') it.bTok.forEach(function(x){ var a=state.answers[keyOf(it,'b',x)]; if(a!==undefined){gd++; if(a===it.tokens[x].ok) gr++;} });
        else (it.mc||[]).forEach(function(q,i){ var a=state.answers[keyOf(it,'m',i)]; if(a!==undefined){gd++; if(a===q.ok) gr++;} });
      });
    }); });
    foot.innerHTML = '전체 <b>' + gt + '</b>문제 중 <b>' + gd + '</b>개 완료 · 정답 <b>' + gr + '</b>개'
      + (gd ? ' · 오답 <b>' + (gd-gr) + '</b>개' : '')
      + '<br><button class="reset2" id="btnReset2">↺ 전체 초기화</button>';
    var r2 = document.getElementById('btnReset2');
    if (r2) r2.addEventListener('click', doReset);
  }

  /* ---------- tabs ---------- */
  DATA.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'cat' + (c.cat===state.cat?' act':''); b.dataset.cat = c.cat;
    b.innerHTML = c.icon + ' ' + c.label + '<span>0/0</span>';
    b.addEventListener('click', function(){ state.cat = c.cat; save(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
    catsEl.appendChild(b);
  });
  KINDS.forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'kind' + (k.id===state.kind?' act':''); b.dataset.kind = k.id;
    b.innerHTML = k.short + '<span>0/0</span>';
    b.addEventListener('click', function(){ state.kind = k.id; save(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
    kindsEl.appendChild(b);
  });

  var TIPS = {
    w: '<b>단어 양자택일</b> · 지문 속 <b>[단어A / 단어B]</b> 중 문맥에 맞는 쪽을 탭하세요. 틀리면 정답이 표시되고 해설이 열립니다.',
    m: '<b>객관식 변형</b> · 지문을 읽고 5지선다를 탭하세요. 즉시 채점되고 아래에 정답 해설이 열립니다.',
    b: '<b>빈칸 문제</b> · 밑줄 친 빈칸 (1)(2)…에 들어갈 말을 고르세요. 지문에 빈칸이 표시됩니다.'
  };

  function ordered(items){
    var key = state.cat + ':' + state.kind;
    var ord = state.order[key];
    if (!ord || ord.length !== items.length) return items.slice();
    var by = {}; items.forEach(function(it){ by[it.id] = it; });
    var out = [];
    ord.forEach(function(id){ if (by[id]){ out.push(by[id]); delete by[id]; } });
    items.forEach(function(it){ if (by[it.id]) out.push(it); });
    return out;
  }

  function renderAll(){
    Array.prototype.forEach.call(catsEl.children, function(b){ b.classList.toggle('act', b.dataset.cat === state.cat); });
    Array.prototype.forEach.call(kindsEl.children, function(b){ b.classList.toggle('act', b.dataset.kind === state.kind); });
    tip.innerHTML = TIPS[state.kind];
    document.getElementById('btnWrong').classList.toggle('on', state.wrongOnly);
    document.getElementById('btnReveal').classList.toggle('on', state.reveal);
    document.body.classList.toggle('reveal', state.reveal);

    listEl.innerHTML = '';
    var items = curItems();
    if (state.wrongOnly){
      items = items.filter(function(it){
        var bad = false;
        if (state.kind==='w') it.wTok.forEach(function(t){ if (isRight(it,'w',t)===false) bad = true; });
        else if (state.kind==='b') it.bTok.forEach(function(t){ if (isRight(it,'b',t)===false) bad = true; });
        else (it.mc||[]).forEach(function(q,i){ if (isRight(it,'m',i)===false) bad = true; });
        return bad;
      });
      if (!items.length){
        listEl.innerHTML = '<div class="empty">이 탭에는 지금 틀린 문제가 없어요 🎉<br>다른 유형·카테고리를 확인해 보세요!</div>';
      }
    }
    ordered(items).forEach(function(it){ listEl.appendChild(buildCard(it, state.kind)); });
    // restore paints
    items.forEach(function(it){
      if (state.kind === 'w'){ it.wTok.forEach(function(w){ paintWord(it, w); }); syncWordExp(it); }
      else if (state.kind === 'b'){ it.bTok.forEach(function(b){ paintQ(it, 'b', b); }); }
      else (it.mc||[]).forEach(function(q, i){ paintQ(it, 'm', i); });
      refreshCard(it, state.kind);
    });

    // jump chips
    var chips = jumpEl.querySelectorAll('.chip[data-jump]:not([data-jump="all"])');
    Array.prototype.forEach.call(chips, function(c){ c.remove(); });
    var allChip = jumpEl.querySelector('[data-jump="all"]');
    var curCatData = catOf(state.cat);
    curCatData.items.forEach(function(it){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.jump = it.id; b.textContent = it.num;
      b.addEventListener('click', function(){ jumpTo(it.id); });
      jumpEl.appendChild(b);
    });
    if (allChip){ allChip.classList.toggle('act', true); }
    stats();
    items.forEach(function(it){ refreshCard(it, state.kind); });
    hdH();
  }

  function setActive(id){
    Array.prototype.forEach.call(jumpEl.querySelectorAll('.chip'), function(ch){
      ch.classList.toggle('act', ch.dataset.jump === (id || 'all'));
    });
  }
  function jumpTo(id){
    var el = document.getElementById('c_' + id);
    if (!el){ toast('지금 탭에 없는 지문이에요'); return; }
    setActive(id);
    el.scrollIntoView({behavior:'smooth', block:'start'});
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); }, 1100);
  }
  function hdH(){
    var h = document.getElementById('hd').offsetHeight;
    document.documentElement.style.setProperty('--hdh', h + 'px');
  }

  /* ---------- answering ---------- */
  function onAnswer(it, kind, sub, i){
    if (state.reveal){ toast('정답 보기 중이에요. 끄고 풀어 보세요!'); return; }
    var k = keyOf(it, kind, sub);
    if (state.answers[k] !== undefined) return;
    state.answers[k] = i;
    save();
    if (kind === 'w'){ paintWord(it, sub); syncWordExp(it); }
    else paintQ(it, kind, sub);
    refreshCard(it, kind); stats();
  }
  listEl.addEventListener('click', function(ev){
    var btn = ev.target.closest ? ev.target.closest('button[data-item]') : null;
    if (!btn) return;
    var it = ITEMS[btn.dataset.item];
    if (!it) return;
    onAnswer(it, btn.dataset.kind, btn.dataset.sub, +btn.dataset.i);
  });

  /* tool buttons */
  document.getElementById('btnShuffle').addEventListener('click', function(){
    var items = curItems().map(function(it){ return it.id; });
    for (var i = items.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = items[i]; items[i] = items[j]; items[j] = t; }
    state.order[state.cat + ':' + state.kind] = items;
    save(); renderAll(); window.scrollTo({top:0, behavior:'smooth'});
    toast('🔀 ' + curCat().label + ' · ' + (state.kind==='w'?'단어':(state.kind==='m'?'객관식':'빈칸')) + ' 순서를 섞었어요');
  });
  document.getElementById('btnWrong').addEventListener('click', function(){
    state.wrongOnly = !state.wrongOnly; save(); renderAll();
    toast(state.wrongOnly ? '✗ 틀린 지문만 모았어요' : '전체 지문을 다시 보여요');
  });
  document.getElementById('btnReveal').addEventListener('click', function(){
    state.reveal = !state.reveal; save(); renderAll();
    toast(state.reveal ? '👁 정답과 해설을 모두 펼쳤어요' : '다시 풀 준비 완료!');
  });
  function doReset(){
    if (!confirm('모든 정답 기록과 순서를 처음 상태로 되돌릴까요?')) return;
    state.answers = {}; state.order = {}; state.wrongOnly = false; state.reveal = false;
    save(); renderAll(); window.scrollTo({top:0, behavior:'smooth'});
    toast('↺ 처음 상태로 되돌렸어요');
  }
  document.getElementById('btnReset').addEventListener('click', doReset);
  jumpEl.querySelector('[data-jump="all"]');
  var allChipEl = document.querySelector('[data-jump="all"]');
  if (allChipEl) allChipEl.addEventListener('click', function(){
    setActive('all'); window.scrollTo({top:0, behavior:'smooth'});
  });

  renderAll();
  window.addEventListener('resize', hdH);
  window.addEventListener('orientationchange', function(){ setTimeout(hdH, 250); });
})();
</script>
</body>
</html>
