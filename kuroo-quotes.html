*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
  margin:0;padding:0;min-height:100dvh;overflow-x:hidden;
  background:#0a0204;color:#fff;
  font-family:'KTalk',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
body{
  background:
    radial-gradient(65% 42% at 50% 42%, rgba(230,38,60,.34), rgba(230,38,60,0) 70%),
    radial-gradient(50% 35% at 85% 15%, rgba(255,190,65,.18), rgba(255,190,65,0) 70%),
    linear-gradient(rgba(255,55,75,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,55,75,.08) 1px, transparent 1px),
    linear-gradient(180deg,#080103 0%,#1f0409 48%,#090103 100%);
  background-size:100% 100%, 100% 100%, 26px 26px, 26px 26px, 100% 100%;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wrap{
  position:relative;z-index:2;min-height:100dvh;max-width:440px;margin:0 auto;
  padding:10px 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}

/* 상단 코너 장식 + 네코마 전광판 */
.top-bar{width:100%;display:flex;align-items:flex-start;justify-content:space-between;padding:0 2px;margin-bottom:-36px;position:relative;z-index:5;pointer-events:none}
.top-bar > *{pointer-events:auto}
.paw-badge{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;letter-spacing:.12em;color:#ff5468;font-weight:700;line-height:1.1}
.paw-badge .p-ico{font-size:20px;filter:drop-shadow(0 0 8px rgba(255,60,80,.7))}
.sound-btn{
  width:34px;height:34px;border-radius:9px;border:1.5px solid rgba(255,255,255,.35);
  background:rgba(16,4,7,.92);color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center;
}

.board{
  width:79%;background:linear-gradient(180deg,#1a060b 0%,#080203 100%);
  border:2px solid rgba(255,68,88,.85);
  clip-path:polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  padding:10px 20px;
  box-shadow:0 0 30px rgba(255,40,65,.45), inset 0 0 18px rgba(255,65,85,.25);
  text-align:center;position:relative;
}
.dots-l,.dots-r{
  position:absolute;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;
}
.dots-l{left:9px} .dots-r{right:9px}
.dots-l i,.dots-r i{width:4px;height:4px;border-radius:50%;background:rgba(255,110,125,.6);display:block}
.b-sub{font-size:10px;letter-spacing:.20em;color:#ffe0e3;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.b-sub::before,.b-sub::after{content:"";width:18px;height:2px;background:#ff3b52;display:inline-block}
.b-main{
  font-family:'KTitle',monospace;font-size:24px;letter-spacing:.04em;line-height:1.12;margin:3px 0 2px;
  color:#ff4b5e;
  text-shadow:0 0 8px rgba(255,55,75,.9), 0 0 18px rgba(255,140,90,.6);
}
.b-cap{font-size:9.5px;letter-spacing:.24em;color:rgba(255,220,225,.78)}

.counter-row{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;
}
.counter-pill{
  background:#120407;border:1.5px solid rgba(255,80,98,.65);border-radius:8px;
  padding:4px 16px;font-family:'KTitle',monospace;font-size:18px;letter-spacing:.10em;color:#fff;
  box-shadow:0 0 16px rgba(255,45,70,.32), inset 0 0 8px rgba(255,60,80,.2);
}
.counter-pill span{color:#ff4057}

/* 중앙 육각 프레임 + 튀어나온 쿠로오 */
.stage{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;margin-top:4px}
.hex-stage{
  position:relative;width:min(315px,80vw);height:min(315px,80vw);
  display:flex;align-items:flex-end;justify-content:center;cursor:pointer;
  transition:transform .16s cubic-bezier(.2,1.5,.5,1);
}
.hex-stage:active{transform:scale(.95)}
.hex-stage.spike{animation:spikePop .36s cubic-bezier(.18,1.5,.4,1)}
@keyframes spikePop{
  0%{transform:scale(1)}
  35%{transform:scale(1.06) rotate(-1.5deg)}
  70%{transform:scale(.97) rotate(1deg)}
  100%{transform:scale(1)}
}
.hex-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.kuroo-cutout{
  position:relative;z-index:2;height:96%;width:auto;max-width:90%;
  object-fit:contain;margin-bottom:14px;
  filter:drop-shadow(0 0 16px rgba(255,55,75,.35)) drop-shadow(0 8px 18px rgba(0,0,0,.75));
  pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 72%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(180deg,#000 72%, rgba(0,0,0,0) 100%);
}
.tag-kanji{
  position:absolute;left:12px;top:36%;z-index:3;
  writing-mode:vertical-rl;font-size:12px;letter-spacing:.18em;
  color:rgba(255,235,215,.9);border:1px solid rgba(255,110,125,.5);
  background:rgba(14,3,6,.82);padding:6px 4px;border-radius:5px;
}
.tag-tsunage{
  position:absolute;right:18px;top:30%;z-index:3;
  writing-mode:vertical-rl;font-family:'KTalk',sans-serif;font-size:28px;font-weight:700;
  color:rgba(255,80,98,.68);text-shadow:0 0 14px rgba(255,40,65,.65);
  pointer-events:none;
}

/* 시안 동일 삐죽삐죽 만화 임팩트 말풍선 SVG */
.comic-wrap{
  position:relative;width:100%;margin-top:-30px;z-index:4;cursor:pointer;
  padding:22px 26px 24px;min-height:112px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.75));
}
.comic-wrap.pop{animation:bubblePop .28s ease}
@keyframes bubblePop{
  0%{transform:scale(.94)}
  55%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
.bubble-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.q-text{
  position:relative;z-index:1;
  font-family:'KTalk',sans-serif;font-size:23px;line-height:1.36;word-break:keep-all;
  color:#180509;text-align:center;padding:4px 6px;
}
.q-mark{
  position:absolute;z-index:2;font-family:'KTitle',monospace;font-size:34px;line-height:1;
  color:#ff2d46;-webkit-text-stroke:1.5px #180509;pointer-events:none;
}
.q-mark.open{top:2px;left:18px}
.q-mark.close{bottom:0;right:18px}
</style>
</head>

      r: 1.5 + Math.random() * 2.5, a: .3 + Math.random() * .6
    });
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    var cx = W * .5, cy = H * .44;
    var count = 48;

      var inner = Math.min(W, H) * (0.36 - flash * 0.09);
      var outer = Math.max(W, H) * 0.95;
      ctx.strokeStyle = 'rgba(255, 240, 242, ' + (0.09 + flash * 0.28) + ')';
      ctx.lineWidth = (i % 3 === 0 ? 2.2 : 1.0) + flash * 2.4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
      ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
      ctx.stroke();
    }
    ctx.restore();
    if (flash > 0) flash = Math.max(0, flash - 0.045);

    for (var j = 0; j < sparks.length; j++) {
      var p = sparks[j];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }

      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  function tryPlay(){
    if (!wantSound) return;
    var p = initAudio().play();
    if (p && p.catch) p.catch(function(){});
  }

  function nextQuote(){
