    linear-gradient(rgba(255,60,80,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,60,80,.07) 1px, transparent 1px),
    linear-gradient(180deg,#0c0204 0%,#22060c 48%,#120307 100%);
  background-size:100% 100%, 100% 100%, 28px 28px, 28px 28px, 100% 100%;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{
  position:relative;z-index:2;min-height:100dvh;max-width:460px;margin:0 auto;
  padding:12px 14px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}

/* 상단 네코마 전광판 */
.board{
  width:100%;background:linear-gradient(180deg,#1a070b,#0d0305);
  border:1.5px solid rgba(255,75,95,.55);border-radius:16px;padding:9px 14px;
  box-shadow:0 0 22px rgba(255,45,70,.25), inset 0 0 12px rgba(255,70,90,.15);
  display:flex;align-items:center;justify-content:center;gap:18px;
}
.b-left{display:flex;flex-direction:column;gap:1px}
.b-sub{font-size:10.5px;letter-spacing:.16em;color:#ff9aa6;font-weight:700}
.b-main{
  font-family:'KTitle',sans-serif;font-size:21px;letter-spacing:.04em;line-height:1.1;
  background:linear-gradient(180deg,#fff 10%,#ff8c99 65%,#ffd166 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(255,70,90,.55));
}
.b-right{display:flex;align-items:center;gap:8px}
.counter{
  background:#1f090e;border:1px solid rgba(255,100,115,.45);border-radius:10px;
  padding:5px 10px;font-family:'KTitle',sans-serif;font-size:15px;letter-spacing:.08em;color:#ffd166;
  box-shadow:inset 0 0 8px rgba(255,60,80,.2);
}
.counter span{color:#ff5468}
.sound-btn{
  width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,110,125,.5);
  background:rgba(40,10,16,.85);color:#fff;font-size:16px;cursor:pointer;
  display:grid;place-items:center;
}

/* 중앙 육각 프레임 + 쿠로오 일러스트 */
.stage{
  position:relative;width:100%;display:flex;flex-direction:column;align-items:center;margin:2px 0;
}
.hex-wrap{
  position:relative;width:min(265px,66vw);height:min(275px,68vw);
  display:grid;place-items:center;cursor:pointer;
  transition:transform .16s cubic-bezier(.2,1.5,.5,1);
}
.hex-wrap:active{transform:scale(.95)}
.hex-wrap.spike{animation:spikePop .36s cubic-bezier(.18,1.5,.4,1)}
@keyframes spikePop{
  0%{transform:scale(1)}
  35%{transform:scale(1.07) rotate(-2deg)}
  70%{transform:scale(.97) rotate(1deg)}
  100%{transform:scale(1)}
}
.hex-border{
  position:absolute;inset:0;
  clip-path:polygon(50% 2%, 96% 26%, 96% 74%, 50% 98%, 4% 74%, 4% 26%);
  background:linear-gradient(135deg,#ff3b52,#ffd166,#ff2a46);
  padding:3px;
  box-shadow:0 0 32px rgba(255,55,75,.55);
}
.hex-inner{
  width:100%;height:100%;
  clip-path:polygon(50% 2%, 96% 26%, 96% 74%, 50% 98%, 4% 74%, 4% 26%);
  background:radial-gradient(circle at 50% 42%, #42111b 0%, #1c060b 75%, #0c0204 100%);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  position:relative;
}
.hex-inner img{
  height:92%;width:auto;object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));
  pointer-events:none;
}
.tag-kanji{
  position:absolute;left:14px;top:38%;
  writing-mode:vertical-rl;font-size:11px;letter-spacing:.18em;
  color:rgba(255,215,170,.75);border:1px solid rgba(255,110,125,.35);
  background:rgba(18,4,8,.72);padding:5px 3px;border-radius:6px;
}

/* 만화 뾰족 말풍선 */
.comic-bubble{
  position:relative;width:100%;margin-top:-14px;z-index:3;
  background:#fff;color:#1b080d;border:3px solid #1b080d;border-radius:20px;
  padding:15px 18px;text-align:center;min-height:82px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  box-shadow:0 8px 0 #ff334b, 0 14px 28px rgba(0,0,0,.55);
  transition:transform .18s ease;
}
.comic-bubble::before{
  content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:14px solid #1b080d;
}
.comic-bubble::after{
  content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:11px solid #fff;
}
.q-cat{
  font-size:11px;letter-spacing:.08em;padding:2px 9px;border-radius:999px;
  background:#ff2e48;color:#fff;font-weight:700;
}
.q-text{
  font-family:'KTalk',sans-serif;font-size:18.5px;line-height:1.42;word-break:keep-all;
  color:#19060a;
}
.comic-bubble.pop{animation:bubblePop .28s ease}
@keyframes bubblePop{
  0%{transform:scale(.94)}
  55%{transform:scale(1.03)}
  100%{transform:scale(1)}
}

/* 하단 카테고리 + 스파이크 버튼 */
.controls{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:4px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-btn{
  background:rgba(30,8,13,.88);border:1.5px solid rgba(255,90,108,.35);border-radius:13px;
  padding:8px 4px;color:#ffd8dc;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'KTalk',sans-serif;font-size:12.5px;transition:all .15s;
}
.cat-btn .ico{font-size:17px}
.cat-btn.active{
  background:linear-gradient(180deg,#5c111e,#2b070e);
  border-color:#ff5468;color:#fff;
  box-shadow:0 0 14px rgba(255,55,75,.45);transform:translateY(-1px);
}
.spike-btn{
  width:100%;border:2px solid #ff6b7c;border-radius:999px;padding:12px 18px;
  background:linear-gradient(90deg,#b81228 0%,#ef2942 50%,#ff6b3d 100%);
  color:#fff;font-family:'KTitle',sans-serif;font-size:18px;letter-spacing:.04em;
  cursor:pointer;box-shadow:0 0 22px rgba(255,55,75,.5);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.spike-btn:active{transform:scale(.97)}
</style>
</head>

  // Manga speed lines + crimson spark particles canvas
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, flash = 0;
  var sparks = [];
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for (var i = 0; i < 28; i++) {
    sparks.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .6, vy: -0.4 - Math.random() * 1.1,
      r: 1.5 + Math.random() * 2.5, a: .3 + Math.random() * .6
    });
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    // Subtle manga radial speed lines from center
    var cx = W * .5, cy = H * .36;
    var count = 36;
    ctx.save();
    for (var i = 0; i < count; i++) {
      var ang = (i / count) * Math.PI * 2 + (flash * 0.05);
      var inner = Math.min(W, H) * (0.34 - flash * 0.08);
      var outer = Math.max(W, H) * 0.95;
      ctx.strokeStyle = 'rgba(255, 220, 225, ' + (0.05 + flash * 0.22) + ')';
      ctx.lineWidth = 1 + flash * 2.2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
      ctx.lineTo(cx + Math.cos(ang) * outer, cy + Math.sin(ang) * outer);
      ctx.stroke();
    }
    ctx.restore();

    if (flash > 0) flash = Math.max(0, flash - 0.045);

    for (var j = 0; j < sparks.length; j++) {
      var p = sparks[j];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      ctx.fillStyle = (j % 3 === 0) ? 'rgba(255,209,102,' + p.a + ')' : 'rgba(255,75,95,' + p.a + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

    return audio;
  }
  function tryPlay(){
    if (!wantSound) return;
    var a = initAudio();
    var p = a.play();
    if (p && p.catch) p.catch(function(){});
  }
  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (wantSound) {
      wantSound = false; soundBtn.textContent = '🔇';
      if (audio) audio.pause();
    } else {
      wantSound = true; soundBtn.textContent = '🔊';
      tryPlay();
    }
  });

  function showQuote(nextIdx){
    curIdx = nextIdx;
    var q = QUOTES[curIdx];
    idxEl.textContent = String(curIdx + 1).padStart(2, '0');
    qCatEl.textContent = q.cat;
    qTextEl.textContent = q.text;
    flash = 1.0;

    hero.classList.remove('spike'); void hero.offsetWidth; hero.classList.add('spike');
    bubbleBox.classList.remove('pop'); void bubbleBox.offsetWidth; bubbleBox.classList.add('pop');
    tryPlay();
  }

  function nextFromCat(cat){
    var pool = [];
    for (var i = 0; i < QUOTES.length; i++) {
      if (cat === '전체' || QUOTES[i].cat === cat || (cat === '마인드' && QUOTES[i].cat === '리더십') || (cat === '배구' && QUOTES[i].cat === '네코마')) {
        pool.push(i);
      }
    }
    if (pool.length === 0) pool = [0];
    var candidates = pool.filter(function(i){ return i !== curIdx; });
    if (candidates.length === 0) candidates = pool;
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    showQuote(pick);
  }

  catBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      catBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentCat = btn.getAttribute('data-cat');
      nextFromCat(currentCat);
    });
  });

  hero.addEventListener('click', function(){ nextFromCat(currentCat); });
  bubbleBox.addEventListener('click', function(){ nextFromCat(currentCat); });
  spikeBtn.addEventListener('click', function(){ nextFromCat('전체'); });

  setTimeout(function(){ initAudio(); }, 260);
})();
</script>
